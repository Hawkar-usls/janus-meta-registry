name: TEMP JPFM-2F-B2 one-tile shape diagnostic

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/_tmp_jpfm_2f_b2_shape_diag.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install replay dependencies
        run: |
          sudo apt-get update >/dev/null
          sudo apt-get install -y source-extractor psfex >/dev/null
          if ! command -v sex >/dev/null 2>&1; then sudo ln -sf "$(command -v source-extractor)" /usr/local/bin/sex; fi
          python -m pip install -q numpy==2.2.6 pandas==2.3.1 scipy==1.16.1 requests==2.32.4 astropy==8.0.1 photutils==3.0.0 opencv-python-headless==5.0.0.93 'fsspec[http]==2026.6.0'
          git clone -q --filter=blob:none --no-checkout https://github.com/jannefi/poss1-plate-slice.git work/poss1-src
          git -C work/poss1-src checkout -q 4005e200541b321ead3d6608f0162a14430ef1c2
      - name: Diagnose first frozen B2 source without changing B2
        run: |
          python - <<'PY'
          import sys
          from pathlib import Path
          import pandas as pd
          sys.path.insert(0, str(Path('tools/palomar').resolve()))
          import jpfm_2f_b2_tile_lineage_replay as b2
          manifest, s0 = b2.load_inputs(Path('data/JANUS-PALOMAR-JPFM-2F-A-BLIND-STRUCTURAL-CLUSTER-MANIFEST-RUN-001.csv.gz'))
          sample = b2.select_same_64(manifest)
          sample = sample.merge(s0[['src_id','tile_id','object_id','ra','dec','plate_id']], on='src_id', validate='one_to_one')
          one = sample.sort_values(['structural_cluster','sample_role','src_id'], kind='stable').head(1).copy()
          print('DIAG_SOURCE', one[['src_id','tile_id','object_id','plate_id']].to_dict('records')[0])
          work = Path('work/diag'); tiles_root = work/'tiles'; work.mkdir(parents=True, exist_ok=True)
          tr = b2.reconstruct_tiles(one, Path('work/poss1-src'), tiles_root)
          print('TILE_REPLAY', tr.to_dict('records'))
          dr = b2.run_detection_one(tr.iloc[0].to_dict(), Path('work/poss1-src'), tiles_root)
          print('DETECTION', dr)
          aud = b2.audit_sample_against_pass2(one, tiles_root)
          print('AUDIT', aud.to_dict('records'))
          shape, meta = b2.run_upstream_shape(one, Path('work/poss1-src'), work, tiles_root)
          print('SHAPE_META', meta)
          print('SHAPE_ROWS', shape.to_dict('records') if len(shape) else [])
          PY
