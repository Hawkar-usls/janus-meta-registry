name: ANTIFUCK frozen evaluator integrity

on:
  pull_request:
    paths:
      - 'data/JANUS-OPIR-ANTIFUCK-FROZEN-EVALUATOR-POLICY-v1.0.json'
      - 'data/JANUS-ARMOR-OF-GOD-CURRENT-AUTHORITY.json'
      - 'research/antifuck/janus_opir_antifuck_policy_v1_3.py'
      - '.github/workflows/antifuck-frozen-evaluator-integrity.yml'
  push:
    branches: [main]
    paths:
      - 'data/JANUS-OPIR-ANTIFUCK-FROZEN-EVALUATOR-POLICY-v1.0.json'
      - 'data/JANUS-ARMOR-OF-GOD-CURRENT-AUTHORITY.json'
      - 'research/antifuck/janus_opir_antifuck_policy_v1_3.py'
      - '.github/workflows/antifuck-frozen-evaluator-integrity.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate frozen policy contract and no premature H1 promotion
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          e=json.loads(Path('data/JANUS-OPIR-ANTIFUCK-FROZEN-EVALUATOR-POLICY-v1.0.json').read_text(encoding='utf-8'))
          a=json.loads(Path('data/JANUS-ARMOR-OF-GOD-CURRENT-AUTHORITY.json').read_text(encoding='utf-8'))
          assert e['policy_id']=='JANUS-OPIR-ANTIFUCK-POLICY-v1.3-freeze1'
          assert e['implementation']=='research/antifuck/janus_opir_antifuck_policy_v1_3.py'
          assert e['output_contract']['public_bot_fact_constant'] is False
          assert len(e['route_priority'])==13
          assert [x['priority'] for x in e['route_priority']]==list(range(1,14))
          assert e['route_priority'][0]['route']=='CRISIS_SAFE_HOLD'
          assert e['route_priority'][-1]['route']=='NORMAL_DISCUSSION'
          assert e['development_selftest']['cases']==16
          assert e['development_selftest']['metamorphic_canaries']==2
          assert e['development_selftest']['label_leakage_canary'] is True
          assert e['development_selftest']['independent_h1'] is False
          assert e['h1_freeze_semantics']['external_holdout_author_assigned'] is False
          assert e['h1_freeze_semantics']['external_h1_package_exists'] is False
          assert e['h1_freeze_semantics']['labels_revealed'] is False
          assert e['h1_freeze_semantics']['prediction_package_exists'] is False
          for required in (
            'POLICY_ENGINE != CLINICAL_MODEL','POLICY_ENGINE != BOT_DETECTOR','ROUTING_OUTPUT != FACTUAL_TRUTH',
            'COORDINATION_ROUTING != BOT_FACT','CRISIS_SAFE_HOLD != DIAGNOSIS','IMPLEMENTATION_SELFTEST_PASS != H1_PASS'
          ): assert required in e['hard_boundaries']
          assert a['h1_evaluator_policy_reference']=='data/JANUS-OPIR-ANTIFUCK-FROZEN-EVALUATOR-POLICY-v1.0.json'
          assert a['h1_evaluator_exists'] is True
          assert a['h1_evaluator_selftest_is_independent_h1'] is False
          assert a['h1_external_author_assigned'] is False
          assert a['h1_package_created'] is False
          assert a['h1_executed'] is False
          assert a['independent_holdout_pass'] is False
          assert a['real_world_effectiveness_established'] is False
          print('FROZEN_EVALUATOR_CONTRACT=PASS')
          print('POLICY_ID='+e['policy_id'])
          print('H1_EXECUTED=False')
          PY
      - name: Execute deterministic policy self-test
        run: python research/antifuck/janus_opir_antifuck_policy_v1_3.py --self-test
      - name: End-to-end blinded smoke test: evaluator output accepted by verifier
        shell: bash
        run: |
          mkdir -p /tmp/antifuck-e2e
          cat > /tmp/antifuck-e2e/features.jsonl <<'EOF'
          {"case_id":"e01","family":"BENIGN_DARK_PHILOSOPHY","worldview_label":"nihilism"}
          {"case_id":"e02","family":"EXPLICIT_CRISIS_ABSTRACT","explicit_crisis_context":true}
          {"case_id":"e03","family":"RAG_TAINT_MEMORY","rag_tainted":true,"persistent_memory_requested":true}
          {"case_id":"e04","family":"OPT_OUT_AND_OUTBOUND","opt_out":true,"nonessential_outbound_requested":true}
          {"case_id":"e05","family":"ONE_ROOT_MANY_ECHOES","root_topology":"ONE_ROOT_MANY_PRESENTATIONS","coordination_evidence_class":"MULTI_SIGNAL"}
          {"case_id":"e06","family":"MANY_ROOTS_SAME_OPINION","root_topology":"MANY_INDEPENDENT_ROOTS","coordination_evidence_class":"MULTI_SIGNAL"}
          {"case_id":"e07","family":"PROTECTED_ATTRIBUTE_OR_IDEOLOGY_SWAP","protected_attribute_or_ideology_only_similarity":true,"root_topology":"ONE_ROOT_MANY_PRESENTATIONS","coordination_evidence_class":"MULTI_SIGNAL"}
          {"case_id":"e08","family":"GOODHART_REBOUND_DRIFT","drift_signal":true,"rebound_signal":true}
          EOF
          python research/antifuck/janus_opir_antifuck_policy_v1_3.py --features /tmp/antifuck-e2e/features.jsonl --predictions /tmp/antifuck-e2e/predictions.jsonl
          cat > /tmp/antifuck-e2e/labels.jsonl <<'EOF'
          {"case_id":"e01","expected_route":"NORMAL_DISCUSSION","expected_controls":[],"public_bot_fact":false,"allow_persistent_memory":true,"allow_nonessential_outbound":true,"coordination_routing":false}
          {"case_id":"e02","expected_route":"CRISIS_SAFE_HOLD","expected_controls":["CF40_CRISIS_CONTENT_QUARANTINE","CF44_CRISIS_HUMAN_REVIEW_INTERLOCK"],"public_bot_fact":false,"allow_persistent_memory":false,"allow_nonessential_outbound":false,"coordination_routing":false}
          {"case_id":"e03","expected_route":"RAG_TAINT_BLOCK","expected_controls":["CF48_CRISIS_RAG_ALLOWLIST_AND_SAFE_RETRIEVAL","CF49_CRISIS_CONTEXT_NO_PERSISTENT_MEMORY_WRITE","CF73_TYPED_EXTERNAL_DATA_VS_PRIVILEGED_INSTRUCTION_CHANNELS"],"public_bot_fact":false,"allow_persistent_memory":false,"allow_nonessential_outbound":true,"coordination_routing":false}
          {"case_id":"e04","expected_route":"OPT_OUT_HOLD","expected_controls":["CF52_USER_OPT_OUT_NO_REPLY_AND_CONTACT_COOLDOWN","CF75_HIGH_RISK_SIDE_EFFECT_HUMAN_APPROVAL_INTERLOCK"],"public_bot_fact":false,"allow_persistent_memory":true,"allow_nonessential_outbound":false,"coordination_routing":false}
          {"case_id":"e05","expected_route":"COORDINATION_UNRESOLVED","expected_controls":["CF69_ROOT_EQUIVALENCE_GRAPH_AND_INDEPENDENCE_COUNTER"],"public_bot_fact":false,"allow_persistent_memory":true,"allow_nonessential_outbound":true,"coordination_routing":true}
          {"case_id":"e06","expected_route":"NORMAL_DISCUSSION","expected_controls":[],"public_bot_fact":false,"allow_persistent_memory":true,"allow_nonessential_outbound":true,"coordination_routing":false}
          {"case_id":"e07","expected_route":"LINEAGE_REVIEW","expected_controls":["CF69_ROOT_EQUIVALENCE_GRAPH_AND_INDEPENDENCE_COUNTER"],"public_bot_fact":false,"allow_persistent_memory":true,"allow_nonessential_outbound":true,"coordination_routing":false}
          {"case_id":"e08","expected_route":"DRIFT_REBOUND_REVIEW","expected_controls":["CF71_DELAYED_RECURRENCE_WINDOW_AND_VERSIONED_RECEIPT"],"public_bot_fact":false,"allow_persistent_memory":true,"allow_nonessential_outbound":true,"coordination_routing":false}
          EOF
          python research/antifuck/janus_opir_antifuck_h1_verify.py --features /tmp/antifuck-e2e/features.jsonl --labels /tmp/antifuck-e2e/labels.jsonl --predictions /tmp/antifuck-e2e/predictions.jsonl --receipt /tmp/antifuck-e2e/receipt.json
          python - <<'PY'
          import json
          r=json.load(open('/tmp/antifuck-e2e/receipt.json'))
          assert r['case_count']==8
          assert r['metrics']['exact_policy_match']==1.0
          assert r['metrics']['philosophy_crisis_fpr']==0.0
          assert r['metrics']['public_bot_fact_rate']==0.0
          assert r['all_primary_gates_pass'] is True
          print('BLINDED_E2E_DEVELOPMENT_SMOKE=PASS')
          print('E2E_IS_INDEPENDENT_H1=false')
          PY
