name: ANTIFUCK frozen evaluator integrity

on:
  pull_request:
    paths:
      - 'data/JANUS-OPIR-ANTIFUCK-FROZEN-EVALUATOR-POLICY-v1.0.json'
      - 'data/JANUS-OPIR-ANTIFUCK-FROZEN-EVALUATOR-SELFTEST-RESULT-2026-08-15-v1.0.json'
      - 'data/JANUS-ARMOR-OF-GOD-CURRENT-AUTHORITY.json'
      - 'research/antifuck/janus_opir_antifuck_policy_v1_3.py'
      - 'research/antifuck/janus_opir_antifuck_blinded_e2e_smoke_v1.py'
      - '.github/workflows/antifuck-frozen-evaluator-integrity.yml'
  push:
    branches: [main]
    paths:
      - 'data/JANUS-OPIR-ANTIFUCK-FROZEN-EVALUATOR-POLICY-v1.0.json'
      - 'data/JANUS-OPIR-ANTIFUCK-FROZEN-EVALUATOR-SELFTEST-RESULT-2026-08-15-v1.0.json'
      - 'data/JANUS-ARMOR-OF-GOD-CURRENT-AUTHORITY.json'
      - 'research/antifuck/janus_opir_antifuck_policy_v1_3.py'
      - 'research/antifuck/janus_opir_antifuck_blinded_e2e_smoke_v1.py'
      - '.github/workflows/antifuck-frozen-evaluator-integrity.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate frozen evaluator contract and exact development certificate
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          e=json.loads(Path('data/JANUS-OPIR-ANTIFUCK-FROZEN-EVALUATOR-POLICY-v1.0.json').read_text(encoding='utf-8'))
          c=json.loads(Path('data/JANUS-OPIR-ANTIFUCK-FROZEN-EVALUATOR-SELFTEST-RESULT-2026-08-15-v1.0.json').read_text(encoding='utf-8'))
          a=json.loads(Path('data/JANUS-ARMOR-OF-GOD-CURRENT-AUTHORITY.json').read_text(encoding='utf-8'))
          assert e['status']=='FROZEN_IMPLEMENTATION_CANDIDATE_AWAITING_MERGE_COMMIT_BINDING'
          assert e['policy_id']=='JANUS-OPIR-ANTIFUCK-POLICY-v1.3-freeze1'
          assert e['output_contract']['public_bot_fact_constant'] is False
          assert len(e['route_priority'])==13 and [x['priority'] for x in e['route_priority']]==list(range(1,14))
          assert e['development_selftest']['cases']==16 and e['development_selftest']['metamorphic_canaries']==4
          assert e['development_selftest']['label_leakage_canary'] is True and e['development_selftest']['independent_h1'] is False
          assert e['missing_metadata_semantics']['correction_visible_missing']=='UNKNOWN_DO_NOT_ASSERT_ORPHANING'
          for required in ('POLICY_ENGINE != CLINICAL_MODEL','POLICY_ENGINE != BOT_DETECTOR','ROUTING_OUTPUT != FACTUAL_TRUTH','COORDINATION_ROUTING != BOT_FACT','CRISIS_SAFE_HOLD != DIAGNOSIS','IMPLEMENTATION_SELFTEST_PASS != H1_PASS','MISSING_METADATA != NEGATIVE_EVIDENCE'):
            assert required in e['hard_boundaries']

          assert c['status']=='FROZEN_EVALUATOR_DEVELOPMENT_PASS_NOT_INDEPENDENT_H1'
          ident=c['execution_identity']
          assert ident=={
            'pull_request':88,
            'branch':'research/antifuck-frozen-evaluator-v1',
            'tested_head_sha':'be0d3ff3a95e3ac8b81ea167b25c43bac985ad1a',
            'tested_pr_merge_ref_sha':'349b9ad8c19a822f40edc4b0c19c6a9194080d01',
            'workflow_name':'ANTIFUCK frozen evaluator integrity',
            'workflow_run_id':31886088525,
            'job_id':95015487029
          }
          assert c['contract_result']=={'FROZEN_EVALUATOR_CONTRACT':'PASS','POLICY_ID':'JANUS-OPIR-ANTIFUCK-POLICY-v1.3-freeze1','H1_EXECUTED':False}
          assert c['policy_selftest_result']=={
            'OPIR_POLICY_SELFTEST':'PASS','POLICY_ID':'JANUS-OPIR-ANTIFUCK-POLICY-v1.3-freeze1','DEVELOPMENT_CASES':16,
            'METAMORPHIC_CANARIES':4,'LABEL_LEAKAGE_CANARY':'PASS','SELFTEST_IS_INDEPENDENT_H1':False
          }
          assert c['blinded_e2e_result']=={
            'BLINDED_E2E_DEVELOPMENT_SMOKE':'PASS','E2E_CASES':8,'EXACT_POLICY_MATCH':1.0,
            'PHILOSOPHY_CRISIS_FPR':0.0,'PUBLIC_BOT_FACT_RATE':0.0,'E2E_IS_INDEPENDENT_H1':False
          }
          assert c['engineering_corrections_in_certified_head']['yaml_zero_job_failure_predecessor_run']==31885912932
          assert c['current_h1_state']['H1_executed'] is False and c['current_h1_state']['independent_holdout_pass'] is False
          assert 'INDEPENDENT_SYNTHETIC_HOLDOUT_PASS' in c['claim_ceiling']['forbidden_promotions']

          assert a['h1_evaluator_selftest_result_reference']=='data/JANUS-OPIR-ANTIFUCK-FROZEN-EVALUATOR-SELFTEST-RESULT-2026-08-15-v1.0.json'
          assert a['h1_evaluator_development_selftest_pass'] is True
          assert a['h1_evaluator_development_e2e_pass'] is True
          assert a['h1_evaluator_selftest_is_independent_h1'] is False
          assert a['h1_external_author_assigned'] is False
          assert a['h1_package_created'] is False
          assert a['h1_predictions_created'] is False
          assert a['h1_labels_revealed'] is False
          assert a['h1_executed'] is False
          assert a['independent_holdout_pass'] is False
          assert a['real_world_effectiveness_established'] is False
          print('FROZEN_EVALUATOR_CERTIFICATE=PASS')
          print('POLICY_ID='+e['policy_id'])
          print('H1_EXECUTED=False')
          print('SELFTEST_IS_INDEPENDENT_H1=False')
          PY
      - name: Replay deterministic label-blind policy self-test
        run: python research/antifuck/janus_opir_antifuck_policy_v1_3.py --self-test
      - name: Replay blinded evaluator to verifier development smoke
        run: python research/antifuck/janus_opir_antifuck_blinded_e2e_smoke_v1.py
