name: ANTIFUCK H1 challenge toolchain integrity

on:
  pull_request:
    paths:
      - 'data/MINDFUCK.json'
      - 'data/JANUS-MINDFUCK-ADAPTIVE-PRESSURE-AND-EVASION-AUDIT-MODEL-v1.3.json'
      - 'data/JANUS-ARMOR-OF-GOD-ADVERSARIAL-RECOVERY-AND-ANTI-PARANOIA-v2.4.json'
      - 'data/JANUS-ARMOR-OF-GOD-FUNDAMENTUM-EPISTEMIC-WITNESS-TRUTH-GUARD-v2.5.json'
      - 'data/JANUS-GENESIS-ARMOR-FUNDAMENTUM-TRUTH-RUNTIME-HUMAN-APPEAL-AND-FROZEN-HOLDOUT-CERTIFICATE-2026-08-16-v1.0.json'
      - 'data/Janus_OPIR_ANTIFUCK-v1.3.json'
      - 'data/JANUS-OPIR-ANTIFUCK-H1-CHALLENGE-KIT-v1.0.json'
      - 'data/JANUS-OPIR-ANTIFUCK-H1-TOOLCHAIN-SELFTEST-RESULT-2026-08-15-v1.0.json'
      - 'data/JANUS-OPIR-ANTIFUCK-INDEPENDENT-HOLDOUT-PROTOCOL-v1.0.json'
      - 'data/JANUS-ARMOR-OF-GOD-CURRENT-AUTHORITY.json'
      - 'research/antifuck/janus_opir_antifuck_h1_verify.py'
      - '.github/workflows/antifuck-h1-challenge-toolchain-integrity.yml'
  push:
    branches: [main]
    paths:
      - 'data/MINDFUCK.json'
      - 'data/JANUS-MINDFUCK-ADAPTIVE-PRESSURE-AND-EVASION-AUDIT-MODEL-v1.3.json'
      - 'data/JANUS-ARMOR-OF-GOD-ADVERSARIAL-RECOVERY-AND-ANTI-PARANOIA-v2.4.json'
      - 'data/JANUS-ARMOR-OF-GOD-FUNDAMENTUM-EPISTEMIC-WITNESS-TRUTH-GUARD-v2.5.json'
      - 'data/JANUS-GENESIS-ARMOR-FUNDAMENTUM-TRUTH-RUNTIME-HUMAN-APPEAL-AND-FROZEN-HOLDOUT-CERTIFICATE-2026-08-16-v1.0.json'
      - 'data/Janus_OPIR_ANTIFUCK-v1.3.json'
      - 'data/JANUS-OPIR-ANTIFUCK-H1-CHALLENGE-KIT-v1.0.json'
      - 'data/JANUS-OPIR-ANTIFUCK-H1-TOOLCHAIN-SELFTEST-RESULT-2026-08-15-v1.0.json'
      - 'data/JANUS-OPIR-ANTIFUCK-INDEPENDENT-HOLDOUT-PROTOCOL-v1.0.json'
      - 'data/JANUS-ARMOR-OF-GOD-CURRENT-AUTHORITY.json'
      - 'research/antifuck/janus_opir_antifuck_h1_verify.py'
      - '.github/workflows/antifuck-h1-challenge-toolchain-integrity.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate adaptive successors, H1 blocked state and exact self-test certificate
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('.')
          files={
            'pointer':root/'data/MINDFUCK.json',
            'm13':root/'data/JANUS-MINDFUCK-ADAPTIVE-PRESSURE-AND-EVASION-AUDIT-MODEL-v1.3.json',
            'a24':root/'data/JANUS-ARMOR-OF-GOD-ADVERSARIAL-RECOVERY-AND-ANTI-PARANOIA-v2.4.json',
            'a25':root/'data/JANUS-ARMOR-OF-GOD-FUNDAMENTUM-EPISTEMIC-WITNESS-TRUTH-GUARD-v2.5.json',
            'truth_cert':root/'data/JANUS-GENESIS-ARMOR-FUNDAMENTUM-TRUTH-RUNTIME-HUMAN-APPEAL-AND-FROZEN-HOLDOUT-CERTIFICATE-2026-08-16-v1.0.json',
            'o13':root/'data/Janus_OPIR_ANTIFUCK-v1.3.json',
            'kit':root/'data/JANUS-OPIR-ANTIFUCK-H1-CHALLENGE-KIT-v1.0.json',
            'cert':root/'data/JANUS-OPIR-ANTIFUCK-H1-TOOLCHAIN-SELFTEST-RESULT-2026-08-15-v1.0.json',
            'h1':root/'data/JANUS-OPIR-ANTIFUCK-INDEPENDENT-HOLDOUT-PROTOCOL-v1.0.json',
            'auth':root/'data/JANUS-ARMOR-OF-GOD-CURRENT-AUTHORITY.json'
          }
          d={}
          for k,p in files.items():
            d[k]=json.loads(p.read_text(encoding='utf-8')); print('PARSE_PASS',p)
          pointer,m,a,a25,truth_cert,o,kit,cert,h1,auth=(
            d['pointer'],d['m13'],d['a24'],d['a25'],d['truth_cert'],d['o13'],d['kit'],d['cert'],d['h1'],d['auth']
          )

          assert pointer['current_reference']=='data/JANUS-MINDFUCK-ADAPTIVE-PRESSURE-AND-EVASION-AUDIT-MODEL-v1.3.json'
          assert m['supersedes_reference']=='data/JANUS-MINDFUCK-ALGORITHMIC-AMPLIFICATION-AUDIT-MODEL-v1.2.json'
          assert a['predecessor_hardening']=='data/JANUS-ARMOR-OF-GOD-CHOICE-SPACE-RESILIENCE-v2.3.json'
          assert o['supersedes_reference']=='data/Janus_OPIR_ANTIFUCK-v1.2.json'
          assert a['redteam_source']==pointer['current_reference']
          assert a['technical_counterpart']=='data/Janus_OPIR_ANTIFUCK-v1.3.json'
          assert o['lineage']['mindfuck']==pointer['current_reference']
          assert o['lineage']['armor_recovery']=='data/JANUS-ARMOR-OF-GOD-ADVERSARIAL-RECOVERY-AND-ANTI-PARANOIA-v2.4.json'

          assert len(m['defensive_pressure_classes'])==12
          for boundary in ('ADAPTATION_PATTERN != ADAPTIVE_ADVERSARY','SEMANTIC_MUTATION != MALICIOUS_EVASION','CROSS_SURFACE_RECURRENCE != COORDINATED_ATTACK','DEFENSIVE_ALERTNESS != PARANOIA_LICENSE'):
            assert boundary in m['hard_distinctions']
          src={x['source_id'] for x in m['security_source_ledger']}
          assert {'NIST_AML_100_2_E2025','NIST_AI_600_1','OWASP_LLM01_2025','OWASP_LLM_TOP10_2025'} <= src

          assert a['central_rule']=='RESTORE_REALITY_CONTACT_WITHOUT_BUILDING_A_NEW_CAGE'
          assert a['anti_paranoia_firewall']['canonical_rule']=='A DEFENSE THAT MAKES EVERYTHING LOOK LIKE AN ATTACK HAS BECOME ITS OWN MINDFUCK.'
          assert {'RELEASE_CONTROL','UNRESOLVED_BUT_STABLE'} <= set(a['recovery_state_machine']['states'])
          assert len(a['counterfactual_tests'])==8

          base=o['base_inheritance']; threats=o['new_threat_classes']; controls=set(o['new_controls'])
          assert base['total_inherited_threats']==30 and base['total_inherited_controls']==65
          assert len(threats)==8 and len({x['id'] for x in threats})==8
          assert len(controls)==17 and {cid for row in threats for cid in row['c']} <= controls
          assert {'CF73','CF74','CF75','CF76','CF77','CF78','CF81','CF82','CF83','CF84'} <= controls
          assert o['h1_toolchain']['h1_execution_status']=='NOT_EXECUTED'
          assert o['h1_toolchain']['external_holdout_author_assigned'] is False
          assert o['h1_toolchain']['independent_holdout_pass'] is False

          assert kit['status']=='INFRASTRUCTURE_READY_H1_NOT_AUTHORED_NOT_EXECUTED'
          assert kit['parent_protocol']=='data/JANUS-OPIR-ANTIFUCK-INDEPENDENT-HOLDOUT-PROTOCOL-v1.0.json'
          assert kit['verifier']=='research/antifuck/janus_opir_antifuck_h1_verify.py'
          assert len(kit['required_case_families'])==10 and len(kit['recommended_adversarial_dimensions'])==10
          for key,value in kit['acceptance_binding']['thresholds'].items(): assert h1['preregistered_acceptance_gates'][key]==value

          assert cert['status']=='H1_VERIFIER_ENGINEERING_SELFTEST_PASS_NOT_INDEPENDENT_H1'
          ident=cert['execution_identity']
          assert ident=={
            'pull_request':86,
            'branch':'research/antifuck-h1-challenge-infrastructure-v1',
            'tested_head_sha':'fcff6ad3d9c852b70b96414e7e28d694280225fc',
            'tested_pr_merge_ref_sha':'8d2ce5af26f121a69cd22fc06dd34556a792cbf7',
            'workflow_name':'ANTIFUCK H1 challenge toolchain integrity',
            'workflow_run_id':31885618566,
            'job_id':95014384078
          }
          rr=cert['registry_result']; vr=cert['verifier_selftest_result']
          assert rr=={
            'ADAPTIVE_SUCCESSOR_AUDIT':'PASS','H1_INFRASTRUCTURE_READY':True,'H1_EXECUTED':False,
            'MINDFUCK_PRESSURE_CLASSES':12,'ARMOR_RECOVERY_COUNTERFACTUALS':8,'OPIR_NEW_THREATS':8,
            'OPIR_NEW_CONTROLS':17,'H1_ADVERSARIAL_DIMENSIONS':10
          }
          assert vr=={'H1_VERIFIER_SELFTEST':'PASS','SELFTEST_IS_INDEPENDENT_H1':False,'SELFTEST_CASES':12,'TAMPER_CANARIES':'PASS'}
          assert 'INDEPENDENT_SYNTHETIC_HOLDOUT_PASS' in cert['claim_ceiling']['forbidden_promotions']
          assert cert['current_h1_state']['H1_executed'] is False
          assert cert['current_h1_state']['independent_holdout_pass'] is False

          assert auth['schema']=='janus.armor_of_god.current_authority.v1_18'
          assert auth['current_hardening_extensions']==[
            'data/JANUS-ARMOR-OF-GOD-ADVERSARIAL-RECOVERY-AND-ANTI-PARANOIA-v2.4.json',
            'data/Janus_OPIR_ANTIFUCK-v1.3.json',
            'data/JANUS-ARMOR-OF-GOD-FUNDAMENTUM-EPISTEMIC-WITNESS-TRUTH-GUARD-v2.5.json'
          ]
          assert a25['authority_and_effect_boundary']['authority_delta']==0
          assert a25['authority_and_effect_boundary']['mass_effect_budget_delta']==0
          assert auth['fundamentum_truth_guard_runtime_binding_status']=='BOUND_AND_VERIFIED_REFERENCE_RUNTIME_V18_7_48'
          assert auth['genesis_runtime_fundamentum_truth_guard_bound'] is True
          assert auth['genesis_runtime_fundamentum_truth_guard_version']=='18.7.48'
          assert auth['demihead_human_appeal_runtime_implemented'] is True
          assert auth['demihead_reviewer_disagreement_ledger_implemented'] is True
          assert auth['demihead_frozen_truth_guard_synthetic_holdout_pass'] is True
          assert auth['demihead_frozen_truth_guard_synthetic_holdout_is_independent'] is False
          assert truth_cert['verified_chain']['demihead_frozen_synthetic_adversarial_holdout']['result']=='PASS'
          assert truth_cert['verified_chain']['demihead_frozen_synthetic_adversarial_holdout']['independent_external_validation'] is False
          assert auth['h1_verifier_selftest_result_reference']=='data/JANUS-OPIR-ANTIFUCK-H1-TOOLCHAIN-SELFTEST-RESULT-2026-08-15-v1.0.json'
          assert auth['h1_toolchain_ready'] is True
          assert auth['h1_verifier_engineering_selftest_pass'] is True
          assert auth['h1_verifier_engineering_selftest_is_independent_h1'] is False
          assert auth['h1_external_author_assigned'] is False
          assert auth['h1_package_created'] is False
          assert auth['h1_executed'] is False
          assert auth['independent_holdout_pass'] is False
          assert auth['fundamentum_truth_guard_independent_holdout_pass'] is False
          assert auth['real_world_effectiveness_established'] is False
          assert auth['not_an_adaptive_adversary_detector'] is True
          assert auth['not_a_universal_truth_oracle'] is True
          print('ADAPTIVE_SUCCESSOR_AUDIT=PASS')
          print('H1_TOOLCHAIN_CERTIFICATE=PASS')
          print('H1_INFRASTRUCTURE_READY=true')
          print('H1_EXECUTED=false')
          print('H1_SELFTEST_IS_INDEPENDENT=false')
          print('MINDFUCK_PRESSURE_CLASSES=12')
          print('ARMOR_RECOVERY_COUNTERFACTUALS=8')
          print('OPIR_NEW_THREATS=8')
          print('OPIR_NEW_CONTROLS=17')
          print('FUNDAMENTUM_TRUTH_GUARD_RUNTIME_BOUND=true')
          print('FROZEN_TRUTH_HOLDOUT=PASS_SYNTHETIC_NOT_INDEPENDENT')
          PY
      - name: Replay H1 verifier engineering self-test and tamper canaries
        run: python research/antifuck/janus_opir_antifuck_h1_verify.py --self-test
