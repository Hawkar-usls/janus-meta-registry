name: Becker TMT ontology and engineering review
on:
  pull_request:
    paths:
      - 'data/JANUS-BECKER-TERROR-MANAGEMENT-ONTOLOGY-*'
      - 'registry/psychology/**'
      - 'schemas/becker-tmt-*.json'
      - 'tools/becker_tmt_*.py'
      - 'tests/test_becker_tmt_review.py'
      - 'requirements-becker-tmt.txt'
      - '.github/workflows/becker-tmt-ontology.yml'
  push:
    branches: [main]
    paths:
      - 'data/JANUS-BECKER-TERROR-MANAGEMENT-ONTOLOGY-*'
      - 'registry/psychology/**'
      - 'schemas/becker-tmt-*.json'
      - 'tools/becker_tmt_*.py'
      - 'tests/test_becker_tmt_review.py'
      - 'requirements-becker-tmt.txt'
      - '.github/workflows/becker-tmt-ontology.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-becker-tmt.txt
      - run: python tools/becker_tmt_review.py
      - run: python -m unittest discover -s tests -p test_becker_tmt_review.py -v
