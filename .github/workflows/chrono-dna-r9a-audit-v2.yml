name: CHRONO-DNA R9A independent journal recheck B
on:
  push:
    branches: [research/chrono-dna-r9-node-b]
    paths:
      - '.github/workflows/chrono-dna-r9a-audit-v2.yml'
      - 'research/chrono_dna_r9/audit_v2.py'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: python research/chrono_dna_r9/audit_v2.py audit B
