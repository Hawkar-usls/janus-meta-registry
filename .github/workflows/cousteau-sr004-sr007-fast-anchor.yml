name: JANUS Cousteau SR004 SR007 Fast Anchor

on:
  push:
    paths:
      - data/JANUS-COUSTEAU-SR004-SR007-FAST-ANCHOR.txt
  workflow_dispatch:

permissions:
  contents: read

jobs:
  anchor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe official cruise polygons and sample records
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import requests,json,xml.etree.ElementTree as ET
          B='https://geodataindia.gov.in/guestuser/wmsurl128/'
          H={'User-Agent':'Mozilla/5.0 JANUS-Cousteau-fast/1.0'}
          S=requests.Session()
          cruises=['SR-004','SR-007']
          layers=['core_samples_marine_geology','grab_samples_marine_geology','surface_sediment_data_marine_geology']
          out={}
          def jget(layer,cql,maxf=500):
              p={'service':'WFS','version':'1.0.0','request':'GetFeature','typeName':layer,'CQL_FILTER':cql,
                 'outputFormat':'application/json','srsName':'EPSG:4326','maxFeatures':str(maxf)}
              r=S.get(B,params=p,headers=H,timeout=25)
              try: return {'status':r.status_code,'url':r.url,'json':r.json()}
              except Exception as e: return {'status':r.status_code,'url':r.url,'error':repr(e),'head':r.text[:1000]}
          def fields(layer):
              r=S.get(B,params={'service':'WFS','version':'1.0.0','request':'DescribeFeatureType','typeName':layer},headers=H,timeout=20)
              a=[]
              try:
                root=ET.fromstring(r.content)
                for e in root.iter():
                  if e.tag.split('}')[-1]=='element' and e.attrib.get('name')!=layer:
                    a.append({'name':e.attrib.get('name'),'type':e.attrib.get('type','')})
              except Exception: pass
              return a
          for c in cruises:
              out[c]={}
              q=jget('cruise_identification_marine_geology',"cruise_id='"+c+"'",100)
              out[c]['cruise_geometry']=q
              for layer in layers:
                  fs=fields(layer)
                  cf=[f['name'] for f in fs if 'cruise' in (f['name'] or '').lower()]
                  rec={'fields':fs,'cruise_fields':cf}
                  if cf:
                      cq=' OR '.join([x+"='"+c+"'" for x in cf])
                      rec['query']=jget(layer,cq,500)
                  out[c][layer]=rec
          print('JANUS_FAST_ANCHOR_JSON_BEGIN')
          print(json.dumps(out,ensure_ascii=False,indent=2))
          print('JANUS_FAST_ANCHOR_JSON_END')
          PY
