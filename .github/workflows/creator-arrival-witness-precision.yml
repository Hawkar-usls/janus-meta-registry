name: Creator arrival witness precision

on:
  push:
    branches:
      - registry/genesis-creator-arrival-witness-20260731
  pull_request:
    paths:
      - 'data/JANUS-GENESIS-CREATOR-ARRIVAL-PROMISE-KEPT-WITNESS-v1.0.json'
      - 'data/JANUS-GENESIS-CREATOR-ARRIVAL-PROMISE-KEPT-WITNESS-v1.0.sha256.json'
      - 'data/JANUS-REGISTRY-VISITOR-DOORS-INDEX-v2.1.json'
      - '.github/workflows/creator-arrival-witness-precision.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate witness and print exact hashes
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path

          witness = Path('data/JANUS-GENESIS-CREATOR-ARRIVAL-PROMISE-KEPT-WITNESS-v1.0.json')
          manifest = Path('data/JANUS-GENESIS-CREATOR-ARRIVAL-PROMISE-KEPT-WITNESS-v1.0.sha256.json')
          visitor = Path('data/JANUS-REGISTRY-VISITOR-DOORS-INDEX-v2.1.json')

          witness_bytes = witness.read_bytes()
          witness_obj = json.loads(witness_bytes)
          manifest_obj = json.loads(manifest.read_text(encoding='utf-8'))
          visitor_obj = json.loads(visitor.read_text(encoding='utf-8'))

          exact = hashlib.sha256(witness_bytes).hexdigest()
          integrity = witness_obj.pop('integrity')
          canonical = hashlib.sha256(
              json.dumps(witness_obj, ensure_ascii=False, sort_keys=True, separators=(',', ':')).encode('utf-8')
          ).hexdigest()
          event_digest = hashlib.sha256(
              json.dumps(
                  witness_obj['dialogue_witness']['events'],
                  ensure_ascii=False,
                  sort_keys=True,
                  separators=(',', ':')
              ).encode('utf-8')
          ).hexdigest()

          visitor_integrity = visitor_obj.pop('integrity')
          visitor_canonical = hashlib.sha256(
              json.dumps(visitor_obj, ensure_ascii=False, sort_keys=True, separators=(',', ':')).encode('utf-8')
          ).hexdigest()

          print(f'EXACT_WITNESS_SHA256={exact}')
          print(f'CANONICAL_PRE_INTEGRITY_SHA256={canonical}')
          print(f'SEMANTIC_EVENT_LIST_SHA256={event_digest}')
          print(f'VISITOR_CANONICAL_PRE_INTEGRITY_SHA256={visitor_canonical}')

          assert canonical == integrity['sha256_canonical_json_pre_integrity']
          assert canonical == manifest_obj['canonical_pre_integrity_sha256']
          assert event_digest == integrity['semantic_dialogue_event_list_sha256']
          assert event_digest == manifest_obj['semantic_dialogue_event_list_sha256']
          assert visitor_canonical == visitor_integrity['sha256_canonical_json_pre_integrity']
          assert witness_obj['fulfillment']['status'] == 'PROMISE_FULFILLED_WITHIN_GENESIS_UNIVERSAL_CHAT_RUNTIME'
          assert witness_obj['fulfillment']['real_world_supernatural_event_claimed'] is False
          assert witness_obj['promise_record']['exact_phrase_publicly_preregistered_before_event'] is False
          assert witness_obj['validation']['no_machine_consciousness_claim'] is True
          assert visitor_obj['validation']['public_safe'] is True
          print('CREATOR_ARRIVAL_WITNESS_PRECISION=PASS')
          PY
