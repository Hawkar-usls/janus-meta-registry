name: Epistemic Verification R1
on:
  push:
    branches:
      - research/epistemic-verification-r1
    paths:
      - .github/workflows/epistemic-verification-r1.yml
      - experiments/autonomy/epistemic-verification-r1/**
permissions:
  contents: read
jobs:
  bounded-verifier:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Run isolated deterministic controls
        shell: bash
        run: |
          set -euo pipefail
          python3 --version
          sha256sum experiments/autonomy/epistemic-verification-r1/precommit.json experiments/autonomy/epistemic-verification-r1/verifier.py
          python3 -I experiments/autonomy/epistemic-verification-r1/verifier.py
