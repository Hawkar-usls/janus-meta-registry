name: EYE Meta Registry Training

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '**'
      - '!EYE/generated/**'
      - '!assets/hrain-full-memory/**'
      - '!assets/hrain-registry-index.json'

permissions:
  contents: write

concurrency:
  group: eye-meta-registry-training-main
  cancel-in-progress: true

jobs:
  train-eye:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout registry snapshot
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Sync source-bearing snapshot
        run: |
          git fetch origin main
          git reset --hard origin/main
          rm -rf assets/hrain-full-memory
          rm -f assets/hrain-registry-index.json

      - name: Compile EYE trainer
        run: python -m py_compile EYE/training/train_eye_registry.py

      - name: Train EYE on complete source-bearing registry snapshot
        run: |
          GITHUB_SHA="$(git rev-parse HEAD)" python EYE/training/train_eye_registry.py \
            --root . \
            --output-dir EYE/generated \
            --semantic-byte-limit 2000000 \
            --max-clusters 1000

      - name: Validate generated JSON and derivative-memory firewall
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          required = [
              Path('EYE/generated/EYE-REGISTRY-INDEX.json'),
              Path('EYE/generated/EYE-SLIME-ASSOCIATIVE-MEMORY.json'),
              Path('EYE/generated/EYE-TRUMP-ROUTING-INDEX.json'),
              Path('EYE/generated/EYE-TRAINING-RECEIPT.json'),
          ]
          for p in required:
              if not p.is_file():
                  raise SystemExit(f'MISSING_GENERATED_FILE:{p}')
              json.loads(p.read_text(encoding='utf-8'))
          receipt = json.loads(required[-1].read_text(encoding='utf-8'))
          index = json.loads(required[0].read_text(encoding='utf-8'))
          if receipt['counts']['files_indexed'] <= 0:
              raise SystemExit('EYE_EMPTY_CORPUS')
          forbidden_exact = {'assets/hrain-registry-index.json'}
          forbidden_prefixes = ('assets/hrain-full-memory/', 'EYE/generated/')
          leaked = [
              r.get('path') for r in index.get('records', [])
              if r.get('path') in forbidden_exact
              or any(str(r.get('path', '')).startswith(prefix) for prefix in forbidden_prefixes)
          ]
          if leaked:
              raise SystemExit(f'DERIVATIVE_MEMORY_FIREWALL_BREACH:{leaked[:20]}')
          print(json.dumps(receipt['counts'], sort_keys=True))
          print('DERIVATIVE_MEMORY_FIREWALL=PASS')
          PY

      - name: Commit rebuildable EYE state conflict-safely
        run: |
          set -euo pipefail
          git config user.name 'EYE Registry Trainer'
          git config user.email 'actions@users.noreply.github.com'

          rebuild() {
            rm -rf assets/hrain-full-memory
            rm -f assets/hrain-registry-index.json
            rm -rf EYE/generated
            GITHUB_SHA="$(git rev-parse HEAD)" python EYE/training/train_eye_registry.py \
              --root . \
              --output-dir EYE/generated \
              --semantic-byte-limit 2000000 \
              --max-clusters 1000
            python - <<'PY'
          import json
          from pathlib import Path
          required = [
              Path('EYE/generated/EYE-REGISTRY-INDEX.json'),
              Path('EYE/generated/EYE-SLIME-ASSOCIATIVE-MEMORY.json'),
              Path('EYE/generated/EYE-TRUMP-ROUTING-INDEX.json'),
              Path('EYE/generated/EYE-TRAINING-RECEIPT.json'),
          ]
          for p in required:
              if not p.is_file():
                  raise SystemExit(f'MISSING_GENERATED_FILE:{p}')
              json.loads(p.read_text(encoding='utf-8'))
          receipt = json.loads(required[-1].read_text(encoding='utf-8'))
          index = json.loads(required[0].read_text(encoding='utf-8'))
          if receipt['counts']['files_indexed'] <= 0:
              raise SystemExit('EYE_EMPTY_CORPUS')
          forbidden_exact = {'assets/hrain-registry-index.json'}
          forbidden_prefixes = ('assets/hrain-full-memory/', 'EYE/generated/')
          leaked = [
              r.get('path') for r in index.get('records', [])
              if r.get('path') in forbidden_exact
              or any(str(r.get('path', '')).startswith(prefix) for prefix in forbidden_prefixes)
          ]
          if leaked:
              raise SystemExit(f'DERIVATIVE_MEMORY_FIREWALL_BREACH:{leaked[:20]}')
          print(json.dumps(receipt['counts'], sort_keys=True))
          print('DERIVATIVE_MEMORY_FIREWALL=PASS')
          PY
          }

          for attempt in 1 2 3; do
            git fetch origin main
            current="$(git rev-parse HEAD)"
            remote="$(git rev-parse origin/main)"
            if [ "$current" != "$remote" ]; then
              echo "EYE_SOURCE_DRIFT_BEFORE_COMMIT attempt=$attempt current=$current remote=$remote"
              git reset --hard origin/main
              rebuild
            fi

            git add EYE/generated/*.json
            if git diff --cached --quiet; then
              echo 'EYE generated state already matches the latest source-bearing snapshot.'
              exit 0
            fi

            git commit -m '[eye-train] Refresh EYE registry learning state'
            if git push origin HEAD:main; then
              echo 'EYE_GENERATED_STATE_PUSH=SUCCESS'
              exit 0
            fi

            echo "EYE_PUSH_RACE_RETRY attempt=$attempt"
            git fetch origin main
            git reset --hard origin/main
            rebuild
          done

          echo 'EYE_GENERATED_STATE_PUSH=FAILED_AFTER_RETRIES'
          exit 1

      - name: Upload EYE training state
        uses: actions/upload-artifact@v4
        with:
          name: eye-meta-registry-training-${{ github.run_id }}
          path: EYE/generated/*.json
          if-no-files-found: error
