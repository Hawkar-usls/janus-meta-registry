name: EYE R4.2 Adaptive Witness Planner

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'eye/r4-2-*'
    paths:
      - 'EYE/r4_2/**'
      - 'data/EYE-R4.2-ADAPTIVE-WITNESS-PLANNER-CONTRACT-2026-09-02-v1.0.json'
      - '.github/workflows/eye-r4-2-adaptive-witness-planner.yml'

permissions:
  contents: write

concurrency:
  group: eye-r4-2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  adaptive-plan-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile planner and tests
        run: |
          python -m py_compile EYE/r4_2/eye_r4_2_adaptive_witness_planner.py
          python -m py_compile EYE/r4_2/test_eye_r4_2_planner.py
      - name: Run adversarial unit tests
        run: python -m unittest EYE.r4_2.test_eye_r4_2_planner -v
      - name: Replay predeclared benchmarks
        run: |
          rm -rf EYE/r4_2/generated
          for name in synthetic_adaptive_advantage search_proof_adaptive palomar_xe325_adaptive; do
            GITHUB_SHA="$(git rev-parse HEAD)" python EYE/r4_2/eye_r4_2_adaptive_witness_planner.py \
              --input "EYE/r4_2/benchmarks/${name}.json" \
              --output-dir "EYE/r4_2/generated/${name}"
          done
      - name: Validate predeclared outcomes
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('EYE/r4_2/generated')
          syn=json.loads((root/'synthetic_adaptive_advantage/adaptive_policy_receipt.json').read_text())
          assert syn['status']=='EXACT_ADAPTIVE_POLICY_FOUND', syn
          assert syn['root_next_test']=='t_root', syn
          assert syn['expected_cost_to_identification']==4.0, syn
          assert syn['worst_case_cost_to_identification']==5.0, syn
          assert syn['nonadaptive_baseline']['cost']==5.0, syn
          assert syn['expected_cost_savings_vs_nonadaptive']==1.0, syn
          sp=json.loads((root/'search_proof_adaptive/adaptive_policy_receipt.json').read_text())
          assert sp['status']=='EXACT_ADAPTIVE_POLICY_FOUND', sp
          assert sp['root_next_test']=='provenance_hash_audit', sp
          assert abs(sp['expected_cost_to_identification']-2.8)<1e-9, sp
          assert sp['worst_case_cost_to_identification']==4.0, sp
          assert sp['nonadaptive_baseline']['cost']==4.0, sp
          assert abs(sp['expected_cost_savings_vs_nonadaptive']-1.2)<1e-9, sp
          pal=json.loads((root/'palomar_xe325_adaptive/adaptive_policy_receipt.json').read_text())
          assert pal['status']=='NON_IDENTIFIABLE_UNDER_CURRENT_MEASUREMENT_MODEL', pal
          assert pal['exact_policy_search_completed'] is True, pal
          assert pal['root_greedy_next_test_ranking']==[], pal
          receipt={
            'schema':'janus.eye.r4_2.validation_receipt.v1',
            'status':'PASS_WITH_EPISTEMIC_CEILING',
            'source_git_commit':__import__('subprocess').check_output(['git','rev-parse','HEAD'],text=True).strip(),
            'unit_tests':'PASS_6_OF_6',
            'synthetic':'PASS_ADAPTIVE_4_VS_FIXED_5',
            'search_proof':'PASS_ADAPTIVE_2.8_VS_FIXED_4',
            'palomar':'PASS_EXPECTED_NON_IDENTIFIABLE',
            'ceiling':'EXACT_POLICY_UNDER_DECLARED_DETERMINISTIC_MODEL__EMPIRICAL_OUTCOME_CALIBRATION_STILL_REQUIRED',
            'firewalls':['ADAPTIVE_POLICY != CAUSAL_TRUTH','PRIOR != EVIDENCE','NON_IDENTIFIABLE != FALSE','UNKNOWN_RESOURCE_LIMIT != NON_IDENTIFIABLE']
          }
          (root/'EYE-R4.2-VALIDATION-RECEIPT.json').write_text(json.dumps(receipt,indent=2,sort_keys=True)+'\n')
          print(json.dumps(receipt,sort_keys=True))
          PY
      - name: Commit JSON receipts on main only
        if: github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          git config user.name 'EYE R4.2 Adaptive Witness Planner'
          git config user.email 'actions@users.noreply.github.com'
          git add EYE/r4_2/generated
          git diff --cached --quiet && exit 0
          git commit -m '[eye-r4.2] Preserve adaptive witness policy receipts [skip ci]'
          git pull --rebase origin main
          git push
      - name: Upload R4.2 receipts
        uses: actions/upload-artifact@v4
        with:
          name: eye-r4-2-${{ github.run_id }}
          path: EYE/r4_2/generated/**/*.json
          if-no-files-found: error
