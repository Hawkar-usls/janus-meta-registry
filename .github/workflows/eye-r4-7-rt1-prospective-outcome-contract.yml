name: EYE R4.7-RT.1 Prospective Outcome Contract

on:
  push:
    branches: [main, 'eye/r4-7-rt1-*']
    paths:
      - 'EYE/r4_7_rt_1/**'
      - 'registry/uap/Retro-Tahyon.json'
      - 'data/EYE-R4.7-RT.1-PROSPECTIVE-OUTCOME-CONTRACT-2026-09-02-v1.0.json'
      - '.github/workflows/eye-r4-7-rt1-prospective-outcome-contract.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prospective-outcome-and-minimax-routing:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile adapter and tests
        run: python -m py_compile EYE/r4_7_rt_1/eye_r4_7_rt_1_minimax_adapter.py EYE/r4_7_rt_1/test_eye_r4_7_rt_1.py
      - name: Run adversarial contract tests
        run: python EYE/r4_7_rt_1/test_eye_r4_7_rt_1.py
      - name: Build deterministic minimax receipts
        run: |
          rm -rf EYE/r4_7_rt_1/generated
          python EYE/r4_7_rt_1/eye_r4_7_rt_1_minimax_adapter.py \
            --contract EYE/r4_7_rt_1/retro_tahyon_prospective_outcome_contract.json \
            --model EYE/r4_7_rt_1/retro_tahyon_r4_2_minimax_model.json \
            --source registry/uap/Retro-Tahyon.json \
            --output-dir EYE/r4_7_rt_1/generated
      - name: Assert frozen policy and epistemic firewall
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          root=Path('EYE/r4_7_rt_1/generated')
          p=json.loads((root/'minimax_policy_receipt.json').read_text())
          g=json.loads((root/'source_grounding_receipt.json').read_text())
          f=json.loads((root/'probability_firewall_receipt.json').read_text())
          assert p['status']=='EXACT_MINIMAX_POLICY_FOUND',p
          assert p['root_next_test']=='TOPA-RT-H2',p
          assert p['worst_case_cost_to_identification']==4.0,p
          assert p['probability_semantics']=='NONE',p
          assert g['status']=='PASS_SOURCE_GROUNDING',g
          assert g['h5_unavailable_while_direct_link_false'] is True,g
          assert f['status']=='PASS_NO_ARCHIVAL_PROBABILITIES',f
          assert f['r4_3_gate']=='BLOCKED_PENDING_REAL_CALIBRATION',f
          receipt={
            'schema':'janus.eye.r4_7_rt_1.validation_receipt.v1',
            'status':'PASS_WITH_EPISTEMIC_CEILING',
            'unit_tests':'PASS_8_OF_8',
            'source_grounding':'PASS_H1_H5_AND_SOURCE_STATUS',
            'minimax_policy':'PASS_H2_THEN_H1_THEN_H3_THEN_H4_WORST_CASE_4',
            'probability_firewall':'PASS_NO_PRIORS_NO_LIKELIHOODS_NO_EXPECTED_INFORMATION_GAIN',
            'out_of_contract_firewall':'PASS_FAIL_CLOSED_NO_POST_HOC_INTERPRETATION',
            'r4_3_gate':'BLOCKED_PENDING_REAL_CALIBRATION',
            'source_git_commit':os.environ.get('GITHUB_SHA','LOCAL_OR_UNKNOWN'),
            'ceiling':'DETERMINISTIC_PROSPECTIVE_ROUTING_WITHIN_COARSE_BENCHMARK_ONLY__NO_RETROCAUSAL_OR_TACHYON_PHYSICAL_CLAIM',
            'firewalls':['OUTCOME != CAUSE_TRUTH','ARCHIVAL_WORDING != LIKELIHOOD','PROSPECTIVE_ANOMALY != RETROCAUSAL_MECHANISM','RETROCAUSAL_MECHANISM != TACHYON_CARRIER','INVALID_PROTOCOL != NEGATIVE_RESULT','NO_CALIBRATED_LIKELIHOODS => NO_R4_3']
          }
          (root/'EYE-R4.7-RT.1-VALIDATION-RECEIPT.json').write_text(json.dumps(receipt,indent=2,sort_keys=True)+'\n')
          print(json.dumps(receipt,sort_keys=True))
          PY
      - name: Commit JSON receipts on main only
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name 'EYE R4.7-RT.1 Prospective Outcome Contract'
          git config user.email 'actions@users.noreply.github.com'
          git add EYE/r4_7_rt_1/generated
          if git diff --cached --quiet; then
            echo 'No receipt drift.'
          else
            git commit -m '[eye-r4.7-rt.1] Preserve prospective outcome receipts [skip ci]'
            git push
          fi
      - name: Upload R4.7-RT.1 receipts
        uses: actions/upload-artifact@v4
        with:
          name: eye-r4-7-rt1-prospective-outcome-receipts
          path: EYE/r4_7_rt_1/generated
