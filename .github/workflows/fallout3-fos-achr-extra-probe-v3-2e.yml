name: Fallout 3 ACHR Changed Extra probe v3.2e

on:
  pull_request:
    paths:
      - "tools/fo3_fos_achr_changed_extra_probe_v0_1.py"
      - "tools/fo3_fos_changed_form_header_index_v0_1.py"
      - "tools/fo3_fos_header_plugin_manifest_v0_1.py"
      - "tests/test_fo3_fos_achr_changed_extra_probe_v0_1.py"
      - ".github/workflows/fallout3-fos-achr-extra-probe-v3-2e.yml"
      - "registry/myth_busted/FALLOUT-3-ACHR-TYPE1-CHANGED-EXTRA-FIELD-BASELINE-DECODER-v3.2e.json"
  push:
    branches: [main]
    paths:
      - "tools/fo3_fos_achr_changed_extra_probe_v0_1.py"
      - "tools/fo3_fos_changed_form_header_index_v0_1.py"
      - "tools/fo3_fos_header_plugin_manifest_v0_1.py"
      - "tests/test_fo3_fos_achr_changed_extra_probe_v0_1.py"
      - ".github/workflows/fallout3-fos-achr-extra-probe-v3-2e.yml"
      - "registry/myth_busted/FALLOUT-3-ACHR-TYPE1-CHANGED-EXTRA-FIELD-BASELINE-DECODER-v3.2e.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe-achr-extra:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VORTEX_COMMIT: 87eb92131c2e85dd52d4fdb9a69d41b4eb9148e6
      FIXTURE_DIR: .ci/fo3-real-fixtures
      RECEIPT: .ci/fo3-achr-extra-probe.json
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact event head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Assert exact event head
        shell: bash
        run: |
          set -euo pipefail
          ACTUAL_HEAD="$(git rev-parse HEAD)"
          echo "EXPECTED_HEAD=$EXPECTED_HEAD"
          echo "ACTUAL_HEAD=$ACTUAL_HEAD"
          test "$ACTUAL_HEAD" = "$EXPECTED_HEAD"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check pytest

      - name: Compile decoders
        run: |
          python -m py_compile tools/fo3_fos_header_plugin_manifest_v0_1.py
          python -m py_compile tools/fo3_fos_changed_form_header_index_v0_1.py
          python -m py_compile tools/fo3_fos_achr_changed_extra_probe_v0_1.py

      - name: Run adversarial deterministic tests
        run: python -m pytest -q tests/test_fo3_fos_achr_changed_extra_probe_v0_1.py

      - name: Download pinned real Fallout 3 fixtures
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$FIXTURE_DIR"
          base="https://raw.githubusercontent.com/Nexus-Mods/Vortex/${VORTEX_COMMIT}/extensions/gamebryo-savegame-management/test/saves/fallout3"
          for file in fallout3_1.fos fallout3_2.fos fallout3_3.fos; do
            curl --fail --location --retry 3 --retry-all-errors --output "$FIXTURE_DIR/$file" "$base/$file"
          done

      - name: Decode MQDadRef source-bound ACHR prefix on real saves
        shell: bash
        run: |
          set -euo pipefail
          python tools/fo3_fos_achr_changed_extra_probe_v0_1.py \
            --fixture-dir "$FIXTURE_DIR" \
            --output "$RECEIPT"

      - name: Validate claim ceiling
        shell: bash
        run: |
          python - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          p = Path(os.environ["RECEIPT"])
          data = json.loads(p.read_text())
          assert data["schema"] == "janus.fo3_fos_achr_changed_extra_probe.v0_2"
          assert data["cross_fixture_baseline"]["all_extra_counts"] == [1, 1, 1]
          assert data["cross_fixture_baseline"]["all_extra_type_sequences"] == [["0x0D"], ["0x0D"], ["0x0D"]]
          assert data["cross_fixture_baseline"]["extra_0d_resolved_primary_ref_stable"] is True
          assert data["cross_fixture_baseline"]["extra_0d_resolved_primary_refs"] == ["0x0001F40A"] * 3
          assert "Unk074" in data["cross_fixture_baseline"]["variable_mobile_fields"]
          assert "EXTRA_0D_RUNTIME_STRUCTURE != AUTOBIOGRAPHICAL_MEMORY" in data["hard_rules"]
          actual = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          assert actual == os.environ["EXPECTED_HEAD"]
          data["ci_exact_head"] = actual
          data["ci_exact_head_match"] = True
          p.write_text(json.dumps(data, indent=2, sort_keys=True) + "\n")
          print("CLAIM_CEILING_PASS", actual)
          PY

      - name: Print receipt
        if: always()
        shell: bash
        run: |
          if [[ -f "$RECEIPT" ]]; then python -m json.tool "$RECEIPT"; fi

      - name: Upload receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fallout3-fos-achr-extra-probe-v3-2e
          path: .ci/fo3-achr-extra-probe.json
          if-no-files-found: error
