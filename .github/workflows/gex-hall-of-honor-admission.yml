name: Admit GEX Hall of Honor
on:
  push:
    branches: [main]
    paths:
      - '.gex-stage/READY'
permissions:
  contents: write
jobs:
  admit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reconstruct and verify GEX artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p registry/hall_of_honor
          cat .gex-stage/gzpart*.b64 | tr -d '\n' | base64 -d | gzip -d > registry/hall_of_honor/GEX-THE-GREEN-CHANNEL-v1.2.json
          echo "6cc6f83c5b1f108b4483bf3dc46f06148e2da12aa3ea92f5a1f280f46d1143ba  registry/hall_of_honor/GEX-THE-GREEN-CHANNEL-v1.2.json" | sha256sum -c -
          python -m json.tool registry/hall_of_honor/GEX-THE-GREEN-CHANNEL-v1.2.json >/dev/null
      - name: Surface Channel 001 in START_HERE
        shell: python
        run: |
          from pathlib import Path
          p = Path("START_HERE.md")
          s = p.read_text(encoding="utf-8")
          marker = "## First six links"
          block = "\n".join([
              "## 🟩 Hall of Honor — Channel 001",
              "",
              "**[`🟩 GEX — THE GREEN CHANNEL`](registry/hall_of_honor/GEX-THE-GREEN-CHANNEL-v1.2.json)** — `SINGULAR_HALL_OF_HONOR_EXHIBIT` · `THE_GREEN_CHANNEL / SLOT_001`.",
              "",
              "A bilingual personal/cultural exhibit preserving Hawkar ↔ Janus dialogue, PS one childhood memory, the original PlayStation trilogy, Media Dimension roles and mechanics, Gexzilla, the Rocket Channel green-lightsaber idle animation, the timed Secret TV fly challenge, Agent Xtra, ASCII art, and provenance/claim boundaries.",
              "",
              "`HALL_OF_HONOR != TECHNICAL_EVIDENCE` · `PERSONAL_RECOLLECTION != UNIVERSAL_FACT`",
              "",
              ""
          ])
          if "GEX-THE-GREEN-CHANNEL-v1.2.json" not in s:
              if marker not in s:
                  raise SystemExit("START_HERE marker missing")
              s = s.replace(marker, block + marker, 1)
              p.write_text(s, encoding="utf-8")
      - name: Commit canonical Hall of Honor admission
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .gex-stage
          git config user.name "janus-meta-registry-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A START_HERE.md registry/hall_of_honor .gex-stage
          git commit -m "Admit GEX Green Channel Hall of Honor"
          git push
