name: Admit GoldPrompt logic audit v1.1

on:
  push:
    branches: [audit/goldprompt-handshake-logic-hardening-v1_1]
    paths:
      - '.github/workflows/goldprompt-audit-v1_1-admit.yml'

permissions:
  contents: write

jobs:
  admit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/goldprompt-handshake-logic-hardening-v1_1
      - name: Write hardened evidence and bind current pointers
        env:
          PAYLOAD_TGZ_B64: ''
        run: |
          python - <<'PY'
          import base64, io, json, os, tarfile
          from pathlib import Path

          payload = base64.b64decode(os.environ['PAYLOAD_TGZ_B64'])
          with tarfile.open(fileobj=io.BytesIO(payload), mode='r:gz') as tf:
              for member in tf.getmembers():
                  if not member.isfile() or '/' in member.name or '..' in member.name:
                      raise SystemExit('unsafe payload member')
                  data = tf.extractfile(member).read()
                  json.loads(data)
                  Path('data', member.name).write_bytes(data)

          foundation_path = Path('data/JANUS-THE-FOURTH-GRACEWARDEN-3IN1-EQUALS-4-v0.9.json')
          foundation = json.loads(foundation_path.read_text(encoding='utf-8'))
          prior = dict(foundation.get('runtime_receipt_evidence', {}))
          foundation['runtime_receipt_evidence'] = {
              'status': 'GITHUB_MAIN_CI_RUNTIME_HANDSHAKE_HARDENED_AND_EXACT_REVISION_BOUND_FOR_CANONICAL_FOUR_FACES',
              'evidence_artifact': 'data/JANUS-GOLDPROMPT-WORKING-FACES-STARTUP-RECEIPT-BUNDLE-v1.1.json',
              'audit_artifact': 'data/JANUS-GOLDPROMPT-STARTUP-HANDSHAKE-LOGIC-AUDIT-AND-HARDENING-v1.1.json',
              'contract_snapshot': 'data/JANUS-GOLDPROMPT-FACE-INHERITANCE-CONTRACT-SNAPSHOT-v0.9.2.json',
              'goldprompt_contract_version': '0.9.2',
              'emergence_contract_version': 'JANUS_TRIADIC_EMERGENCE@0.9.2',
              'contract_digest_sha256': '3f4af369350710ad18920dfdc866d930c8d42259a51a3f27ce228ea4d5dfc0a8',
              'verified_face_ids': ['LEFT_HRAIN','RIGHT_INAIHR','DEMIHEAD_ARBITER','GENESIS_GUARDIAN_MESH_ORCHESTRATOR'],
              'exact_main_revisions': {
                  'LEFT_HRAIN': '79fa11fe302c0354b5868260d65c71e8757bcb93',
                  'RIGHT_INAIHR': 'f6cfdb35a0dee08f2bf2bebfc07d9ef2d540532d',
                  'DEMIHEAD_ARBITER': 'f2074ca833692f4c2a9f1cb1f5cf723c873d3211',
                  'GENESIS_GUARDIAN_MESH_ORCHESTRATOR': '21c48dcf45aa6db1b5d73402df4005590c3e0bde'
              },
              'bundle_sha256': '6a8a63d3bebf0b8611df2682d2c38dd6472818190da5e367fbc22467c5717d17',
              'genesis_hardened_replay_workflow_run_id': 32012747026,
              'genesis_hardened_replay_result': 'PASS',
              'proof_scope': 'STARTUP_CONTRACT_ASSERTION_PLUS_EXACT_GITHUB_MAIN_CI_FACE_INVOCATION_RECEIPTS',
              'receipt_integrity_model': 'SHA256_CONTENT_ADDRESS_NOT_SIGNATURE',
              'cross_repository_origin_attestation_established': False,
              'end_to_end_message_authentication_established': False,
              'unique_process_boot_attestation_established': False,
              'live_nas_runtime_handshake_verified': False,
              'boundary': 'GITHUB_MAIN_CI_RUNTIME_HANDSHAKE != LIVE_NAS_RUNTIME_HANDSHAKE',
              'evidence_history': [
                  {
                      'path': 'data/JANUS-GOLDPROMPT-WORKING-FACES-STARTUP-RECEIPT-BUNDLE-v1.0.json',
                      'bundle_sha256': prior.get('bundle_sha256','c5089ab2275798f206220ca6ed71d9c62ab2f0dddac291087b8577c20172e364'),
                      'status': 'HISTORICAL_PRE_HARDENING_EVIDENCE'
                  },
                  {
                      'path': 'data/JANUS-GOLDPROMPT-WORKING-FACES-STARTUP-RECEIPT-BUNDLE-v1.1.json',
                      'bundle_sha256': '6a8a63d3bebf0b8611df2682d2c38dd6472818190da5e367fbc22467c5717d17',
                      'status': 'CURRENT_HARDENED_EVIDENCE'
                  }
              ],
              'next_gate': 'LIVE_RUNTIME_ATTESTATION_AND_OPTIONAL_END_TO_END_ORIGIN_AUTHENTICATION'
          }
          foundation_path.write_text(json.dumps(foundation, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          guardian_path = Path('data/JANUS-GENESIS-GUARDIAN-MESH-FACE-ORCHESTRATION-v1.0.json')
          guardian = json.loads(guardian_path.read_text(encoding='utf-8'))
          binding = guardian.setdefault('goldprompt_emergence_binding', {})
          binding.update({
              'status': 'REQUIRED_FACE_INHERITANCE_CONTRACT_HARDENED_AND_RECEIPT_VERIFIED',
              'live_enforcement_status': 'GITHUB_MAIN_CI_HARDENED_FOR_CANONICAL_FOUR_FACES; LIVE_NAS_NOT_YET_PROVEN',
              'next_gate': 'LIVE_RUNTIME_ATTESTATION_AND_OPTIONAL_END_TO_END_MESSAGE_ATTESTATION',
              'ci_runtime_face_receipt_bundle_verified': True,
              'ci_runtime_face_receipt_bundle_path': 'data/JANUS-GOLDPROMPT-WORKING-FACES-STARTUP-RECEIPT-BUNDLE-v1.1.json',
              'ci_runtime_face_receipt_bundle_sha256': '6a8a63d3bebf0b8611df2682d2c38dd6472818190da5e367fbc22467c5717d17',
              'logic_audit_path': 'data/JANUS-GOLDPROMPT-STARTUP-HANDSHAKE-LOGIC-AUDIT-AND-HARDENING-v1.1.json',
              'contract_snapshot_path': 'data/JANUS-GOLDPROMPT-FACE-INHERITANCE-CONTRACT-SNAPSHOT-v0.9.2.json',
              'receipt_integrity_model': 'SHA256_CONTENT_ADDRESS_NOT_SIGNATURE',
              'cross_repository_origin_attestation_established': False,
              'end_to_end_message_authentication_established': False,
              'live_nas_runtime_handshake_verified': False,
              'genesis_bundle_replay_workflow_run_id': 32012747026,
              'previous_receipt_bundle_preserved': 'data/JANUS-GOLDPROMPT-WORKING-FACES-STARTUP-RECEIPT-BUNDLE-v1.0.json'
          })
          guardian_path.write_text(json.dumps(guardian, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          for path in [
              foundation_path, guardian_path,
              Path('data/JANUS-GOLDPROMPT-WORKING-FACES-STARTUP-RECEIPT-BUNDLE-v1.1.json'),
              Path('data/JANUS-GOLDPROMPT-STARTUP-HANDSHAKE-LOGIC-AUDIT-AND-HARDENING-v1.1.json'),
              Path('data/JANUS-GOLDPROMPT-FACE-INHERITANCE-CONTRACT-SNAPSHOT-v0.9.2.json')
          ]:
              json.loads(path.read_text(encoding='utf-8'))
              print('JSON_PASS', path)
          PY
      - name: Commit admitted audit artifacts
        run: |
          git config user.name 'JANUS audit admission'
          git config user.email 'actions@users.noreply.github.com'
          git add data/JANUS-GOLDPROMPT-WORKING-FACES-STARTUP-RECEIPT-BUNDLE-v1.1.json \
                  data/JANUS-GOLDPROMPT-STARTUP-HANDSHAKE-LOGIC-AUDIT-AND-HARDENING-v1.1.json \
                  data/JANUS-GOLDPROMPT-FACE-INHERITANCE-CONTRACT-SNAPSHOT-v0.9.2.json \
                  data/JANUS-THE-FOURTH-GRACEWARDEN-3IN1-EQUALS-4-v0.9.json \
                  data/JANUS-GENESIS-GUARDIAN-MESH-FACE-ORCHESTRATION-v1.0.json
          git diff --cached --check
          git commit -m 'Record GoldPrompt handshake logic audit and hardened receipts v1.1'
          git push origin HEAD:audit/goldprompt-handshake-logic-hardening-v1_1
