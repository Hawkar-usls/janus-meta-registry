name: Admit GoldPrompt Startup Receipt Bundle v1

on:
  push:
    branches: [integration/goldprompt-startup-receipts-v1-final]
    paths:
      - '.github/workflows/goldprompt-receipt-bundle-admit-v1.yml'

permissions:
  contents: write

jobs:
  admit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: integration/goldprompt-startup-receipts-v1-final
      - name: Write certified bundle and bind runtime evidence
        shell: bash
        run: |
          python - <<'PY'
          import base64, hashlib, json
          from pathlib import Path

          EVIDENCE_B64 = ''''''

          evidence_path = Path('data/JANUS-GOLDPROMPT-WORKING-FACES-STARTUP-RECEIPT-BUNDLE-v1.0.json')
          evidence_bytes = base64.b64decode(EVIDENCE_B64)
          evidence = json.loads(evidence_bytes.decode('utf-8'))
          assert evidence['status'] == 'GITHUB_MAIN_CI_RUNTIME_HANDSHAKE_VERIFIED_FOR_BOUND_FACES'
          assert evidence['receipt_bundle']['all_required_faces_compliant'] is True
          assert evidence['receipt_bundle']['bundle_sha256'] == 'c5089ab2275798f206220ca6ed71d9c62ab2f0dddac291087b8577c20172e364'
          assert evidence['genesis_bundle_replay_certificate']['result'] == 'PASS'
          evidence_path.write_bytes(evidence_bytes)

          gp_path = Path('data/JANUS-THE-FOURTH-GRACEWARDEN-3IN1-EQUALS-4-v0.9.json')
          gp = json.loads(gp_path.read_text(encoding='utf-8'))
          gp['runtime_receipt_evidence'] = {
              'status': 'GITHUB_MAIN_CI_RUNTIME_HANDSHAKE_VERIFIED_FOR_BOUND_FACES',
              'evidence_artifact': str(evidence_path),
              'goldprompt_contract_version': '0.9.2',
              'emergence_contract_version': 'JANUS_TRIADIC_EMERGENCE@0.9.2',
              'contract_digest_sha256': '3f4af369350710ad18920dfdc866d930c8d42259a51a3f27ce228ea4d5dfc0a8',
              'verified_face_ids': ['LEFT_HRAIN','RIGHT_INAIHR','DEMIHEAD_ARBITER','GENESIS_GUARDIAN_MESH_ORCHESTRATOR'],
              'bundle_sha256': 'c5089ab2275798f206220ca6ed71d9c62ab2f0dddac291087b8577c20172e364',
              'genesis_certification_workflow_run_id': 32009806893,
              'genesis_certification_result': 'PASS',
              'proof_scope': 'EXACT_GITHUB_MAIN_CI_FACE_INVOCATIONS',
              'live_nas_runtime_handshake_verified': False,
              'boundary': 'GITHUB_MAIN_CI_RUNTIME_HANDSHAKE != LIVE_NAS_RUNTIME_HANDSHAKE'
          }
          rs = gp.setdefault('runtime_state', {})
          rs.update({
              'working_face_ci_runtime_handshakes_verified': True,
              'working_face_receipt_bundle': str(evidence_path),
              'working_face_receipt_bundle_sha256': 'c5089ab2275798f206220ca6ed71d9c62ab2f0dddac291087b8577c20172e364',
              'verified_face_ids': ['LEFT_HRAIN','RIGHT_INAIHR','DEMIHEAD_ARBITER','GENESIS_GUARDIAN_MESH_ORCHESTRATOR'],
              'runtime_proof_scope': 'EXACT_GITHUB_MAIN_CI_FACE_INVOCATIONS',
              'all_live_faces_runtime_enforcement_proven': False,
              'live_nas_face_handshakes_verified': False,
              'next_gate': 'DEPLOY_OR_LOAD_THE_SAME_GOLDPROMPT_HANDSHAKE_IN_LIVE_NAS_OR_PRODUCTION_FACE_PROCESSES_AND_COLLECT_FRESH_RUNTIME_RECEIPTS'
          })
          gp_path.write_text(json.dumps(gp, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          mesh_path = Path('data/JANUS-GENESIS-GUARDIAN-MESH-FACE-ORCHESTRATION-v1.0.json')
          mesh = json.loads(mesh_path.read_text(encoding='utf-8'))
          bind = mesh.setdefault('goldprompt_emergence_binding', {})
          bind.update({
              'ci_runtime_face_receipt_bundle_verified': True,
              'ci_runtime_face_receipt_bundle_path': str(evidence_path),
              'ci_runtime_face_receipt_bundle_sha256': 'c5089ab2275798f206220ca6ed71d9c62ab2f0dddac291087b8577c20172e364',
              'ci_runtime_verified_face_ids': ['LEFT_HRAIN','RIGHT_INAIHR','DEMIHEAD_ARBITER','GENESIS_GUARDIAN_MESH_ORCHESTRATOR'],
              'genesis_bundle_replay_workflow_run_id': 32009806893,
              'live_enforcement_status': 'GITHUB_MAIN_CI_PROVEN_FOR_BOUND_FACES; LIVE_NAS_NOT_YET_PROVEN',
              'next_gate': 'DEPLOY_GOLDPROMPT_STARTUP_HANDSHAKE_TO_LIVE_NAS_OR_PRODUCTION_FACES_AND_COLLECT_FRESH_RECEIPTS'
          })
          mesh_path.write_text(json.dumps(mesh, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
      - name: Validate and commit
        run: |
          python -m json.tool data/JANUS-GOLDPROMPT-WORKING-FACES-STARTUP-RECEIPT-BUNDLE-v1.0.json >/dev/null
          python -m json.tool data/JANUS-THE-FOURTH-GRACEWARDEN-3IN1-EQUALS-4-v0.9.json >/dev/null
          python -m json.tool data/JANUS-GENESIS-GUARDIAN-MESH-FACE-ORCHESTRATION-v1.0.json >/dev/null
          git config user.name 'janus-registry-bot'
          git config user.email 'janus-registry-bot@users.noreply.github.com'
          git add data/JANUS-GOLDPROMPT-WORKING-FACES-STARTUP-RECEIPT-BUNDLE-v1.0.json data/JANUS-THE-FOURTH-GRACEWARDEN-3IN1-EQUALS-4-v0.9.json data/JANUS-GENESIS-GUARDIAN-MESH-FACE-ORCHESTRATION-v1.0.json
          git commit -m 'Record GoldPrompt runtime handshake receipts for bound Faces'
          git push
