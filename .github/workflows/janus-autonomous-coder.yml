name: JANUS Autonomous Open-Weight Coder
on:
  schedule:
    - cron: '43 */6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'modules/autonomy_coder/**'
      - 'tests/test_autonomy_coder.py'
      - 'tests/test_autonomy_module_registry.py'
      - 'tests/test_rex_need_intake.py'
      - '.github/workflows/janus-autonomous-coder.yml'
  pull_request:
    paths:
      - 'modules/autonomy_coder/**'
      - 'tests/test_autonomy_coder.py'
      - 'tests/test_autonomy_module_registry.py'
      - 'tests/test_rex_need_intake.py'
      - '.github/workflows/janus-autonomous-coder.yml'
permissions:
  contents: read
concurrency:
  group: janus-autonomous-coder-state
  cancel-in-progress: false
jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Offline admission, provenance, conflict and exactly-once controls
        run: |
          python -m unittest discover -v -s tests -p test_autonomy_coder.py
          python -m unittest discover -v -s tests -p test_autonomy_module_registry.py
          python -m unittest discover -v -s tests -p test_rex_need_intake.py
      - name: Pull exact isolated evaluation runtime
        run: docker pull python@sha256:1148dbb014615300fa7e713b2f94f550c0d1c69780c0805f84f093ceee34dd0b
      - name: Real networkless container positive and negative controls
        run: |
          python - <<'PY'
          import sys, subprocess
          sys.path.insert(0, 'modules/autonomy_coder')
          from lifecycle import isolated_check
          good = 'def retry_delay(attempt, cap):\n    return min(cap, 2 ** attempt)\n'
          assert isolated_check(good, 'retry_delay')['cases'] >= 200
          stable_unique = ('def stable_unique(values):\n'
                           '    seen = set()\n'
                           '    result = []\n'
                           '    for value in values:\n'
                           '        if value not in seen:\n'
                           '            seen.add(value)\n'
                           '            result.append(value)\n'
                           '    return result\n')
          assert isolated_check(stable_unique, 'stable_unique')['cases'] >= 300
          for bad in ('def retry_delay(attempt, cap):\n    return 1\n',
                      'def retry_delay(attempt, cap):\n    while True:\n        pass\n'):
              try:
                  isolated_check(bad, 'retry_delay')
              except (ValueError, subprocess.TimeoutExpired):
                  continue
              raise AssertionError('negative container control accepted')
          print('REAL_ISOLATED_CODE_CONTROLS=PASS')
          PY
  author:
    needs: contract
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: _code
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: janus/autonomous-code-state
          path: _state
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/checkout@v4
        with:
          repository: Hawkar-usls/Janus-Demiurge
          ref: janus/rex-code-need-state
          path: _rex
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            rex/code_needs
      - name: Independently replay exact Rex engineering need before code inference
        run: |
          python _code/modules/autonomy_coder/rex_need_intake.py \
            --rex-dir _rex/rex/code_needs \
            --state _state/STATE.json \
            --out author-input/REX_NEED_GATE.json
      - name: Restore model bytes; every byte is verified before use
        uses: actions/cache@v4
        with:
          path: ~/.cache/janus-open-coder
          key: janus-open-coder-ea3f2471cf1b1f0db85067f1ef93848e38e88c25
      - name: Install CPU inference runtime
        run: |
          python -m pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install transformers==4.57.1 huggingface-hub==0.36.0 safetensors==0.6.2
      - name: Generate two actual model-authored variants for the next admitted task
        env:
          HF_HUB_DISABLE_TELEMETRY: '1'
          HF_HUB_DISABLE_XET: '1'
          TOKENIZERS_PARALLELISM: 'false'
        run: |
          python _code/modules/autonomy_coder/author.py \
            --state _state/STATE.json \
            --cache "$HOME/.cache/janus-open-coder" \
            --rex-need-gate author-input/REX_NEED_GATE.json \
            --out author-output/CANDIDATES.json
      - uses: actions/upload-artifact@v4
        with:
          name: autonomous-coder-candidates
          path: author-output/CANDIDATES.json
          if-no-files-found: error
          retention-days: 30
  independent-evaluator:
    needs: author
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: autonomous-coder-candidates
          path: _candidate
      - name: Pull pinned evaluation image
        run: docker pull python@sha256:1148dbb014615300fa7e713b2f94f550c0d1c69780c0805f84f093ceee34dd0b
      - name: Evaluate both variants without network, credentials or host write access
        run: python modules/autonomy_coder/lifecycle.py evaluate --bundle _candidate/CANDIDATES.json --out evaluation/EVALUATION.json
      - uses: actions/upload-artifact@v4
        with:
          name: autonomous-coder-independent-evaluation
          path: evaluation/EVALUATION.json
          if-no-files-found: error
          retention-days: 30
  publish:
    needs: [author, independent-evaluator]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      state_commit: ${{ steps.save.outputs.state_commit }}
      publish_status: ${{ steps.scope.outputs.publish_status }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: _code
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: janus/autonomous-code-state
          path: _state
          fetch-depth: 1
      - uses: actions/download-artifact@v4
        with:
          name: autonomous-coder-candidates
          path: _candidate
      - uses: actions/download-artifact@v4
        with:
          name: autonomous-coder-independent-evaluation
          path: _evaluation
      - name: Publish exact verified bytes to the dedicated extension branch
        run: |
          python _code/modules/autonomy_coder/lifecycle.py publish \
            --root _state --bundle _candidate/CANDIDATES.json \
            --evaluation _evaluation/EVALUATION.json --out PUBLISH.json
      - name: Package accepted model bytes into immutable isolated modules
        run: |
          python _code/modules/autonomy_coder/module_registry.py build \
            --root _state --out MODULE_BUILD.json
      - name: Preserve immutable attempts and advance state without force or rebase
        id: save
        working-directory: _state
        run: |
          set -euo pipefail
          git config user.name 'janus-autonomous-coder[bot]'
          git config user.email 'janus-autonomous-coder[bot]@users.noreply.github.com'
          git add STATE.json ROADMAP.md MODULE_INDEX.json attempts receipts generated self_modules
          python - <<'PY'
          import subprocess
          paths = subprocess.check_output(['git', 'diff', '--cached', '--name-only'], text=True).splitlines()
          if any(p not in ('STATE.json', 'ROADMAP.md', 'MODULE_INDEX.json') and not p.startswith(('attempts/', 'receipts/', 'generated/', 'self_modules/')) for p in paths):
              raise SystemExit('CODER_WRITE_SCOPE')
          status = subprocess.check_output(['git', 'diff', '--cached', '--diff-filter=D', '--name-only'], text=True)
          if status:
              raise SystemExit('CODER_DELETION_DENIED')
          PY
          if ! git diff --cached --quiet; then
            git diff --cached --check
            git commit -m "coder: exact reviewed extension attempt ${GITHUB_RUN_ID}"
            git push origin HEAD:janus/autonomous-code-state
          fi
          echo "state_commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Publish honest scope
        id: scope
        shell: bash
        run: |
          cat PUBLISH.json >> "$GITHUB_STEP_SUMMARY"
          python - <<'PY'
          import json, os
          from pathlib import Path
          result = json.loads(Path("PUBLISH.json").read_bytes())
          status = result.get("status")
          if status not in ("PROMOTED_PURE_EXTENSION_ONLY", "REJECTED_NO_PROMOTION",
                            "ALREADY_PUBLISHED", "IDLE_ALL_ADMITTED_TASKS_DONE"):
              raise SystemExit("UNRECOGNIZED_CODER_PUBLICATION_STATUS")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as stream:
              stream.write("publish_status=" + status + "\n")
          PY
  clean-consumer:
    needs: publish
    # Idle is not new accepted code. No fresh receipt exists for this run;
    # the previously verified extension must never be presented as new work.
    if: ${{ needs.publish.outputs.publish_status != 'IDLE_ALL_ADMITTED_TASKS_DONE' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: _code
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.publish.outputs.state_commit }}
          path: _state
          persist-credentials: false
      - name: Pull pinned isolated runtime
        run: docker pull python@sha256:1148dbb014615300fa7e713b2f94f550c0d1c69780c0805f84f093ceee34dd0b
      - name: Independently replay exact model candidate, evaluator and module catalog
        run: python _code/modules/autonomy_coder/module_registry.py verify --root _state --expected-run-id "${{ github.run_id }}-${{ github.run_attempt }}"
      - name: Reconstruct from durable Git and call the verified extension
        run: python _code/modules/autonomy_coder/lifecycle.py consume --root _state --expected-run-id "${{ github.run_id }}-${{ github.run_attempt }}" --out CONSUMPTION.json
      - uses: actions/upload-artifact@v4
        with:
          name: autonomous-coder-clean-consumption
          path: CONSUMPTION.json
          if-no-files-found: error
          retention-days: 30
      - run: cat CONSUMPTION.json >> "$GITHUB_STEP_SUMMARY"

  closed-loop-retry-benchmark:
    # PR-only source-bound experiment; no generation, publishing, or main changes.
    needs: contract
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.number == 459 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'janus/closed-loop-proof-gate-r1-20261108'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - name: Checkout frozen review code without a persistent token
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Checkout exact previously reviewed candidate commit
        uses: actions/checkout@v4
        with:
          repository: Hawkar-usls/janus-meta-registry
          ref: 2652dd70d8f65385316cd309d4a74db2b948dc46
          path: _candidate
          persist-credentials: false
          sparse-checkout: |
            candidate_modules/retry_delay
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reject changed reviewed candidate revision
        run: |
          test "$(git -C _candidate rev-parse HEAD)" = 2652dd70d8f65385316cd309d4a74db2b948dc46
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Pull existing pinned networkless Coder sandbox image
        run: docker pull python@sha256:1148dbb014615300fa7e713b2f94f550c0d1c69780c0805f84f093ceee34dd0b
      - name: Run frozen correctness and paired timing only inside locked-down container
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _trial
          docker run --rm \
            --network none --read-only --user 65534:65534 \
            --cap-drop ALL --security-opt no-new-privileges \
            --memory 256m --cpus 1 --pids-limit 32 --ulimit cpu=30:30 \
            --tmpfs /tmp:rw,noexec,nosuid,size=16m \
            --mount "type=bind,src=$PWD,dst=/src,readonly" \
            python@sha256:1148dbb014615300fa7e713b2f94f550c0d1c69780c0805f84f093ceee34dd0b \
            python -I -B /src/modules/autonomy_loop/benchmark_retry_delay.py \
              --candidate-root /src/_candidate \
              --evaluator-commit "$GITHUB_SHA" \
              --run-id "$GITHUB_RUN_ID" > _trial/TRIAL.json
          python - <<'PY'
          import json
          from pathlib import Path
          record=json.loads(Path("_trial/TRIAL.json").read_text())
          assert record["execution_scope"]=="ISOLATED_DOCKER_NO_NETWORK"
          assert record["independent_replay_attested"] is False
          assert record["promotion"] is False
          assert record["verified_train_holdout_disjoint"] is True
          assert record["coder_oracle_cases_per_variant"]==291
          Path("_trial/MEASUREMENT.json").write_text(
              json.dumps(record["measurement"],sort_keys=True,indent=2)+"\n")
          PY
      - name: Fail-closed source-bound gain screening (negative outcomes are evidence)
        shell: bash
        run: |
          set -euo pipefail
          rc=0
          python modules/autonomy_loop/proof_of_improvement.py \
            experiments/closed_loop_retry_delay_r1/PROTOCOL.json \
            _trial/MEASUREMENT.json > _trial/SCREEN.json || rc=$?
          # Exit=1 means a valid negative comparison; exit=2 is invalid evidence.
          test "$rc" -eq 0 -o "$rc" -eq 1
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          from modules.autonomy_loop.proof_of_improvement import digest
          trial=json.loads(Path("_trial/TRIAL.json").read_text())
          screen=json.loads(Path("_trial/SCREEN.json").read_text())
          assert screen["schema"]=="janus.closed_loop.improvement_screen.v1"
          assert screen["authority_delta"]==0 and screen["allow_auto_merge"] is False
          assert screen["independent_replay_attested"] is False
          assert screen["runtime_consumption_attested"] is False
          assert screen["production_promotion"] is False
          assert screen["measurement_sha256"]==digest(trial["measurement"])
          print("JANUS_RETRY_TRIAL_JSON="+json.dumps(trial,sort_keys=True,separators=(",",":")))
          print("JANUS_RETRY_SCREEN_JSON="+json.dumps(screen,sort_keys=True,separators=(",",":")))
          with open(os.environ["GITHUB_STEP_SUMMARY"],"a") as out:
              out.write("## JANUS retry_delay R1 frozen reference comparison\n\n")
              out.write("- Correctness: 291 original oracle cases per variant, plus 91 training and 8 holdout cases.\n")
              out.write("- Frozen holdout disjoint from training; all timing in networkless read-only Docker.\n")
              out.write("- Measured result: **"+screen["status"]+"**\n")
              out.write("- Mean paired gain (microseconds per call): "+str(screen["mean_paired_gain"])+"\n")
              out.write("- Regressions: "+str(screen["regressions"])+"\n")
              out.write("- **Not independently replayed; not a production baseline; no runtime promotion.**\n")
          PY
      - name: Retain exact measurement and negative-or-positive verdict
        uses: actions/upload-artifact@v4
        with:
          name: janus-retry-delay-reference-trial-${{ github.run_id }}
          path: |
            _trial/TRIAL.json
            _trial/MEASUREMENT.json
            _trial/SCREEN.json
            experiments/closed_loop_retry_delay_r1/PROTOCOL.json
            experiments/closed_loop_retry_delay_r1/TRAIN_MANIFEST.json
            experiments/closed_loop_retry_delay_r1/HOLDOUT_MANIFEST.json
            experiments/closed_loop_retry_delay_r1/BASELINE.py
          if-no-files-found: error
          retention-days: 30
