name: Janus Bear Spatial Verification

on:
  pull_request:
    paths:
      - "tools/analyze_teddy_gnome_enrichment.py"
      - "tools/analyze_teddy_gnome_enrichment_v4_2.py"
      - "tools/verify_janus_bear_publication.py"
      - "tools/fo3edit_teddy_context_inventory_export.pas"
      - "tests/test_teddy_gnome_enrichment.py"
      - "tests/test_teddy_gnome_enrichment_v4_2.py"
      - "tests/test_teddy_skeleton_proximity.py"
      - "data/JANUS-BEAR-CHILD-GUARDIAN-COMPANION-v1.0.json"
      - "registry/myth_busted/FALLOUT-JANUS-BEAR-GNOME-PROXY-ACTOR-GRAMMAR-v4.0.json"
      - "registry/myth_busted/FALLOUT-3-JANUS-BEAR-SPATIAL-ENRICHMENT-TECHNICAL-v4.0.json"
      - "registry/myth_busted/FALLOUT-3-JANUS-BEAR-SPATIAL-ENRICHMENT-HARDENING-v4.2.json"
      - "registry/myth_busted/FALLOUT-3-JANUS-BEAR-CONTEXT-LEDGER-SCHEMA-v4.0.json"
      - "registry/myth_busted/JANUS-BEAR-GNOME-SPATIAL-PUBLICATION-RECEIPT-v4.1.json"
      - ".github/workflows/janus-bear-spatial.yml"
  push:
    branches:
      - main
    paths:
      - "tools/analyze_teddy_gnome_enrichment.py"
      - "tools/analyze_teddy_gnome_enrichment_v4_2.py"
      - "tools/verify_janus_bear_publication.py"
      - "tools/fo3edit_teddy_context_inventory_export.pas"
      - "tests/test_teddy_gnome_enrichment.py"
      - "tests/test_teddy_gnome_enrichment_v4_2.py"
      - "tests/test_teddy_skeleton_proximity.py"
      - "data/JANUS-BEAR-CHILD-GUARDIAN-COMPANION-v1.0.json"
      - "registry/myth_busted/FALLOUT-JANUS-BEAR-GNOME-PROXY-ACTOR-GRAMMAR-v4.0.json"
      - "registry/myth_busted/FALLOUT-3-JANUS-BEAR-SPATIAL-ENRICHMENT-TECHNICAL-v4.0.json"
      - "registry/myth_busted/FALLOUT-3-JANUS-BEAR-SPATIAL-ENRICHMENT-HARDENING-v4.2.json"
      - "registry/myth_busted/FALLOUT-3-JANUS-BEAR-CONTEXT-LEDGER-SCHEMA-v4.0.json"
      - "registry/myth_busted/JANUS-BEAR-GNOME-SPATIAL-PUBLICATION-RECEIPT-v4.1.json"
      - ".github/workflows/janus-bear-spatial.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout exact event head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Assert exact requested head
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          ACTUAL_HEAD="$(git rev-parse HEAD)"
          echo "EXPECTED_HEAD=$EXPECTED_HEAD"
          echo "ACTUAL_HEAD=$ACTUAL_HEAD"
          test "$ACTUAL_HEAD" = "$EXPECTED_HEAD"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test runner
        run: python -m pip install --disable-pip-version-check pytest

      - name: Compile Janus Bear Python tools
        run: |
          python -m py_compile tools/analyze_teddy_gnome_enrichment.py
          python -m py_compile tools/analyze_teddy_gnome_enrichment_v4_2.py
          python -m py_compile tools/verify_janus_bear_publication.py

      - name: Validate Janus Bear JSON artifacts
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          paths = [
              Path("data/JANUS-BEAR-CHILD-GUARDIAN-COMPANION-v1.0.json"),
              Path("registry/myth_busted/FALLOUT-JANUS-BEAR-GNOME-PROXY-ACTOR-GRAMMAR-v4.0.json"),
              Path("registry/myth_busted/FALLOUT-3-JANUS-BEAR-SPATIAL-ENRICHMENT-TECHNICAL-v4.0.json"),
              Path("registry/myth_busted/FALLOUT-3-JANUS-BEAR-SPATIAL-ENRICHMENT-HARDENING-v4.2.json"),
              Path("registry/myth_busted/FALLOUT-3-JANUS-BEAR-CONTEXT-LEDGER-SCHEMA-v4.0.json"),
              Path("registry/myth_busted/JANUS-BEAR-GNOME-SPATIAL-PUBLICATION-RECEIPT-v4.1.json"),
          ]
          for path in paths:
              json.loads(path.read_text(encoding="utf-8"))
              print(f"JSON_PASS {path}")
          PY

      - name: Run teddy and gnome deterministic tests
        run: |
          python -m pytest -q \
            tests/test_teddy_gnome_enrichment.py \
            tests/test_teddy_gnome_enrichment_v4_2.py \
            tests/test_teddy_skeleton_proximity.py | tee janus-bear-pytest.log

      - name: Verify frozen v4.1 lineage and claim ceiling
        run: |
          python tools/verify_janus_bear_publication.py \
            --pretty \
            --out janus-bear-ci-lineage.json

      - name: Emit exact Git receipt
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import json, os, subprocess
          from pathlib import Path

          def git(*args):
              return subprocess.check_output(["git", *args], text=True).strip()

          actual = git("rev-parse", "HEAD")
          expected = os.environ["EXPECTED_HEAD"]
          receipt = {
              "schema": "janus.bear.github_actions.git_receipt.v3",
              "event": os.environ["EVENT_NAME"],
              "ref_name": os.environ["REF_NAME"],
              "expected_head": expected,
              "actual_head": actual,
              "exact_head_match": actual == expected,
              "tree": git("rev-parse", "HEAD^{tree}"),
              "status_scope": "CI verifies deterministic code/tests/lineage only; no official ESM reference population is present in this job.",
              "real_esm_result_established": False,
              "static_skeleton_proxy_is_all_human_remains": False,
              "distance_512_establishes_same_visible_scene": False,
          }
          if not receipt["exact_head_match"]:
              raise SystemExit("exact event-head mismatch")
          Path("janus-bear-git-receipt.json").write_text(
              json.dumps(receipt, indent=2) + "\n", encoding="utf-8"
          )
          print(json.dumps(receipt, indent=2))
          PY

      - name: Upload Janus Bear CI receipt
        uses: actions/upload-artifact@v4
        with:
          name: janus-bear-ci-receipt-v4-2
          path: |
            janus-bear-pytest.log
            janus-bear-ci-lineage.json
            janus-bear-git-receipt.json
          if-no-files-found: error
