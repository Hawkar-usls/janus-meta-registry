name: JANUS Engine R0D1A archive audit
on:
  pull_request:
    branches: [research/janus-engine]
    types: [opened, synchronize, reopened]
    paths:
      - 'projects/janus-engine/digital-twin/r0d1/**'
      - '.github/workflows/janus-engine-r0d1-audit.yml'
permissions:
  contents: read
jobs:
  archive-audit:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'research/janus-engine-r0d1-open-data-20261119'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Test audit on synthetic fixture
        run: python3 projects/janus-engine/digital-twin/r0d1/archive_audit.py --self-test-only --output self-test.json
      - name: Acquire and inventory published experiment archive
        run: python3 projects/janus-engine/digital-twin/r0d1/archive_audit.py --output provenance.json
      - name: Review experiment schema and source documentation
        run: python3 projects/janus-engine/digital-twin/r0d1/schema_review.py
      - name: Reconstruct experimental points and screen raw recovery curves
        run: python3 projects/janus-engine/digital-twin/r0d1/reproduce.py --archive verified-experiments.tgz --output r0d1b-results.json
      - name: Audit O2 inventory, gas circulation and loaded raw windows
        run: python3 projects/janus-engine/digital-twin/r0d1/audit_inventory.py --archive verified-experiments.tgz --output r0d1c-results.json
      - name: Independently calibrate EXP09 and reproduce EXP03 volume
        run: python3 projects/janus-engine/digital-twin/r0d1/calibrate_fc_volume.py --archive verified-experiments.tgz --output r0d1c1-results.json
      - name: Separate Faradaic consumption and signed residual
        run: python3 projects/janus-engine/digital-twin/r0d1/gas_balance.py
      - name: Identify residual ranges and compare frozen twin with all CFD cases
        run: python3 projects/janus-engine/digital-twin/r0d1/residual_identification.py
      - name: Preserve evidence even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: janus-engine-r0d1a-evidence
          path: |
            self-test.json
            provenance.json
            schema-review.json
            verified-experiments.tgz
            r0d1b-results.json
            r0d1c-results.json
            r0d1c1-results.json
            r0d1c2-results.json
            r0d1c3-results.json
          if-no-files-found: warn
