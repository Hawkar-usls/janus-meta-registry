name: JANUS Fresco Forge

on:
  workflow_dispatch:
    inputs:
      max_images:
        description: 'Requested number of frescoes (GitHub CPU mode currently caps each run at 1)'
        required: false
        default: '1'
  push:
    branches: [ main ]
    paths:
      - 'registry/**/*.json'
      - 'modules/fresco_forge/**'
      - '.github/workflows/janus-fresco-forge.yml'
  schedule:
    - cron: '17 */6 * * *'

permissions:
  contents: write

concurrency:
  group: janus-fresco-forge-main
  cancel-in-progress: false

jobs:
  forge:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout meta-registry
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache Hugging Face model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface/hub
          key: fresco-forge-dreamlike-photoreal-2.0-v1

      - name: Install CPU Diffusers stack
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch torchvision
          python -m pip install --upgrade diffusers transformers accelerate safetensors pillow

      - name: Compile Fresco Forge
        run: |
          python -m py_compile modules/fresco_forge/forge.py
          python -m py_compile modules/fresco_forge/compat_runner.py
          python -m py_compile modules/fresco_forge/v3_runner.py
          python -m py_compile modules/fresco_forge/v4_runner.py
          python -m py_compile modules/fresco_forge/v4_1_runner.py
          python -m py_compile modules/fresco_forge/v4_1_1_runner.py

      - name: Resolve CPU-safe generation budget
        id: budget
        shell: bash
        run: |
          set -euo pipefail
          REQUESTED=1
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            REQUESTED="${{ inputs.max_images }}"
          fi
          if ! [[ "$REQUESTED" =~ ^[1-9][0-9]*$ ]]; then
            echo "Invalid max_images: $REQUESTED"
            exit 2
          fi
          MAX_IMAGES=1
          if [ "$REQUESTED" -gt 1 ]; then
            echo "Requested $REQUESTED images; CPU-safe cap is 1 image per run."
          fi
          echo "max_images=$MAX_IMAGES" >> "$GITHUB_OUTPUT"

      - name: Discover next unique JSON record
        env:
          FRESCO_GUIDANCE_SCALE: '8.0'
          FRESCO_MAX_PROMPT_CHUNKS: '6'
        run: |
          python modules/fresco_forge/v4_1_1_runner.py \
            --max-images '${{ steps.budget.outputs.max_images }}' \
            --dry-run

      - name: Generate fresco locally with v4.1.1 semantic-role firewall
        env:
          FRESCO_MODEL: dreamlike-art/dreamlike-photoreal-2.0
          FRESCO_STEPS: '20'
          FRESCO_WIDTH: '512'
          FRESCO_HEIGHT: '512'
          FRESCO_GUIDANCE_SCALE: '8.0'
          FRESCO_MAX_PROMPT_CHUNKS: '6'
          TOKENIZERS_PARALLELISM: 'false'
        run: |
          python modules/fresco_forge/v4_1_1_runner.py \
            --max-images '${{ steps.budget.outputs.max_images }}'

      - name: Commit generated fresco and receipt
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'JANUS Fresco Forge'
          git config user.email 'actions@users.noreply.github.com'
          git add artifacts/janus-fresco-forge/
          if git diff --cached --quiet; then
            echo 'FRESCO_FORGE_NO_NEW_OUTPUT'
            exit 0
          fi
          git commit -m '[fresco-forge] Render next canonical JSON fresco'
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo 'FRESCO_FORGE_REBASE_CONFLICT'
              exit 1
            fi
            if git push origin HEAD:main; then
              echo 'FRESCO_FORGE_PUSH=SUCCESS'
              exit 0
            fi
            echo "FRESCO_FORGE_PUSH_RACE_RETRY=$attempt"
            sleep $((attempt * 2))
          done
          echo 'FRESCO_FORGE_PUSH=FAILED_AFTER_RETRIES'
          exit 1

      - name: Upload generated run artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: janus-fresco-forge-${{ github.run_id }}
          path: |
            artifacts/janus-fresco-forge/images/*.png
            artifacts/janus-fresco-forge/receipts/*.json
            artifacts/janus-fresco-forge/ledger.jsonl
          if-no-files-found: ignore
