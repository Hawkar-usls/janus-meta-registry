name: JANUS HRAiN Full Memory

on:
  pull_request:
    branches: [main]
    paths:
      - 'data/JANUS-HRAIN-FULL-MEMORY-CONTRACT-v1.0.json'
      - 'research/site/janus_hrain_full_memory_export.py'
      - 'tests/test_hrain_full_memory_export.py'
      - '.github/workflows/janus-hrain-full-memory.yml'
  push:
    branches: [main]
    paths-ignore:
      - 'assets/hrain-full-memory/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependency
        run: python -m pip install --quiet pytest
      - name: Validate full-memory contract
        run: python -m json.tool data/JANUS-HRAIN-FULL-MEMORY-CONTRACT-v1.0.json >/dev/null
      - name: Compile exporter and tests
        run: python -m compileall -q research/site/janus_hrain_full_memory_export.py tests/test_hrain_full_memory_export.py
      - name: Run full-current memory tests
        run: python -m pytest -q tests/test_hrain_full_memory_export.py
      - name: Prove writer notices first-time untracked output
        shell: bash
        run: |
          grep -q "git status --porcelain -- assets/hrain-full-memory" .github/workflows/janus-hrain-full-memory.yml
          ! grep -q "git diff --quiet -- assets/hrain-full-memory" .github/workflows/janus-hrain-full-memory.yml
          grep -q "git fetch origin main" .github/workflows/janus-hrain-full-memory.yml
          grep -q "git reset --hard origin/main" .github/workflows/janus-hrain-full-memory.yml
          grep -q "for attempt in 1 2 3" .github/workflows/janus-hrain-full-memory.yml
          ! grep -q "git push --force" .github/workflows/janus-hrain-full-memory.yml
          echo 'FIRST_GENERATED_CATALOG_PERSISTENCE=GUARDED'
          echo 'CONCURRENT_MAIN_WRITER=BOUNDED_REGENERATE_RETRY'
      - name: Build one bounded full-current catalog witness
        run: |
          mkdir -p runtime
          python research/site/janus_hrain_full_memory_export.py \
            --output-root runtime/hrain-full-memory \
            --validate | tee runtime/hrain-full-memory-summary.json
          python - <<'PY'
          import json
          m=json.load(open('runtime/hrain-full-memory/manifest.json'))
          c=m['coverage']
          assert c['coverage_complete'] is True
          assert c['tracked_blob_count'] == c['cataloged_blob_count'] + c['generated_self_export_exclusion_count']
          assert m['historical_lineage_included'] is False
          assert m['authority']['read_only'] is True
          assert m['authority']['scientific_authority_granted'] is False
          print('HRAIN_FULL_CURRENT_MEMORY_CONTRACT=PASS')
          print('CATALOG_DIGEST='+m['catalog_digest'])
          print('CATALOGED_BLOBS='+str(c['cataloged_blob_count']))
          print('SHARDS='+str(m['sharding']['shard_count']))
          PY

  refresh-main:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: contract
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    concurrency:
      group: janus-hrain-full-memory-writer
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Generate deterministic full-current memory catalog
        run: python research/site/janus_hrain_full_memory_export.py --validate
      - name: Commit generated HRAiN full-memory catalog if changed
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'JANUS HRAiN Memory'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          # Other trusted workflows also append to main. Never force through them:
          # on each bounded retry, start from the newest remote main and rebuild
          # the deterministic catalog so its source_commit cannot become stale.
          for attempt in 1 2 3; do
            echo "HRAIN_FULL_MEMORY_WRITE_ATTEMPT=${attempt}"
            git fetch origin main
            git reset --hard origin/main
            python research/site/janus_hrain_full_memory_export.py --validate

            if [[ -z "$(git status --porcelain -- assets/hrain-full-memory)" ]]; then
              echo 'HRAIN_FULL_MEMORY=UNCHANGED'
              exit 0
            fi

            git add assets/hrain-full-memory
            git commit -m 'chore(hrain): refresh full current Meta Registry memory catalog'
            if git push origin HEAD:main; then
              echo 'HRAIN_FULL_MEMORY=PERSISTED'
              exit 0
            fi

            echo "HRAIN_FULL_MEMORY_PUSH_RACE=${attempt}; retrying from newest origin/main"
          done

          echo 'HRAIN_FULL_MEMORY=FAIL_CLOSED_AFTER_BOUNDED_RETRIES' >&2
          exit 1
