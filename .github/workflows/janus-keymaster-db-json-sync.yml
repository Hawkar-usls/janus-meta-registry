name: JANUS DADDY_KEYMASTER Meta Registry JSON Database Mirror

on:
  pull_request:
    paths:
      - 'scripts/keymaster_db_sync.py'
      - 'scripts/keymaster_db_verify.py'
      - 'tests/test_keymaster_db_sync.py'
      - '.github/workflows/janus-keymaster-db-json-sync.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/keymaster_db_sync.py'
      - 'scripts/keymaster_db_verify.py'
      - 'tests/test_keymaster_db_sync.py'
      - '.github/workflows/janus-keymaster-db-json-sync.yml'
  schedule:
    - cron: '19 5,17 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: janus-keymaster-meta-registry-db-mirror
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify full replay, SHA, archive chain and immutable dedup
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p test_keymaster_db_sync.py -v
      - name: Check live pinned Keymaster source without writing (PR safe)
        run: |
          set -euo pipefail
          python scripts/keymaster_db_sync.py --check-only

  archive:
    if: github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Refresh full verified JSON DB only if immutable source HEAD advanced
        run: |
          set -euo pipefail
          python scripts/keymaster_db_sync.py --output-dir data/daddy_keymaster_db
          git add -- data/daddy_keymaster_db/LATEST.json data/daddy_keymaster_db/MIRROR.json data/daddy_keymaster_db/MIRROR.sha256 data/daddy_keymaster_db/snapshots/
          if git diff --cached --quiet; then
            echo 'JANUS_KEYMASTER_DB_NO_CHANGE'
            exit 0
          fi
          # Only the generated allowlisted JSON files may be included.
          git diff --cached --name-only | while IFS= read -r file; do
            case "$file" in
              data/daddy_keymaster_db/LATEST.json|data/daddy_keymaster_db/MIRROR.json|data/daddy_keymaster_db/MIRROR.sha256|data/daddy_keymaster_db/snapshots/*.json) ;;
              *) echo 'UNEXPECTED_KEYMASTER_PATH' >&2; exit 1 ;;
            esac
          done
          # Rebase needs a local committer identity, not just -c for
          # the first commit. Restrict this identity to this checkout.
          git config user.name 'janus-keymaster-witness[bot]'
          git config user.email 'janus-keymaster-witness@users.noreply.github.com'
          git commit -m 'meta-registry: archive verified Keymaster JSON state'
          # Meta Registry has independent legitimate writers. Replay this
          # ONE verified JSON-only commit on a newer main, at most four times.
          # No force push; any rebase conflict or invalid source stops.
          published=0
          for attempt in 1 2 3 4; do
            git fetch origin main
            if ! git merge-base --is-ancestor origin/main HEAD; then
              git rebase origin/main || {
                echo 'KEYMASTER_MIRROR_REBASE_CONFLICT_HOLD' >&2
                exit 1
              }
            fi
            python scripts/keymaster_db_sync.py --check-only
            if git push origin HEAD:refs/heads/main; then
              echo 'KEYMASTER_META_JSON_PUBLISHED'
              published=1
              break
            fi
            sleep 2
          done
          if [ "$published" != "1" ]; then
            echo 'KEYMASTER_META_JSON_BOUNDED_CAS_CONFLICT_HOLD' >&2
            exit 1
          fi
