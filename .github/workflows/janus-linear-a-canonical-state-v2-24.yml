name: JANUS Linear A canonical state v2.24
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/janus-linear-a-canonical-state-v2-24.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Compile v2.24 promotion auditor
        run: python -m py_compile research/linear_a/janus_linear_a_canonical_state_v2_24.py
      - name: Build and audit v2.24
        run: |
          python research/linear_a/janus_linear_a_canonical_state_v2_24.py \
            --spec data/JANUS-LINEAR-A-RESEARCH-STATE-PROMOTION-SPEC-2026-08-15-v2.24.json \
            --candidate-out data/JANUS-LINEAR-A-RESEARCH-STATE-2026-08-15-v2.24-CANDIDATE.json \
            --canonical-out data/JANUS-LINEAR-A-RESEARCH-STATE-2026-08-15-v2.24.json \
            --audit-out data/JANUS-LINEAR-A-RESEARCH-STATE-CANONICALITY-AUDIT-2026-08-15-v2.24.json
      - name: Enforce claim ceiling
        run: |
          python - <<'PY'
          import json
          c=json.load(open('data/JANUS-LINEAR-A-RESEARCH-STATE-2026-08-15-v2.24.json',encoding='utf-8'))
          a=json.load(open('data/JANUS-LINEAR-A-RESEARCH-STATE-CANONICALITY-AUDIT-2026-08-15-v2.24.json',encoding='utf-8'))
          assert a['status']=='CANONICALITY_AUDIT_PASS' and a['all_checks_pass'] is True
          assert c['version']=='v2.24' and c['status']=='CURRENT_CANONICAL_RESEARCH_STATE'
          g=c['global_claim_ceiling_v2_24']
          assert g['cross_region_internal_context_structure_transfer_established'] is True
          assert g['semantic_equivalence_established'] is False
          assert g['translation_established'] is False
          assert g['phonetic_value_established'] is False
          assert g['new_anchor_established'] is False
          assert g['decipherment_established'] is False
          assert g['strict_R3B_replication_established'] is False
          print(json.dumps({'version':c['version'],'transfer':g['cross_region_internal_context_structure_transfer_established'],'audit':a['status']},indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: janus-linear-a-canonical-state-v2-24
          path: |
            data/JANUS-LINEAR-A-RESEARCH-STATE-2026-08-15-v2.24-CANDIDATE.json
            data/JANUS-LINEAR-A-RESEARCH-STATE-2026-08-15-v2.24.json
            data/JANUS-LINEAR-A-RESEARCH-STATE-CANONICALITY-AUDIT-2026-08-15-v2.24.json
          if-no-files-found: error
      - name: Persist v2.24
        run: |
          git config user.name 'JANUS Evidence Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add \
            data/JANUS-LINEAR-A-RESEARCH-STATE-2026-08-15-v2.24-CANDIDATE.json \
            data/JANUS-LINEAR-A-RESEARCH-STATE-2026-08-15-v2.24.json \
            data/JANUS-LINEAR-A-RESEARCH-STATE-CANONICALITY-AUDIT-2026-08-15-v2.24.json
          git commit -m 'Promote Linear A canonical research state v2.24' || true
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then exit 0; fi
            git pull --rebase origin main
          done
          exit 1
