name: JANUS Linear A full corpus

on:
  push:
    paths:
      - "research/linear_a/janus_linear_a_full_corpus.py"
      - ".github/workflows/janus-linear-a-full-corpus.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout JANUS registry
        uses: actions/checkout@v4

      - name: Fetch frozen Linear A corpus
        shell: bash
        run: |
          set -euo pipefail
          git clone --quiet https://github.com/mwenge/lineara.xyz.git /tmp/lineara
          git -C /tmp/lineara checkout --quiet 43fe7cf1abc8e6bb1ea3228c3a1bd5938709620a
          test "$(git -C /tmp/lineara rev-parse HEAD)" = "43fe7cf1abc8e6bb1ea3228c3a1bd5938709620a"
          echo "Frozen corpus commit verified."
          find /tmp/lineara/items -maxdepth 1 -name '*.html' | wc -l

      - name: Run JANUS blind structural analysis
        shell: bash
        run: |
          set -euo pipefail
          python3 research/linear_a/janus_linear_a_full_corpus.py \
            --corpus /tmp/lineara \
            --out artifacts/JANUS-LINEAR-A-FULL-CORPUS-RUN-2026-08-14.json \
            --permutations 5000 \
            --seed 260814025

      - name: Validate receipt claim ceiling
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          p = 'artifacts/JANUS-LINEAR-A-FULL-CORPUS-RUN-2026-08-14.json'
          d = json.load(open(p, encoding='utf-8'))
          assert d['source']['frozen_commit'] == '43fe7cf1abc8e6bb1ea3228c3a1bd5938709620a'
          assert d['corpus_counts']['parsed_inscriptions'] >= 300
          assert d['corpus_counts']['token_to_number_pairs'] >= 100
          assert d['epistemic_gate']['new_anchor_established'] is False
          assert d['epistemic_gate']['decipherment_established'] is False
          print(json.dumps({
              'parsed_inscriptions': d['corpus_counts']['parsed_inscriptions'],
              'token_to_number_pairs': d['corpus_counts']['token_to_number_pairs'],
              'candidate_gate': d['epistemic_gate']['blind_numeric_candidate_gate_pass'],
              'strongest_fwer_p': d['epistemic_gate']['strongest_familywise_corrected_p'],
              'claim_ceiling': d['epistemic_gate']['promotion'],
          }, sort_keys=True))
          PY

      - name: Upload execution receipt
        uses: actions/upload-artifact@v4
        with:
          name: janus-linear-a-full-corpus-receipt
          path: artifacts/JANUS-LINEAR-A-FULL-CORPUS-RUN-2026-08-14.json
          if-no-files-found: error
          retention-days: 30
