name: JANUS Linear A R3B-0 Notti 2018 open-publisher rescue acquisition v0.1.1

on:
  push:
    branches: [main]
    paths:
      - 'data/JANUS-LINEAR-A-R3B-0-NOTTI-2018-OPEN-PUBLISHER-RESCUE-ACQUISITION-RECOVERY-SPEC-2026-08-14-v0.1.1.json'
      - 'research/linear_a/janus_linear_a_r3b0_notti_2018_open_publisher_rescue_acquisition_v0_1_1.py'
      - '.github/workflows/janus-linear-a-r3b0-notti-2018-open-publisher-rescue-acquisition-v0-1-1.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout registry
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install only missing PDF crypto-capable dependency layer
        run: python -m pip install --disable-pip-version-check 'pypdf[crypto]==5.9.0'

      - name: Compile corrective acquisition runner
        run: python -m py_compile research/linear_a/janus_linear_a_r3b0_notti_2018_open_publisher_rescue_acquisition_v0_1_1.py

      - name: Execute fresh exact-byte recovery acquisition
        run: |
          python research/linear_a/janus_linear_a_r3b0_notti_2018_open_publisher_rescue_acquisition_v0_1_1.py \
            --spec data/JANUS-LINEAR-A-R3B-0-NOTTI-2018-OPEN-PUBLISHER-RESCUE-ACQUISITION-RECOVERY-SPEC-2026-08-14-v0.1.1.json \
            --out data/JANUS-LINEAR-A-R3B-0-NOTTI-2018-OPEN-PUBLISHER-RESCUE-ACQUISITION-RESULT-2026-08-14-v0.1.1.json \
            --pdf-tmp /tmp/notti-2018-12iccs-recovery.pdf

      - name: Enforce byte continuity and bounded admission
        run: |
          python - <<'PY'
          import json
          p='data/JANUS-LINEAR-A-R3B-0-NOTTI-2018-OPEN-PUBLISHER-RESCUE-ACQUISITION-RESULT-2026-08-14-v0.1.1.json'
          x=json.load(open(p,encoding='utf-8'))
          assert x['status']=='EXACT_OPEN_PUBLISHER_BYTES_ADMITTED_CONTENT_VISIBLE_NONBLIND_RESCUE_WITNESS'
          assert x['all_checks_pass'] is True
          assert x['transport_receipt']['byte_length']==397594
          assert x['transport_receipt']['sha256']=='9b9ecee53733bd7f778d6cc4c1edf9a98e0b06385f97f6852de519c2082ec863'
          assert x['transport_receipt']['page_count']==9
          assert x['recovery_continuity']['same_bytes_reproduced'] is True
          assert x['content_and_blinding_classification']['blind_novelty_credit'] is False
          assert x['content_and_blinding_classification']['scientific_comparison_started_in_this_gate'] is False
          print('corrective exact-byte admission PASS')
          PY

      - name: Upload immutable corrective receipt evidence
        uses: actions/upload-artifact@v4
        with:
          name: janus-linear-a-notti-2018-open-publisher-rescue-receipt-v0-1-1
          path: data/JANUS-LINEAR-A-R3B-0-NOTTI-2018-OPEN-PUBLISHER-RESCUE-ACQUISITION-RESULT-2026-08-14-v0.1.1.json
          if-no-files-found: error
          retention-days: 90

      - name: Persist corrective result with concurrent-main recovery
        env:
          RESULT: data/JANUS-LINEAR-A-R3B-0-NOTTI-2018-OPEN-PUBLISHER-RESCUE-ACQUISITION-RESULT-2026-08-14-v0.1.1.json
        run: |
          git config user.name 'JANUS Evidence Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add "$RESULT"
          git commit -m 'Register Linear A Notti 2018 exact open-publisher acquisition receipt v0.1.1' || true
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "push attempt $attempt raced with main; rebasing"
            git pull --rebase origin main
          done
          echo 'unable to persist corrective result after 5 attempts' >&2
          exit 1
