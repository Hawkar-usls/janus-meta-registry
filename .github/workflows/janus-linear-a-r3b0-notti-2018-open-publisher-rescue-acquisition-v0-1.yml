name: JANUS Linear A R3B-0 Notti 2018 open-publisher rescue acquisition v0.1

on:
  push:
    branches: [main]
    paths:
      - 'data/JANUS-LINEAR-A-R3B-0-NOTTI-2018-OPEN-PUBLISHER-RESCUE-ACQUISITION-SPEC-2026-08-14-v0.1.json'
      - 'research/linear_a/janus_linear_a_r3b0_notti_2018_open_publisher_rescue_acquisition_v0_1.py'
      - '.github/workflows/janus-linear-a-r3b0-notti-2018-open-publisher-rescue-acquisition-v0-1.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout registry
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PDF receipt dependency
        run: python -m pip install --disable-pip-version-check pypdf==5.9.0

      - name: Compile acquisition runner
        run: python -m py_compile research/linear_a/janus_linear_a_r3b0_notti_2018_open_publisher_rescue_acquisition_v0_1.py

      - name: Execute exact-byte acquisition and receipt
        run: |
          python research/linear_a/janus_linear_a_r3b0_notti_2018_open_publisher_rescue_acquisition_v0_1.py \
            --spec data/JANUS-LINEAR-A-R3B-0-NOTTI-2018-OPEN-PUBLISHER-RESCUE-ACQUISITION-SPEC-2026-08-14-v0.1.json \
            --out data/JANUS-LINEAR-A-R3B-0-NOTTI-2018-OPEN-PUBLISHER-RESCUE-ACQUISITION-RESULT-2026-08-14-v0.1.json \
            --pdf-tmp /tmp/notti-2018-12iccs.pdf

      - name: Enforce bounded rescue-witness verdict
        run: |
          python - <<'PY'
          import json
          p='data/JANUS-LINEAR-A-R3B-0-NOTTI-2018-OPEN-PUBLISHER-RESCUE-ACQUISITION-RESULT-2026-08-14-v0.1.json'
          x=json.load(open(p,encoding='utf-8'))
          assert x['status']=='EXACT_OPEN_PUBLISHER_BYTES_ACQUIRED_CONTENT_VISIBLE_NONBLIND_RESCUE_WITNESS'
          assert x['all_checks_pass'] is True
          assert x['content_and_blinding_classification']['blind_novelty_credit'] is False
          assert x['content_and_blinding_classification']['pdf_bytes_persisted_in_registry'] is False
          assert x['transport_receipt']['page_count']==9
          print('bounded acquisition verdict PASS')
          PY

      - name: Upload immutable receipt evidence
        uses: actions/upload-artifact@v4
        with:
          name: janus-linear-a-notti-2018-open-publisher-rescue-receipt-v0-1
          path: data/JANUS-LINEAR-A-R3B-0-NOTTI-2018-OPEN-PUBLISHER-RESCUE-ACQUISITION-RESULT-2026-08-14-v0.1.json
          if-no-files-found: error
          retention-days: 90

      - name: Persist result with concurrent-main recovery
        env:
          RESULT: data/JANUS-LINEAR-A-R3B-0-NOTTI-2018-OPEN-PUBLISHER-RESCUE-ACQUISITION-RESULT-2026-08-14-v0.1.json
        run: |
          git config user.name 'JANUS Evidence Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add "$RESULT"
          git commit -m 'Register Linear A Notti 2018 exact open-publisher acquisition receipt' || true
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "push attempt $attempt raced with main; rebasing"
            git pull --rebase origin main
          done
          echo 'unable to persist result after 5 attempts' >&2
          exit 1
