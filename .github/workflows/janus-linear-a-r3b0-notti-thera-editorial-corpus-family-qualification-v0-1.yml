name: JANUS Linear A R3B-0 Notti Thera editorial-corpus family qualification v0.1

on:
  push:
    paths:
      - 'data/JANUS-LINEAR-A-R3B-0-NOTTI-THERA-EDITORIAL-CORPUS-FAMILY-QUALIFICATION-SPEC-2026-08-14-v0.1.json'
      - 'research/linear_a/janus_linear_a_r3b0_notti_thera_editorial_corpus_family_qualification_v0_1.py'
      - '.github/workflows/janus-linear-a-r3b0-notti-thera-editorial-corpus-family-qualification-v0-1.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  qualify:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout registry
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify frozen metadata-only gate
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          p='data/JANUS-LINEAR-A-R3B-0-NOTTI-THERA-EDITORIAL-CORPUS-FAMILY-QUALIFICATION-SPEC-2026-08-14-v0.1.json'
          d=json.load(open(p,encoding='utf-8'))
          assert d['status']=='FROZEN_BEFORE_EXECUTION'
          assert d['pre_content_qualification_rules']['candidate_PDFs_may_not_be_fetched_opened_or_parsed'] is True
          assert d['important_non_equivalence']['historical_reference_theran_identity_count_is_not_candidate_exact_coverage_count'] is True
          assert d['historical_reference_identity_universe']['minimum_count_required_for_general_R3B_1_potential']==10
          PY
          python3 -m py_compile research/linear_a/janus_linear_a_r3b0_notti_thera_editorial_corpus_family_qualification_v0_1.py

      - name: Execute pre-content family qualification
        shell: bash
        run: |
          set -euo pipefail
          python3 research/linear_a/janus_linear_a_r3b0_notti_thera_editorial_corpus_family_qualification_v0_1.py \
            --out data/JANUS-LINEAR-A-R3B-0-NOTTI-THERA-EDITORIAL-CORPUS-FAMILY-QUALIFICATION-RESULT-2026-08-14-v0.1.json

      - name: Enforce content firewall and claim ceiling
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          p='data/JANUS-LINEAR-A-R3B-0-NOTTI-THERA-EDITORIAL-CORPUS-FAMILY-QUALIFICATION-RESULT-2026-08-14-v0.1.json'
          d=json.load(open(p,encoding='utf-8'))
          assert d['status'] in {
            'POTENTIAL_MULTI_DOCUMENT_AUTOPTIC_EDITORIAL_CORPUS_FAMILY_WITH_R3B1_SCALE_PENDING_EXACT_BYTES',
            'POTENTIAL_EDITORIAL_CORPUS_FAMILY_REFERENCE_SCALE_BELOW_R3B1_MINIMUM',
            'QUALIFICATION_BLOCKED_SOURCE_METADATA_UNAVAILABLE'
          }
          assert not any(d['candidate_content_firewall'].values())
          assert d['historical_reference_identity_probe']['candidate_exact_coverage_count_inferred'] is False
          assert d['R3B_effect']['candidate_actual_overlap_frozen'] is False
          assert d['R3B_effect']['exact_candidate_source_bytes_admitted'] is False
          assert d['R3B_effect']['R3B_1_admitted'] is False
          PY

      - name: Upload immutable family qualification evidence
        uses: actions/upload-artifact@v4
        with:
          name: janus-linear-a-r3b0-notti-thera-family-qualification-v0.1
          path: |
            data/JANUS-LINEAR-A-R3B-0-NOTTI-THERA-EDITORIAL-CORPUS-FAMILY-QUALIFICATION-SPEC-2026-08-14-v0.1.json
            data/JANUS-LINEAR-A-R3B-0-NOTTI-THERA-EDITORIAL-CORPUS-FAMILY-QUALIFICATION-RESULT-2026-08-14-v0.1.json
          if-no-files-found: error

      - name: Persist result with concurrent-main recovery
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'janus-proof-bot'
          git config user.email 'janus-proof-bot@users.noreply.github.com'
          git add data/JANUS-LINEAR-A-R3B-0-NOTTI-THERA-EDITORIAL-CORPUS-FAMILY-QUALIFICATION-RESULT-2026-08-14-v0.1.json
          git commit -m 'Register Linear A R3B-0 Notti Thera editorial-corpus family qualification v0.1'
          pushed=0
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then pushed=1; break; fi
            sleep "$attempt"
          done
          test "$pushed" = 1
