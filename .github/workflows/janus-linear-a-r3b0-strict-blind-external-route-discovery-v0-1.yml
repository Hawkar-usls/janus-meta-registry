name: JANUS Linear A R3B-0 strict blind external route discovery v0.1
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/janus-linear-a-r3b0-strict-blind-external-route-discovery-v0-1.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Compile metadata-only discovery runner
        run: python -m py_compile research/linear_a/janus_linear_a_r3b0_strict_blind_external_route_discovery_v0_1.py
      - name: Discover external routes without following newly discovered byte URLs
        run: |
          python research/linear_a/janus_linear_a_r3b0_strict_blind_external_route_discovery_v0_1.py \
            --spec data/JANUS-LINEAR-A-R3B-0-STRICT-BLIND-EXTERNAL-ROUTE-DISCOVERY-SPEC-2026-08-14-v0.1.json \
            --out data/JANUS-LINEAR-A-R3B-0-STRICT-BLIND-EXTERNAL-ROUTE-DISCOVERY-RESULT-2026-08-14-v0.1.json
      - name: Enforce metadata-only ceiling
        run: |
          python - <<'PY'
          import json
          p='data/JANUS-LINEAR-A-R3B-0-STRICT-BLIND-EXTERNAL-ROUTE-DISCOVERY-RESULT-2026-08-14-v0.1.json'
          x=json.load(open(p,encoding='utf-8'))
          assert x['all_checks_pass'] is True
          assert x['summary']['candidate_count']==3
          assert x['summary']['newly_discovered_routes_followed'] is False
          assert x['summary']['source_content_inspected'] is False
          assert x['summary']['source_native_sign_readings_seen'] is False
          assert x['summary']['overlap_selected'] is False
          assert x['summary']['strict_r3b_replication_established'] is False
          print(json.dumps(x['summary'],indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: janus-linear-a-r3b0-external-route-discovery-v0-1
          path: data/JANUS-LINEAR-A-R3B-0-STRICT-BLIND-EXTERNAL-ROUTE-DISCOVERY-RESULT-2026-08-14-v0.1.json
          if-no-files-found: error
      - name: Persist route discovery
        env:
          RESULT: data/JANUS-LINEAR-A-R3B-0-STRICT-BLIND-EXTERNAL-ROUTE-DISCOVERY-RESULT-2026-08-14-v0.1.json
        run: |
          git config user.name 'JANUS Evidence Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add "$RESULT"
          git commit -m 'Register Linear A strict blind external route discovery v0.1' || true
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then exit 0; fi
            git pull --rebase origin main
          done
          exit 1
