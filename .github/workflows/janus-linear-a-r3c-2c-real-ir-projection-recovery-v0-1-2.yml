name: JANUS Linear A R3C-2C real IR projection recovery transport v0.1.2

on:
  push:
    paths:
      - "data/JANUS-LINEAR-A-R3C-2C-REAL-IR-PROJECTION-RECOVERY-TRIGGER-2026-08-14-v0.1.2.json"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  recover-real-projection:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout registry
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify exact diagnostic schema and frozen technical recovery
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          d=json.load(open('data/JANUS-LINEAR-A-R3C-2C-REAL-IR-PROJECTION-DIAGNOSTIC-RESULT-2026-08-14-v0.1.json',encoding='utf-8'))
          c=json.load(open('data/JANUS-LINEAR-A-R3C-2C-RUNNER-OUTPUT-PATH-CORRECTION-2026-08-14-v0.1.1.json',encoding='utf-8'))
          f=json.load(open('data/JANUS-LINEAR-A-R3C-2C-RECOVERY-PREFLIGHT-FAILED-RUN-RECEIPT-2026-08-14-v0.1.1.json',encoding='utf-8'))
          s=json.load(open('data/JANUS-LINEAR-A-R3C-2C-REAL-IR-PROJECTION-SPEC-2026-08-14-v0.1.json',encoding='utf-8'))
          t=json.load(open('data/JANUS-LINEAR-A-R3C-2C-REAL-IR-PROJECTION-RECOVERY-TRIGGER-2026-08-14-v0.1.2.json',encoding='utf-8'))
          assert d['status']=='DIAGNOSTIC_ALL_7_WOULD_VALIDATE'
          assert d['summary']['documents_expected']==7
          assert d['summary']['documents_attempted']==7
          assert d['summary']['validation_completed_count']==7
          assert d['summary']['build_exception_count']==0
          assert d['summary']['validation_exception_count']==0
          assert d['summary']['validation_nonpass_count']==0
          assert d['summary']['projection_files_written']==0
          assert c['status']=='FROZEN_TECHNICAL_CORRECTION_ONLY'
          assert f['status']=='FAILED_BEFORE_SOURCE_CHECKOUT_AND_SCIENTIFIC_EXECUTION'
          assert f['root_cause']['scientific_runner_started'] is False
          assert s['status']=='FROZEN_BEFORE_EXECUTION' and s['scope']['documents_total']==7
          assert t['status']=='AUTHORIZED_TECHNICAL_RECOVERY_EXECUTION_TRIGGER'
          assert t['scientific_runner']=='research/linear_a/janus_linear_a_r3c_real_ir_projection_v0_1_1.py'
          assert t['frozen_projection_spec_modified'] is False
          PY

      - name: Compile cumulative stack and unchanged scientific recovery runner
        run: |
          python3 -m py_compile \
            research/linear_a/janus_linear_a_transcription_ir_v1_0.py \
            research/linear_a/janus_linear_a_transcription_ir_hardening_v1_1.py \
            research/linear_a/janus_linear_a_transcription_ir_hardening_v1_2_1.py \
            research/linear_a/janus_linear_a_r3c_real_ir_projection_v0_1.py \
            research/linear_a/janus_linear_a_r3c_real_ir_projection_v0_1_1.py

      - name: Checkout exact current source
        uses: actions/checkout@v4
        with:
          repository: mwenge/lineara.xyz
          ref: 43fe7cf1abc8e6bb1ea3228c3a1bd5938709620a
          path: external/mwenge-current
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            LinearAInscriptions.js
          sparse-checkout-cone-mode: false

      - name: Execute fresh seven-document projection
        shell: bash
        env:
          PYTHONPATH: research/linear_a
        run: |
          set -euo pipefail
          test "$(git -C external/mwenge-current rev-parse HEAD)" = "43fe7cf1abc8e6bb1ea3228c3a1bd5938709620a"
          test "$(wc -c < external/mwenge-current/LinearAInscriptions.js | tr -d ' ')" = "1609137"
          test "$(sha256sum external/mwenge-current/LinearAInscriptions.js | awk '{print $1}')" = "4da8e1f9693d30880ee505e56541fc189add70605bad88436c44a8e11a57764c"
          rm -rf data/linear_a_r3c_2c_real_ir_v0_1
          mkdir -p data/linear_a_r3c_2c_real_ir_v0_1
          rm -f data/JANUS-LINEAR-A-R3C-2C-REAL-IR-PROJECTION-RESULT-2026-08-14-v0.1.json
          python3 research/linear_a/janus_linear_a_r3c_real_ir_projection_v0_1_1.py \
            --source external/mwenge-current/LinearAInscriptions.js \
            --output-dir data/linear_a_r3c_2c_real_ir_v0_1 \
            --result data/JANUS-LINEAR-A-R3C-2C-REAL-IR-PROJECTION-RESULT-2026-08-14-v0.1.json

      - name: Enforce seven-of-seven and fail-closed claim ceiling
        shell: bash
        env:
          PYTHONPATH: research/linear_a
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import janus_linear_a_transcription_ir_v1_0 as base
          d=json.load(open('data/JANUS-LINEAR-A-R3C-2C-REAL-IR-PROJECTION-RESULT-2026-08-14-v0.1.json',encoding='utf-8'))
          assert d['status']=='REAL_7_DOCUMENT_PROJECTION_PASS'
          assert d['summary']['documents_projected']==7
          assert d['summary']['projection_pass_count']==7
          assert d['summary']['D5_pass']==4 and d['summary']['D6_pass']==3
          assert d['summary']['all_ir_hashes_present'] is True
          assert d['summary']['all_ir_hashes_unique'] is True
          assert d['summary']['source_groups_destructively_merged'] is False
          assert d['summary']['D5_boundary_kind_promoted'] is False
          assert d['summary']['D6_semantic_authority_granted'] is False
          assert d['claim_ceiling']['D5_boundary_kind_resolved'] is False
          assert d['claim_ceiling']['D6_A319_semantics_assigned'] is False
          assert d['claim_ceiling']['new_anchor'] is False
          assert d['claim_ceiling']['decipherment'] is False
          assert d['recovery']['scientific_projection_template_modified'] is False
          assert d['recovery']['validator_semantics_modified'] is False
          for out in d['outputs']:
              ir=json.load(open(out['path'],encoding='utf-8'))
              assert ir['provenance_receipt']['ir_sha256']==out['ir_sha256']
              assert base.validate_ir(ir,require_hash=True)==[]
          PY

      - name: Upload immutable seven-document package
        uses: actions/upload-artifact@v4
        with:
          name: janus-linear-a-r3c-2c-real-ir-projection-recovery-v0.1.2
          path: |
            data/JANUS-LINEAR-A-R3C-2C-REAL-IR-PROJECTION-RESULT-2026-08-14-v0.1.json
            data/linear_a_r3c_2c_real_ir_v0_1/*.json
          if-no-files-found: error
          retention-days: 90

      - name: Persist seven-document result with concurrent-main recovery
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "janus-proof-bot"
          git config user.email "janus-proof-bot@users.noreply.github.com"
          git add data/JANUS-LINEAR-A-R3C-2C-REAL-IR-PROJECTION-RESULT-2026-08-14-v0.1.json data/linear_a_r3c_2c_real_ir_v0_1
          git commit -m "Admit Linear A seven-document real IR projection v0.1 via recovery transport v0.1.2"
          pushed=0
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then pushed=1; break; fi
            sleep "$attempt"
          done
          test "$pushed" = 1
