name: JANUS Linear A R3C JS payload diagnostic v0.1

on:
  push:
    paths:
      - ".github/workflows/janus-linear-a-r3c-js-payload-diagnostic-v0-1.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnose-first-json-break:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout registry
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compile diagnostic
        run: python3 -m py_compile research/linear_a/janus_linear_a_r3c_js_payload_diagnostic_v0_1.py

      - name: Checkout exact historical source
        uses: actions/checkout@v4
        with:
          repository: mwenge/lineara.xyz
          ref: 568f452c7a5ec80fa292cb307ead2fc6f65d07fb
          path: external/mwenge-historical
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            LinearAInscriptions.js
          sparse-checkout-cone-mode: false

      - name: Verify historical bytes and diagnose without executing JavaScript
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C external/mwenge-historical rev-parse HEAD)" = "568f452c7a5ec80fa292cb307ead2fc6f65d07fb"
          test "$(wc -c < external/mwenge-historical/LinearAInscriptions.js | tr -d ' ')" = "1609122"
          test "$(sha256sum external/mwenge-historical/LinearAInscriptions.js | awk '{print $1}')" = "b7b383b93db55b504eb00c552a8b18c19a588e83bba7ff0ab93ca32277d8bfe2"
          python3 research/linear_a/janus_linear_a_r3c_js_payload_diagnostic_v0_1.py \
            --source external/mwenge-historical/LinearAInscriptions.js \
            --output data/JANUS-LINEAR-A-R3C-1A-JS-PAYLOAD-DIAGNOSTIC-RESULT-2026-08-14-v0.1.json

      - name: Enforce diagnostic-only claim ceiling
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          p='data/JANUS-LINEAR-A-R3C-1A-JS-PAYLOAD-DIAGNOSTIC-RESULT-2026-08-14-v0.1.json'
          d=json.load(open(p,encoding='utf-8'))
          assert d['source']['bytes']==1609122
          assert d['source']['sha256']=='b7b383b93db55b504eb00c552a8b18c19a588e83bba7ff0ab93ca32277d8bfe2'
          assert d['safety']['javascript_executed'] is False
          assert d['safety']['eval_used'] is False
          assert d['claim_ceiling']['scientific_metrics_computed'] is False
          assert d['status']=='FIRST_JSON_SYNTAX_BREAK_LOCALIZED'
          PY

      - name: Upload diagnostic artifact
        uses: actions/upload-artifact@v4
        with:
          name: janus-linear-a-r3c-js-payload-diagnostic-v0.1
          path: data/JANUS-LINEAR-A-R3C-1A-JS-PAYLOAD-DIAGNOSTIC-RESULT-2026-08-14-v0.1.json
          if-no-files-found: error
          retention-days: 90

      - name: Persist diagnostic with concurrent-main recovery
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "janus-proof-bot"
          git config user.email "janus-proof-bot@users.noreply.github.com"
          git add data/JANUS-LINEAR-A-R3C-1A-JS-PAYLOAD-DIAGNOSTIC-RESULT-2026-08-14-v0.1.json
          git commit -m "Register Linear A R3C JS payload diagnostic v0.1"
          pushed=0
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              pushed=1
              break
            fi
            sleep "$attempt"
          done
          test "$pushed" = 1
