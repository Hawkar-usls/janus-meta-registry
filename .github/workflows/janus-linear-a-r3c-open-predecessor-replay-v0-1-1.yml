name: JANUS Linear A R3C clean science recovery v0.1.1

on:
  push:
    paths:
      - ".github/workflows/janus-linear-a-r3c-open-predecessor-replay-v0-1-1.yml"
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  clean-r3c-science-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      HISTORICAL_COMMIT: "568f452c7a5ec80fa292cb307ead2fc6f65d07fb"
      HISTORICAL_BYTES: "1609122"
      HISTORICAL_SHA256: "b7b383b93db55b504eb00c552a8b18c19a588e83bba7ff0ab93ca32277d8bfe2"
      CURRENT_COMMIT: "43fe7cf1abc8e6bb1ea3228c3a1bd5938709620a"
      CURRENT_BYTES: "1609137"
      CURRENT_SHA256: "4da8e1f9693d30880ee505e56541fc189add70605bad88436c44a8e11a57764c"
      SCIENCE_ARTIFACT_NAME: "janus-linear-a-r3c-clean-science-v0.1.1"

    steps:
      - name: Checkout registry
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compile frozen science and admitted parser stack
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile \
            research/linear_a/janus_linear_a_r3c_common_v0_1.py \
            research/linear_a/janus_linear_a_r3c_source_loader_v0_3.py \
            research/linear_a/janus_linear_a_r3c_source_loader_v0_4.py \
            research/linear_a/janus_linear_a_r3c_briakos_reproduction_v0_1.py \
            research/linear_a/janus_linear_a_r3c_briakos_reproduction_v0_1_1.py \
            research/linear_a/janus_linear_a_r3c_logos_defect_replay_v0_1.py \
            research/linear_a/janus_linear_a_r3c_logos_defect_replay_v0_1_1.py

      - name: Verify clean-recovery freeze and parser admission
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          s=json.load(open('data/JANUS-LINEAR-A-R3C-CLEAN-RECOVERY-EXECUTION-SPEC-2026-08-14-v0.1.1.json',encoding='utf-8'))
          p=json.load(open('data/JANUS-LINEAR-A-R3C-1A-JS-MAP-SEMANTICS-PARSER-VALIDATION-RESULT-2026-08-14-v0.4.json',encoding='utf-8'))
          assert s['status']=='FROZEN_BEFORE_CLEAN_SCIENTIFIC_RECOVERY'
          assert s['failed_predecessor_run']['scientific_result_may_be_reused'] is False
          assert s['anti_tuning']['posthoc_document_subset_selection'] is False
          assert s['scientific_leg_R3C_1_Briakos']['all_three_frozen_profiles_must_be_reported'] is True
          assert p['status']=='PARSER_V0_4_ADMITTED'
          assert p['execution_firewall']['scientific_recovery_run_allowed'] is True
          assert p['execution_firewall']['scientific_metrics_computed'] is False
          PY

      - name: Checkout exact Briakos historical source
        uses: actions/checkout@v4
        with:
          repository: mwenge/lineara.xyz
          ref: 568f452c7a5ec80fa292cb307ead2fc6f65d07fb
          path: external/mwenge-historical
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            LinearAInscriptions.js
          sparse-checkout-cone-mode: false

      - name: Checkout exact current JANUS frozen source
        uses: actions/checkout@v4
        with:
          repository: mwenge/lineara.xyz
          ref: 43fe7cf1abc8e6bb1ea3228c3a1bd5938709620a
          path: external/mwenge-current
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            LinearAInscriptions.js
          sparse-checkout-cone-mode: false

      - name: Re-prove exact source identities in clean run
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C external/mwenge-historical rev-parse HEAD)" = "$HISTORICAL_COMMIT"
          test "$(wc -c < external/mwenge-historical/LinearAInscriptions.js | tr -d ' ')" = "$HISTORICAL_BYTES"
          test "$(sha256sum external/mwenge-historical/LinearAInscriptions.js | awk '{print $1}')" = "$HISTORICAL_SHA256"
          test "$(git -C external/mwenge-current rev-parse HEAD)" = "$CURRENT_COMMIT"
          test "$(wc -c < external/mwenge-current/LinearAInscriptions.js | tr -d ' ')" = "$CURRENT_BYTES"
          test "$(sha256sum external/mwenge-current/LinearAInscriptions.js | awk '{print $1}')" = "$CURRENT_SHA256"
          python3 - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          def rec(path,commit,expected_bytes,expected_sha):
              b=Path(path).read_bytes(); h=hashlib.sha256(b).hexdigest()
              return {'path':path,'commit':commit,'bytes':len(b),'sha256':h,'byte_match':len(b)==int(expected_bytes),'sha256_match':h==expected_sha}
          h=rec('external/mwenge-historical/LinearAInscriptions.js',os.environ['HISTORICAL_COMMIT'],os.environ['HISTORICAL_BYTES'],os.environ['HISTORICAL_SHA256'])
          c=rec('external/mwenge-current/LinearAInscriptions.js',os.environ['CURRENT_COMMIT'],os.environ['CURRENT_BYTES'],os.environ['CURRENT_SHA256'])
          assert h['byte_match'] and h['sha256_match'] and c['byte_match'] and c['sha256_match']
          out={
            'artifact_uuid':'JANUS-LINEAR-A-R3C-CLEAN-SOURCE-IDENTITY-RECEIPT-2026-08-14-v0.1.1',
            'version':'v0.1.1','node_type':'clean_recovery_source_identity_receipt','status':'EXACT_SOURCE_IDENTITIES_REPROVED_IN_CLEAN_RUN',
            'historical':h,'current':c,
            'failed_run_scientific_result_reused':False,
            'claim_ceiling':{'source_identity_only':True,'R3B_effect':'NONE','independent_transcription_replication':False,'new_anchor':False,'decipherment':False}
          }
          Path('data/JANUS-LINEAR-A-R3C-CLEAN-SOURCE-IDENTITY-RECEIPT-2026-08-14-v0.1.1.json').write_text(json.dumps(out,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY

      - name: Execute frozen Briakos scientific replay from source bytes
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=research/linear_a python3 research/linear_a/janus_linear_a_r3c_briakos_reproduction_v0_1_1.py \
            --historical external/mwenge-historical/LinearAInscriptions.js \
            --current external/mwenge-current/LinearAInscriptions.js \
            --output data/JANUS-LINEAR-A-R3C-1-BRIAKOS-REPRODUCTION-RESULT-2026-08-14-v0.1.1.json

      - name: Execute frozen logos D5 D6 conformance replay from source bytes
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=research/linear_a python3 research/linear_a/janus_linear_a_r3c_logos_defect_replay_v0_1_1.py \
            --source external/mwenge-current/LinearAInscriptions.js \
            --output data/JANUS-LINEAR-A-R3C-2-LOGOS-DEFECT-CONFORMANCE-RESULT-2026-08-14-v0.1.1.json

      - name: Validate clean-run scientific invariants
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          b=json.load(open('data/JANUS-LINEAR-A-R3C-1-BRIAKOS-REPRODUCTION-RESULT-2026-08-14-v0.1.1.json',encoding='utf-8'))
          l=json.load(open('data/JANUS-LINEAR-A-R3C-2-LOGOS-DEFECT-CONFORMANCE-RESULT-2026-08-14-v0.1.1.json',encoding='utf-8'))
          assert b['version']=='v0.1.1'
          assert b['recovery_lineage']['source_loader_id']=='JANUS-LINEAR-A-R3C-SOURCE-LOADER-v0.4'
          assert b['recovery_lineage']['scientific_method_changed_after_failed_run'] is False
          assert b['recovery_lineage']['scientific_results_reused_from_failed_run'] is False
          assert b['summary']['all_frozen_profiles_reported'] is True
          assert b['summary']['published_values_used_for_profile_selection'] is False
          assert set(b['historical']['profiles'])=={'THESIS_LITERAL_ALPHA_v0.1','PLUS_BASE_AMBIGUITY_v0.1','EXCLUDE_PLUS_AMBIGUITY_v0.1'}
          assert b['historical']['source']['sha256']=='b7b383b93db55b504eb00c552a8b18c19a588e83bba7ff0ab93ca32277d8bfe2'
          assert b['historical']['source']['loader_id']=='JANUS-LINEAR-A-R3C-SOURCE-LOADER-v0.4'
          assert b['claim_ceiling']['R3B_effect']=='NONE'
          assert b['claim_ceiling']['independent_transcription_replication'] is False
          assert l['version']=='v0.1.1'
          assert l['recovery_lineage']['source_loader_id']=='JANUS-LINEAR-A-R3C-SOURCE-LOADER-v0.4'
          assert l['recovery_lineage']['scientific_results_reused_from_failed_run'] is False
          assert l['external_prior_art']['JANUS_blind_discovery_credit'] is False
          assert l['claim_ceiling']['R3B_effect']=='NONE'
          assert l['claim_ceiling']['new_anchor'] is False
          assert l['claim_ceiling']['decipherment'] is False
          print(json.dumps({'briakos_status':b['status'],'briakos_summary':b['summary'],'logos_status':l['status'],'D5':l['D5']['confirmed_case_count'],'D6_docs':l['D6']['seeded_documents_with_copresence']},sort_keys=True))
          PY

      - name: Build clean scientific execution receipt
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          b_path='data/JANUS-LINEAR-A-R3C-1-BRIAKOS-REPRODUCTION-RESULT-2026-08-14-v0.1.1.json'
          l_path='data/JANUS-LINEAR-A-R3C-2-LOGOS-DEFECT-CONFORMANCE-RESULT-2026-08-14-v0.1.1.json'
          s_path='data/JANUS-LINEAR-A-R3C-CLEAN-SOURCE-IDENTITY-RECEIPT-2026-08-14-v0.1.1.json'
          b=json.load(open(b_path,encoding='utf-8')); l=json.load(open(l_path,encoding='utf-8'))
          out={
            'artifact_uuid':'JANUS-LINEAR-A-R3C-CLEAN-SCIENCE-EXECUTION-RECEIPT-2026-08-14-v0.1.1',
            'version':'v0.1.1','node_type':'workflow_execution_receipt','status':'CLEAN_SCIENCE_EXECUTED_PENDING_ARTIFACT_BINDING',
            'workflow':{'repository':os.environ.get('GITHUB_REPOSITORY'),'run_id':int(os.environ['GITHUB_RUN_ID']),'run_attempt':int(os.environ['GITHUB_RUN_ATTEMPT']),'head_sha':os.environ.get('GITHUB_SHA')},
            'freeze_spec':'data/JANUS-LINEAR-A-R3C-CLEAN-RECOVERY-EXECUTION-SPEC-2026-08-14-v0.1.1.json',
            'parser_admission':'data/JANUS-LINEAR-A-R3C-1A-JS-MAP-SEMANTICS-PARSER-VALIDATION-RESULT-2026-08-14-v0.4.json',
            'failed_predecessor_run':31800907720,
            'scientific_results_reused_from_failed_run':False,
            'source_identity_receipt':s_path,
            'results':{
              'briakos':{'path':b_path,'status':b['status']},
              'logos':{'path':l_path,'status':l['status']}
            },
            'claim_ceiling':{'R3B_effect':'NONE','independent_transcription_replication':False,'new_anchor':False,'decipherment':False}
          }
          Path('data/JANUS-LINEAR-A-R3C-CLEAN-SCIENCE-EXECUTION-RECEIPT-2026-08-14-v0.1.1.json').write_text(json.dumps(out,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY

      - name: Upload immutable clean scientific outputs before persistence
        uses: actions/upload-artifact@v4
        with:
          name: janus-linear-a-r3c-clean-science-v0.1.1
          path: |
            data/JANUS-LINEAR-A-R3C-CLEAN-SOURCE-IDENTITY-RECEIPT-2026-08-14-v0.1.1.json
            data/JANUS-LINEAR-A-R3C-1-BRIAKOS-REPRODUCTION-RESULT-2026-08-14-v0.1.1.json
            data/JANUS-LINEAR-A-R3C-2-LOGOS-DEFECT-CONFORMANCE-RESULT-2026-08-14-v0.1.1.json
            data/JANUS-LINEAR-A-R3C-CLEAN-SCIENCE-EXECUTION-RECEIPT-2026-08-14-v0.1.1.json
          if-no-files-found: error
          retention-days: 90

      - name: Bind receipt to immutable scientific artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -fsSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts" > /tmp/r3c-artifacts.json
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          meta=json.load(open('/tmp/r3c-artifacts.json',encoding='utf-8'))
          matches=[a for a in meta.get('artifacts',[]) if a.get('name')==os.environ['SCIENCE_ARTIFACT_NAME']]
          assert len(matches)==1,matches
          a=matches[0]
          p=Path('data/JANUS-LINEAR-A-R3C-CLEAN-SCIENCE-EXECUTION-RECEIPT-2026-08-14-v0.1.1.json')
          d=json.loads(p.read_text(encoding='utf-8'))
          d['status']='CLEAN_SCIENCE_EXECUTED_AND_ARTIFACT_BOUND'
          d['scientific_artifact']={'id':a['id'],'name':a['name'],'digest':a.get('digest'),'size_in_bytes':a.get('size_in_bytes'),'expired':a.get('expired')}
          p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY

      - name: Persist clean science with concurrent-main recovery
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "janus-proof-bot"
          git config user.email "janus-proof-bot@users.noreply.github.com"
          git add \
            data/JANUS-LINEAR-A-R3C-CLEAN-SOURCE-IDENTITY-RECEIPT-2026-08-14-v0.1.1.json \
            data/JANUS-LINEAR-A-R3C-1-BRIAKOS-REPRODUCTION-RESULT-2026-08-14-v0.1.1.json \
            data/JANUS-LINEAR-A-R3C-2-LOGOS-DEFECT-CONFORMANCE-RESULT-2026-08-14-v0.1.1.json \
            data/JANUS-LINEAR-A-R3C-CLEAN-SCIENCE-EXECUTION-RECEIPT-2026-08-14-v0.1.1.json
          git commit -m "Register Linear A R3C clean science recovery v0.1.1"
          pushed=0
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              pushed=1
              break
            fi
            sleep "$attempt"
          done
          test "$pushed" = 1
