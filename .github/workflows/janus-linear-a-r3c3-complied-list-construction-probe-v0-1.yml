name: JANUS Linear A R3C-3 complied_list construction probe v0.1
on:
  push:
    paths:
      - ".github/workflows/janus-linear-a-r3c3-complied-list-construction-probe-v0-1.yml"
      - "research/linear_a/janus_linear_a_r3c3_complied_list_construction_probe_v0_1.py"
      - "data/JANUS-LINEAR-A-R3C-3-COMPLIED-LIST-CONSTRUCTION-PROBE-SPEC-2026-08-14-v0.1.json"
  workflow_dispatch:
permissions: {contents: write}
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Verify freeze and compile
        shell: bash
        env: {PYTHONPATH: research/linear_a}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          s=json.load(open('data/JANUS-LINEAR-A-R3C-3-COMPLIED-LIST-CONSTRUCTION-PROBE-SPEC-2026-08-14-v0.1.json',encoding='utf-8'))
          p=json.load(open('data/JANUS-LINEAR-A-R3C-3-HISTORICAL-BINDING-PROBE-RESULT-2026-08-14-v0.1.json',encoding='utf-8'))
          assert s['status']=='FROZEN_BEFORE_EXECUTION'; assert p['status']==s['required_parent_status']; assert s['module_line_range']==[130,165]
          PY
          python3 -m py_compile research/linear_a/janus_linear_a_r3c3_complied_list_construction_probe_v0_1.py
      - name: Reacquire exact historical bundle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p external/r3c3-historical-mac
          OUT='external/r3c3-historical-mac/LinearADecipherment(Mac).zip'
          curl --fail --location --retry 4 --retry-all-errors --connect-timeout 20 --max-time 180 'https://raw.githubusercontent.com/L-Colin/Linear-A-decipherment-programme/fab66e715b18607c4b383782e7f4d1b86a26d725/LinearADecipherment(Mac).zip' --output "$OUT"
          test "$(git hash-object "$OUT")" = 'b58e8a3043911f6de921be39bbf516755839829f'; test "$(sha256sum "$OUT" | awk '{print $1}')" = 'a4627d4c2e26668593e8f6f9c8a004ae75bb3f1bbf497a39c0d4a772c9012850'
      - name: Execute fixed-range static probe
        shell: bash
        env: {PYTHONPATH: research/linear_a}
        run: |
          python3 research/linear_a/janus_linear_a_r3c3_complied_list_construction_probe_v0_1.py 'external/r3c3-historical-mac/LinearADecipherment(Mac).zip' --out 'data/JANUS-LINEAR-A-R3C-3-COMPLIED-LIST-CONSTRUCTION-PROBE-RESULT-2026-08-14-v0.1.json'
      - name: Enforce result
        run: |
          python3 - <<'PY'
          import json
          d=json.load(open('data/JANUS-LINEAR-A-R3C-3-COMPLIED-LIST-CONSTRUCTION-PROBE-RESULT-2026-08-14-v0.1.json',encoding='utf-8'))
          assert d['status']=='COMPLIED_LIST_CONSTRUCTION_SLICE_MACHINE_REPRESENTED'; assert d['unsupported_ast_types']==[]; assert d['safety']['source_executed'] is False
          PY
      - uses: actions/upload-artifact@v4
        with: {name: janus-linear-a-r3c3-complied-list-probe-v0.1, path: data/JANUS-LINEAR-A-R3C-3-COMPLIED-LIST-CONSTRUCTION-PROBE-RESULT-2026-08-14-v0.1.json, if-no-files-found: error}
      - name: Persist
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'janus-proof-bot'; git config user.email 'janus-proof-bot@users.noreply.github.com'
          git add data/JANUS-LINEAR-A-R3C-3-COMPLIED-LIST-CONSTRUCTION-PROBE-RESULT-2026-08-14-v0.1.json; git commit -m 'Register Linear A R3C-3 complied_list construction probe v0.1'
          pushed=0; for attempt in 1 2 3 4 5; do git fetch origin main; git rebase origin/main; if git push origin HEAD:main; then pushed=1; break; fi; sleep "$attempt"; done; test "$pushed" = 1
