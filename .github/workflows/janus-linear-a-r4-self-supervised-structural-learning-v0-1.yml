name: JANUS Linear A R4-0 self-supervised structural learning v0.1

on:
  push:
    paths:
      - "data/JANUS-LINEAR-A-R4-0-EXECUTE-REQUEST-2026-08-14-v0.1.json"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  learn:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout JANUS registry
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install numeric dependency
        run: python -m pip install --disable-pip-version-check "numpy>=2.0"

      - name: Verify frozen spec and pre-execution corrective lineage
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object research/linear_a/janus_linear_a_r4_self_supervised_structural_learning_v0_1.py)" = "ac03917dc0668c1e8794ea246d9dc5e20cf061a1"
          python -m py_compile research/linear_a/janus_linear_a_r4_self_supervised_structural_learning_v0_1.py
          python -m py_compile research/linear_a/janus_linear_a_r4_self_supervised_structural_learning_v0_1_1.py
          python - <<'PY'
          import json
          p='data/JANUS-LINEAR-A-R4-0-SELF-SUPERVISED-STRUCTURAL-LEARNING-SPEC-2026-08-14-v0.1.json'
          s=json.load(open(p,encoding='utf-8'))
          assert s['source']['frozen_commit']=='43fe7cf1abc8e6bb1ea3228c3a1bd5938709620a'
          assert s['partition']['selection_from_test_forbidden'] is True
          assert s['source']['translations_used'] is False
          assert s['leakage_firewall']['Notti_2021_2025_PH13_content_used'] is False
          PY

      - name: Fetch exact preservation-mirror corpus
        shell: bash
        run: |
          set -euo pipefail
          git clone --quiet https://github.com/Hawkar-usls/lineara.xyz.git /tmp/lineara
          git -C /tmp/lineara checkout --quiet 43fe7cf1abc8e6bb1ea3228c3a1bd5938709620a
          test "$(git -C /tmp/lineara rev-parse HEAD)" = "43fe7cf1abc8e6bb1ea3228c3a1bd5938709620a"
          test "$(find /tmp/lineara/items -maxdepth 1 -name '*.html' | wc -l)" -ge 300

      - name: Train opaque distributional model and score held-out test documents
        env:
          PYTHONPATH: research/linear_a
        shell: bash
        run: |
          set -euo pipefail
          python research/linear_a/janus_linear_a_r4_self_supervised_structural_learning_v0_1_1.py \
            --corpus /tmp/lineara \
            --spec data/JANUS-LINEAR-A-R4-0-SELF-SUPERVISED-STRUCTURAL-LEARNING-SPEC-2026-08-14-v0.1.json \
            --out data/JANUS-LINEAR-A-R4-0-SELF-SUPERVISED-STRUCTURAL-LEARNING-RESULT-2026-08-14-v0.1.1.json

      - name: Enforce leakage firewall and claim ceiling
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          p='data/JANUS-LINEAR-A-R4-0-SELF-SUPERVISED-STRUCTURAL-LEARNING-RESULT-2026-08-14-v0.1.1.json'
          x=json.load(open(p,encoding='utf-8'))
          assert x['status'] in {
              'SELF_SUPERVISED_INTERNAL_STRUCTURE_SIGNAL_PRESENT',
              'SELF_SUPERVISED_INTERNAL_STRUCTURE_SIGNAL_NOT_ESTABLISHED',
              'BLOCKED_INSUFFICIENT_EVALUABLE_TEST_MASKS'
          }
          assert x['source']['frozen_commit']=='43fe7cf1abc8e6bb1ea3228c3a1bd5938709620a'
          assert x['source']['parsed_documents'] >= 300
          assert all(x['split_counts'][k] > 0 for k in ('TRAIN','DEV','TEST'))
          assert x['training']['raw_labels_available_to_training'] is False
          assert x['training']['translations_used'] is False
          assert x['training']['language_dictionaries_used'] is False
          assert x['training']['external_semantic_supervision_used'] is False
          assert x['leakage_firewall']['test_used_for_model_selection'] is False
          assert x['leakage_firewall']['Notti_2021_2025_PH13_content_used'] is False
          assert x['leakage_firewall']['Notti_2018_readings_used'] is False
          assert x['leakage_firewall']['R3B_blind_eligibility_affected'] is False
          assert x['epistemic_gate']['translation_established'] is False
          assert x['epistemic_gate']['phonetic_value_established'] is False
          assert x['epistemic_gate']['new_anchor_established'] is False
          assert x['epistemic_gate']['decipherment_established'] is False
          assert x['epistemic_gate']['R3B_external_replication_established'] is False
          print(json.dumps({
              'status':x['status'],
              'split_counts':x['split_counts'],
              'vocab':x['training']['candidate_vocabulary_size'],
              'evaluable_test_masks':x['heldout_masked_prediction']['evaluable_test_masks'],
              'metrics':x['heldout_masked_prediction']['metrics'],
              'replicated_pairs':x['structural_analogy_probe']['test_replicated_pairs']
          },sort_keys=True))
          PY

      - name: Upload R4-0 result
        uses: actions/upload-artifact@v4
        with:
          name: janus-linear-a-r4-self-supervised-v0-1-1
          path: data/JANUS-LINEAR-A-R4-0-SELF-SUPERVISED-STRUCTURAL-LEARNING-RESULT-2026-08-14-v0.1.1.json
          if-no-files-found: error
          retention-days: 90

      - name: Persist R4-0 result with concurrent-main recovery
        shell: bash
        run: |
          set -euo pipefail
          RESULT=data/JANUS-LINEAR-A-R4-0-SELF-SUPERVISED-STRUCTURAL-LEARNING-RESULT-2026-08-14-v0.1.1.json
          git config user.name 'JANUS Evidence Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add "$RESULT"
          git commit -m 'Register Linear A R4-0 self-supervised structural learning result v0.1.1' || true
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then exit 0; fi
            git pull --rebase origin main
          done
          exit 1
