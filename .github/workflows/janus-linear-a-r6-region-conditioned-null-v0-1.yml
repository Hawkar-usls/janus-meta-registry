name: JANUS Linear A R6-1 region-conditioned null audit v0.1
on:
  push:
    paths:
      - "data/JANUS-LINEAR-A-R6-1-EXECUTE-REQUEST-2026-08-14-v0.1.json"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  audit_region:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --disable-pip-version-check "numpy>=2.0"
      - name: Verify frozen corrective family
        run: |
          python -m py_compile research/linear_a/janus_linear_a_r6_region_conditioned_null_v0_1.py
          python - <<'PY'
          import json
          s=json.load(open('data/JANUS-LINEAR-A-R6-1-REGION-CONDITIONED-NULL-AUDIT-SPEC-2026-08-14-v0.1.json',encoding='utf-8'))
          p=json.load(open('data/JANUS-LINEAR-A-R6-0-CROSS-FITTED-NUMERIC-ADJACENCY-ROLE-RESULT-2026-08-14-v0.1.json',encoding='utf-8'))
          c=json.load(open('data/JANUS-LINEAR-A-RESEARCH-STATE-2026-08-14-v2.22.json',encoding='utf-8'))
          assert c['version']=='v2.22' and c['status']=='CURRENT_CANONICAL_RESEARCH_STATE'
          assert p['cross_fitted_candidate_family_size']==2 and p['admitted_role_candidate_count']==0
          assert s['candidate_family']['expected_count']==2
          assert s['candidate_family']['candidate_addition_forbidden'] is True
          assert s['candidate_family']['candidate_removal_forbidden'] is True
          assert s['posthoc_status']=='EXPLICIT_CORRECTIVE_CONFOUND_AUDIT_NO_BLIND_CONFIRMATION_CREDIT'
          PY
      - name: Fetch exact corpus
        run: |
          git clone --quiet https://github.com/Hawkar-usls/lineara.xyz.git /tmp/lineara
          git -C /tmp/lineara checkout --quiet 43fe7cf1abc8e6bb1ea3228c3a1bd5938709620a
          test "$(git -C /tmp/lineara rev-parse HEAD)" = "43fe7cf1abc8e6bb1ea3228c3a1bd5938709620a"
      - name: Execute region-conditioned corrective audit
        env:
          PYTHONPATH: research/linear_a
        run: |
          python research/linear_a/janus_linear_a_r6_region_conditioned_null_v0_1.py \
            --corpus /tmp/lineara \
            --spec data/JANUS-LINEAR-A-R6-1-REGION-CONDITIONED-NULL-AUDIT-SPEC-2026-08-14-v0.1.json \
            --parent data/JANUS-LINEAR-A-R6-0-CROSS-FITTED-NUMERIC-ADJACENCY-ROLE-RESULT-2026-08-14-v0.1.json \
            --out data/JANUS-LINEAR-A-R6-1-REGION-CONDITIONED-NULL-AUDIT-RESULT-2026-08-14-v0.1.json
      - name: Enforce post-hoc ceiling
        run: |
          python - <<'PY'
          import json
          x=json.load(open('data/JANUS-LINEAR-A-R6-1-REGION-CONDITIONED-NULL-AUDIT-RESULT-2026-08-14-v0.1.json',encoding='utf-8'))
          assert x['status'] in {'POSTHOC_REGION_CONDITIONED_PATTERN_SURVIVES','POSTHOC_REGION_CONDITIONED_PATTERN_NOT_ROBUST'}
          assert x['candidate_family_size']==2 and len(x['candidate_results'])==2
          assert x['leakage_and_credit']['candidate_family_changed'] is False
          assert x['leakage_and_credit']['parent_heldout_n_or_hits_changed'] is False
          assert x['leakage_and_credit']['word_labels_used_for_statistical_scoring'] is False
          assert x['leakage_and_credit']['blind_confirmation_credit'] is False
          assert x['epistemic_gate']['meaning_established'] is False
          assert x['epistemic_gate']['decipherment_established'] is False
          print(json.dumps({'status':x['status'],'survivor_count':x['survivor_count']},sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: janus-linear-a-r6-region-null-v0-1
          path: data/JANUS-LINEAR-A-R6-1-REGION-CONDITIONED-NULL-AUDIT-RESULT-2026-08-14-v0.1.json
          if-no-files-found: error
      - name: Persist R6-1 result
        run: |
          git config user.name 'JANUS Evidence Bot'; git config user.email 'actions@users.noreply.github.com'
          git add data/JANUS-LINEAR-A-R6-1-REGION-CONDITIONED-NULL-AUDIT-RESULT-2026-08-14-v0.1.json
          git commit -m 'Register Linear A R6-1 region-conditioned null audit v0.1' || true
          for attempt in 1 2 3 4 5; do if git push origin HEAD:main; then exit 0; fi; git pull --rebase origin main; done; exit 1
