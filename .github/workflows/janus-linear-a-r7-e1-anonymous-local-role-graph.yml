name: JANUS Linear A R7-E1 anonymous local-role graph

on:
  pull_request:
    paths:
      - 'data/JANUS-LINEAR-A-R7-E1-ANONYMOUS-LOCAL-ROLE-GRAPH-SPEC-2026-08-15-v0.1.json'
      - 'research/linear_a/janus_linear_a_r7_e1_anonymous_local_role_graph_v0_1.py'
      - 'research/linear_a/test_janus_linear_a_r7_e1_anonymous_local_role_graph_v0_1.py'
      - '.github/workflows/janus-linear-a-r7-e1-anonymous-local-role-graph.yml'
  push:
    branches:
      - 'research/r7-e1-anonymous-local-role-graph'
    paths:
      - 'data/JANUS-LINEAR-A-R7-E1-ANONYMOUS-LOCAL-ROLE-GRAPH-SPEC-2026-08-15-v0.1.json'
      - 'research/linear_a/janus_linear_a_r7_e1_anonymous_local_role_graph_v0_1.py'
      - 'research/linear_a/test_janus_linear_a_r7_e1_anonymous_local_role_graph_v0_1.py'
      - '.github/workflows/janus-linear-a-r7-e1-anonymous-local-role-graph.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preregistration-and-canaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install inherited parser dependency
        run: python -m pip install "numpy>=2.0"
      - name: Compile
        run: |
          python -m py_compile \
            research/linear_a/janus_linear_a_r7_e1_anonymous_local_role_graph_v0_1.py \
            research/linear_a/test_janus_linear_a_r7_e1_anonymous_local_role_graph_v0_1.py
      - name: Validate frozen R7-E1 preregistration
        env:
          PYTHONPATH: research/linear_a
        run: |
          python research/linear_a/janus_linear_a_r7_e1_anonymous_local_role_graph_v0_1.py \
            --spec data/JANUS-LINEAR-A-R7-E1-ANONYMOUS-LOCAL-ROLE-GRAPH-SPEC-2026-08-15-v0.1.json \
            --validate-spec \
            --out r7-e1-preregistration-validation.json
          cat r7-e1-preregistration-validation.json
      - name: Run split, discovery, holdout, and claim-ceiling canaries
        env:
          PYTHONPATH: research/linear_a
        run: |
          python research/linear_a/test_janus_linear_a_r7_e1_anonymous_local_role_graph_v0_1.py -v
      - name: Static leakage canary
        run: |
          python - <<'PY'
          import json
          p='data/JANUS-LINEAR-A-R7-E1-ANONYMOUS-LOCAL-ROLE-GRAPH-SPEC-2026-08-15-v0.1.json'
          s=json.load(open(p,encoding='utf-8'))
          assert all(s['feature_firewall'].values())
          assert s['physical_object_split']['discovery_must_not_parse_holdout_document_content'] is True
          assert s['discovery_selection']['manual_atom_addition_forbidden'] is True
          assert s['discovery_selection']['manual_atom_removal_forbidden'] is True
          assert s['decision']['pass_does_not_assign_semantic_function_label'] is True
          print('R7_E1_STATIC_LEAKAGE_CANARY_PASS')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: janus-linear-a-r7-e1-preregistration-validation
          path: r7-e1-preregistration-validation.json
          if-no-files-found: error
