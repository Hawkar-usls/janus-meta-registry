name: JANUS Linear A R7-F0 frozen downstream execution

on:
  push:
    branches:
      - 'research/r7-f0-ku-ro-downstream-slot'
    paths:
      - 'data/JANUS-LINEAR-A-R7-F0-EXECUTE-REQUEST-2026-08-15-v0.1.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  frozen-execution:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install inherited parser dependency
        run: python -m pip install "numpy>=2.0"

      - name: Verify request and frozen science lineage
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = 'research/r7-f0-ku-ro-downstream-slot'
          python - <<'PY'
          import json
          r=json.load(open('data/JANUS-LINEAR-A-R7-F0-EXECUTE-REQUEST-2026-08-15-v0.1.json',encoding='utf-8'))
          assert r['status']=='EXECUTE_FROZEN_R7_F0_DOWNSTREAM_SLOT_TEST'
          assert r['science_freeze_commit_sha']=='8b6c2ca0e63939abc95c24d7c33c5bed901e381d'
          assert r['science_freeze_ci_run']==31879990080
          assert r['science_freeze_ci_conclusion']=='success'
          assert r['frozen_corpus_commit']=='43fe7cf1abc8e6bb1ea3228c3a1bd5938709620a'
          assert r['channels']==['NEXT_KIND','NEXT_LEX_OR_KIND','TWO_KIND']
          assert r['post_score_channel_change_authorized'] is False
          assert r['threshold_retuning_authorized'] is False
          assert r['null_change_authorized'] is False
          assert r['cold_or_external_replication_claim_authorized'] is False
          assert r['canonical_auto_promotion_authorized'] is False
          PY
          git diff --exit-code 8b6c2ca0e63939abc95c24d7c33c5bed901e381d HEAD -- \
            data/JANUS-LINEAR-A-R7-F0-KU-RO-DOWNSTREAM-SLOT-SPEC-2026-08-15-v0.1.json \
            research/linear_a/janus_linear_a_r7_f0_ku_ro_downstream_slot_v0_1.py \
            research/linear_a/test_janus_linear_a_r7_f0_ku_ro_downstream_slot_v0_1.py \
            .github/workflows/janus-linear-a-r7-f0-ku-ro-downstream-slot.yml

      - name: Re-run frozen canaries before scoring
        env:
          PYTHONPATH: research/linear_a
        run: |
          python research/linear_a/janus_linear_a_r7_f0_ku_ro_downstream_slot_v0_1.py \
            --spec data/JANUS-LINEAR-A-R7-F0-KU-RO-DOWNSTREAM-SLOT-SPEC-2026-08-15-v0.1.json \
            --validate-spec --out /tmp/f0-validation.json
          python research/linear_a/test_janus_linear_a_r7_f0_ku_ro_downstream_slot_v0_1.py -v

      - name: Fetch exact frozen corpus
        shell: bash
        run: |
          set -euo pipefail
          git clone --quiet https://github.com/Hawkar-usls/lineara.xyz.git /tmp/lineara
          git -C /tmp/lineara checkout --quiet 43fe7cf1abc8e6bb1ea3228c3a1bd5938709620a
          test "$(git -C /tmp/lineara rev-parse HEAD)" = '43fe7cf1abc8e6bb1ea3228c3a1bd5938709620a'

      - name: Execute frozen R7-F0 LOPO plus structure-destroying null
        env:
          PYTHONPATH: research/linear_a
        run: |
          python research/linear_a/janus_linear_a_r7_f0_ku_ro_downstream_slot_v0_1.py \
            --spec data/JANUS-LINEAR-A-R7-F0-KU-RO-DOWNSTREAM-SLOT-SPEC-2026-08-15-v0.1.json \
            --corpus /tmp/lineara \
            --out data/JANUS-LINEAR-A-R7-F0-KU-RO-DOWNSTREAM-SLOT-RESULT-2026-08-15-v0.1.json

      - name: Enforce result ceiling and write receipt
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,os
          p='data/JANUS-LINEAR-A-R7-F0-KU-RO-DOWNSTREAM-SLOT-RESULT-2026-08-15-v0.1.json'
          r=json.load(open(p,encoding='utf-8'))
          assert r['target']=='KU-RO'
          assert r['target_opaque_token']=='6a2ea59b95fe1b610d20'
          assert r['region']=='HT'
          assert r['internal_cross_fitted_development_corpus_test'] is True
          assert r['cold_or_external_replication'] is False
          assert r['canonical_auto_promotion_performed'] is False
          assert [x['channel'] for x in r['channel_results']]==['NEXT_KIND','NEXT_LEX_OR_KIND','TWO_KIND']
          for k in ('specific_semantic_function_established','exact_word_meaning_established','translation_established','phonetic_value_established','language_family_established','new_anchor_established','universal_cross_region_function_established','external_replication_established','decipherment_established'):
              assert r[k] is False
          raw=hashlib.sha256(open(p,'rb').read()).hexdigest()
          canonical=hashlib.sha256(json.dumps(r,sort_keys=True,ensure_ascii=False,separators=(',',':')).encode()).hexdigest()
          receipt={
            'artifact_uuid':'JANUS-LINEAR-A-R7-F0-EXECUTION-RECEIPT-2026-08-15-v0.1',
            'status':'FROZEN_R7_F0_EXECUTION_COMPLETED',
            'github_trigger_sha':os.environ['GITHUB_SHA'],
            'science_freeze_commit_sha':'8b6c2ca0e63939abc95c24d7c33c5bed901e381d',
            'science_freeze_ci_run':31879990080,
            'frozen_corpus_commit':'43fe7cf1abc8e6bb1ea3228c3a1bd5938709620a',
            'result_raw_file_sha256':raw,
            'result_canonical_json_sha256':canonical,
            'result_status':r['status'],
            'support_pass':r['support_pass'],
            'admitted_channel_count':r['admitted_channel_count'],
            'admitted_constraint_labels':r['admitted_constraint_labels'],
            'canonical_auto_promotion_performed':False,
          }
          out='data/JANUS-LINEAR-A-R7-F0-EXECUTION-RECEIPT-2026-08-15-v0.1.json'
          open(out,'w',encoding='utf-8').write(json.dumps(receipt,ensure_ascii=False,indent=2)+'\n')
          print(json.dumps(receipt,sort_keys=True))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: janus-linear-a-r7-f0-frozen-execution
          path: |
            data/JANUS-LINEAR-A-R7-F0-KU-RO-DOWNSTREAM-SLOT-RESULT-2026-08-15-v0.1.json
            data/JANUS-LINEAR-A-R7-F0-EXECUTION-RECEIPT-2026-08-15-v0.1.json
          if-no-files-found: error
          retention-days: 90

      - name: Persist exact F0 result on research branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'JANUS Evidence Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add \
            data/JANUS-LINEAR-A-R7-F0-KU-RO-DOWNSTREAM-SLOT-RESULT-2026-08-15-v0.1.json \
            data/JANUS-LINEAR-A-R7-F0-EXECUTION-RECEIPT-2026-08-15-v0.1.json
          git commit -m 'Register frozen Linear A R7-F0 KU-RO downstream slot result v0.1'
          git push origin HEAD:research/r7-f0-ku-ro-downstream-slot
