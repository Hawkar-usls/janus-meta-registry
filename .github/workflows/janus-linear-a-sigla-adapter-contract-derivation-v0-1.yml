name: JANUS Linear A SigLA adapter-contract derivation v0.1

on:
  push:
    paths:
      - "research/linear_a/janus_linear_a_sigla_adapter_contract_derivation_v0_1.py"
      - "data/JANUS-LINEAR-A-SIGLA-SOURCE-ADAPTER-CONTRACT-DERIVATION-SPEC-2026-08-14-v0.1.json"
      - ".github/workflows/janus-linear-a-sigla-adapter-contract-derivation-v0-1.yml"
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  derive-sigla-adapter-contract-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SOURCE_RUN_ID: "31794720800"
      SOURCE_ARTIFACT_ID: "9216887259"
      SOURCE_ARTIFACT_NAME: "janus-linear-a-sigla-word-view-interface-probe-v0.1"
      SOURCE_ARTIFACT_DIGEST: "sha256:d3c1bbbe4f1a4a2591c67c4998a8f0098eccc5d4ac89c9a7442343e43bd8f4bb"
      SOURCE_HEAD_SHA: "1ce86c6f725ab41995e1c06214d64dd1615beae1"

    steps:
      - name: Checkout JANUS registry
        uses: actions/checkout@v4

      - name: Validate frozen derivation spec
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          p='data/JANUS-LINEAR-A-SIGLA-SOURCE-ADAPTER-CONTRACT-DERIVATION-SPEC-2026-08-14-v0.1.json'
          d=json.load(open(p,encoding='utf-8'))
          assert d['status']=='FROZEN_BEFORE_ADAPTER_CONTRACT_DERIVATION'
          assert d['scientific_claim_bearing'] is False
          a=d['immutable_actions_artifact']
          assert a['workflow_run_id']==31794720800
          assert a['artifact_id']==9216887259
          assert a['artifact_digest']=='sha256:d3c1bbbe4f1a4a2591c67c4998a8f0098eccc5d4ac89c9a7442343e43bd8f4bb'
          assert a['head_sha']=='1ce86c6f725ab41995e1c06214d64dd1615beae1'
          assert d['derivation_input']['documents']==['ZA10b','KNZb5','KHWc2012']
          assert d['predeclared_derivation_rules']['no_mwenge_content_access'] is True
          assert d['claim_ceiling']['external_transcription_replication_established'] is False
          PY

      - name: Validate immutable source artifact metadata through GitHub API
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -fsSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${SOURCE_ARTIFACT_ID}" \
            > /tmp/source-artifact-metadata.json
          python3 - <<'PY'
          import json, os
          d=json.load(open('/tmp/source-artifact-metadata.json',encoding='utf-8'))
          assert d['id']==int(os.environ['SOURCE_ARTIFACT_ID'])
          assert d['name']==os.environ['SOURCE_ARTIFACT_NAME']
          assert d['digest']==os.environ['SOURCE_ARTIFACT_DIGEST']
          assert d['expired'] is False
          wr=d['workflow_run']
          assert wr['id']==int(os.environ['SOURCE_RUN_ID'])
          assert wr['head_sha']==os.environ['SOURCE_HEAD_SHA']
          print(json.dumps({'artifact_id':d['id'],'digest':d['digest'],'run_id':wr['id'],'head_sha':wr['head_sha']},sort_keys=True))
          PY

      - name: Download exact frozen word-view probe artifact
        uses: actions/download-artifact@v4
        with:
          name: janus-linear-a-sigla-word-view-interface-probe-v0.1
          path: artifacts/source-word-view-probe
          run-id: 31794720800
          github-token: ${{ github.token }}

      - name: Derive three-way fail-closed adapter contract candidate
        shell: bash
        run: |
          set -euo pipefail
          python3 research/linear_a/janus_linear_a_sigla_adapter_contract_derivation_v0_1.py \
            --artifact-root artifacts/source-word-view-probe \
            --out data/JANUS-LINEAR-A-SIGLA-SOURCE-ADAPTER-CONTRACT-CANDIDATE-2026-08-14-v0.1.json

      - name: Validate derived candidate and claim ceiling
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          p='data/JANUS-LINEAR-A-SIGLA-SOURCE-ADAPTER-CONTRACT-CANDIDATE-2026-08-14-v0.1.json'
          d=json.load(open(p,encoding='utf-8'))
          assert d['status']=='ADAPTER_CONTRACT_CANDIDATE_DERIVED_FROM_FROZEN_ARTIFACT'
          assert d['scientific_claim_bearing'] is False
          v=d['validation']
          assert v['embedded_probe_result_validated'] is True
          assert v['all_three_root_hashes_validated'] is True
          assert v['all_three_word_view_snapshots_reparsed'] is True
          assert v['all_predeclared_observables_equal_embedded_probe_result'] is True
          assert v['mwenge_content_accessed'] is False
          assert v['live_sigla_refetch_used'] is False
          assert v['documents']==['ZA10b','KNZb5','KHWc2012']
          c=d['contract_candidate']
          assert c['word_view_relative_route']=='index-word.html'
          assert c['derivation_rule']=='THREE_WAY_EXACT_SET_INTERSECTION_ONLY'
          assert c['source_native_text_order_required'] is True
          assert c['fallback_guessing_forbidden'] is True
          g=d['epistemic_gate']
          assert g['adapter_contract_candidate_derived'] is True
          assert g['sigla_source_adapter_contract_frozen'] is False
          assert g['cross_digitization_content_replication_established'] is False
          assert g['external_transcription_replication_established'] is False
          assert g['new_anchor_established'] is False
          assert g['decipherment_established'] is False
          assert d['claim_ceiling']['promotion']=='BLOCKED'
          print(json.dumps(d['support_summary'],sort_keys=True))
          PY

      - name: Persist mechanically derived candidate in registry
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "janus-proof-bot"
          git config user.email "janus-proof-bot@users.noreply.github.com"
          git add data/JANUS-LINEAR-A-SIGLA-SOURCE-ADAPTER-CONTRACT-CANDIDATE-2026-08-14-v0.1.json
          if git diff --cached --quiet; then
            echo "No candidate delta to commit"
          else
            git commit -m "Derive SigLA source-adapter contract candidate v0.1"
            git push origin HEAD:main
          fi

      - name: Upload derivation receipt
        uses: actions/upload-artifact@v4
        with:
          name: janus-linear-a-sigla-adapter-contract-derivation-v0.1
          path: |
            data/JANUS-LINEAR-A-SIGLA-SOURCE-ADAPTER-CONTRACT-CANDIDATE-2026-08-14-v0.1.json
            /tmp/source-artifact-metadata.json
          if-no-files-found: error
          retention-days: 30
