name: JANUS LOGOS 001 R1.4 - external sealed-evaluator interface SMOKE ONLY

on:
  pull_request:
    paths:
      - 'research/logos_001/r14_external/**'
      - 'research/logos_001/test_r14.py'
      - 'data/JANUS-LOGOS-001-R14-*.json'
      - '.github/workflows/janus-logos-001-r14.yml'
  push:
    branches: [main]
    paths:
      - 'research/logos_001/r14_external/**'
      - 'research/logos_001/test_r14.py'
      - 'data/JANUS-LOGOS-001-R14-*.json'
      - '.github/workflows/janus-logos-001-r14.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: janus-logos-r14-${{ github.ref }}
  cancel-in-progress: false

jobs:
  participant-interface:
    name: Public synthetic fixture: participant only sees TRAIN VAL TEST x
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify exact previous frozen learner Git blob
        run: |
          test "$(git hash-object research/logos_001/r12_discover.py)" = "97094ba3ef7461ff1b0eb44541d4a926260c239b"
      - name: Produce public fixture proposals, never scientific credentials
        run: |
          python research/logos_001/r14_external/r14_public_smoke.py \
            --mode participant --out /tmp/logos-r14-public-proposals.json
      - uses: actions/upload-artifact@v4
        with:
          name: logos-r14-public-fixture-proposals
          path: /tmp/logos-r14-public-proposals.json
          if-no-files-found: error
          retention-days: 7

  mock-custodian-protocol-check:
    name: Separate runner checks public fixture and MUST NOT mark external PASS
    needs: participant-interface
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install scientific and cryptographic verifier dependencies
        run: python -m pip install --disable-pip-version-check numpy==1.26.4 scipy==1.14.1 scikit-learn==1.5.2 cryptography==44.0.3
      - uses: actions/download-artifact@v4
        with:
          name: logos-r14-public-fixture-proposals
          path: /tmp/logos-r14-public-fixture
      - name: Exercise independent worker protocol on PUBLIC data only
        run: |
          python research/logos_001/r14_external/r14_public_smoke.py \
            --mode custodian \
            --input /tmp/logos-r14-public-fixture/logos-r14-public-proposals.json \
            --out /tmp/logos-r14-fixture-witness.json
      - name: Fail closed if any local test masquerades as external scientific witness
        run: |
          python -c "import json; r=json.load(open('/tmp/logos-r14-fixture-witness.json')); assert r['status']=='UNSIGNED_DRAFT_NOT_EXTERNAL_PROOF'; assert r['independent_external_evaluation_verified'] is False; assert r['three_distinct_real_domains_certified_by_custodian'] is False; assert r['production_model_promotion_allowed'] is False"
      - name: Test spoofed signatures, fake evidence, scientific authorization
        run: python -m unittest discover -s research/logos_001 -p test_r14.py -v
      - uses: actions/upload-artifact@v4
        with:
          name: logos-r14-public-smoke-not-an-external-witness
          path: /tmp/logos-r14-fixture-witness.json
          if-no-files-found: error
          retention-days: 7
