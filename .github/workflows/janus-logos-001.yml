name: JANUS LOGOS 001 - independent numerical witness

on:
  pull_request:
    paths:
      - 'research/logos_001/**'
      - 'data/JANUS-LOGOS-001-*.json'
      - '.github/workflows/janus-logos-001.yml'
  push:
    branches: [main]
    paths:
      - 'research/logos_001/**'
      - 'data/JANUS-LOGOS-001-*.json'
      - '.github/workflows/janus-logos-001.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: janus-logos-001-${{ github.ref }}
  cancel-in-progress: false

jobs:
  reproducible-generator:
    name: Recompute with mpmath 85 dps
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned numeric dependency
        run: python -m pip install --disable-pip-version-check 'mpmath==1.3.0'
      - name: Recompute 3 maps without reference delta in solver
        run: python research/logos_001/generate.py --depth 8 --out /tmp/logos001-recomputed.json
      - name: Byte-exact determinism against frozen evidence
        run: cmp /tmp/logos001-recomputed.json data/JANUS-LOGOS-001-R0-RESULT-v1.0.json
  independent-float64-witness:
    name: Independent algorithm and negative controls
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Independently recompute orbits and reject corrupt controls
        run: python research/logos_001/verify.py data/JANUS-LOGOS-001-R0-RESULT-v1.0.json --self-test
