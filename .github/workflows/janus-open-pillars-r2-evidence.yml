name: JANUS R2 13-Pillar Meta Evidence (Read Only)

on:
  pull_request:
    paths:
      - 'data/autonomy_map/JANUS_OPEN_PILLARS_R2_2026-11-24.json'
      - 'tests/test_autonomy_open_pillars_r2_evidence.py'
      - '.github/workflows/janus-open-pillars-r2-evidence.yml'
  push:
    branches: [research/janus-r2-open-pillars-evidence-20261124]
    paths:
      - 'data/autonomy_map/JANUS_OPEN_PILLARS_R2_2026-11-24.json'
      - 'tests/test_autonomy_open_pillars_r2_evidence.py'
      - '.github/workflows/janus-open-pillars-r2-evidence.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  immutable-research-pointer:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Test real source-run SHA and preserve all scientific HOLDs
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p 'test_autonomy_open_pillars_r2_evidence.py' -v
          echo 'JANUS_PILLARS_R2_META_POINTER_PASS__NO_AUTONOMY_OR_ADMISSION'
