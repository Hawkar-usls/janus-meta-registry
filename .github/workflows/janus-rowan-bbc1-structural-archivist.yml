name: JANUS Rowan BBC1 WT K5A durable structural archivist

on:
  schedule:
    - cron: '17 */2 * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - 'modules/rowan_observer/bbc1_status_import.py'
      - 'modules/rowan_observer/test_bbc1_status_import.py'
      - '.github/workflows/janus-rowan-bbc1-structural-archivist.yml'
  push:
    branches: [main]
    paths:
      - 'modules/rowan_observer/bbc1_status_import.py'
      - 'modules/rowan_observer/test_bbc1_status_import.py'
      - '.github/workflows/janus-rowan-bbc1-structural-archivist.yml'

permissions:
  contents: read

concurrency:
  group: janus-rowan-bbc1-structural-archivist
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Syntax and isolated zero-provider tests
        run: |
          python -m py_compile modules/rowan_observer/bbc1_status_import.py modules/rowan_observer/test_bbc1_status_import.py
          python -m unittest discover -v -s modules/rowan_observer -p test_bbc1_status_import.py

  archive:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Source-bound immutable structural receipt archive
        env:
          GH_TOKEN: \${{ github.token }}
        run: python modules/rowan_observer/bbc1_status_import.py --root . --limit 12
      - name: Publish only independent structural status receipts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'JANUS Rowan Structural Status Archivist'
          git config user.email 'actions@users.noreply.github.com'
          git add data/rowan/bbc1_structural_status/
          if git diff --cached --quiet; then
            echo 'ROWAN_BBC1_STRUCTURAL_ARCHIVE=IDEMPOTENT_NO_CHANGE'
            exit 0
          fi
          git commit -m 'Rowan: archive immutable WT/K5A structural statuses'
          for attempt in 1 2 3 4; do
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo 'ROWAN_BBC1_STRUCTURAL_ARCHIVE=CONFLICT_HOLD'
              exit 1
            fi
            if git push origin HEAD:main; then
              echo 'ROWAN_BBC1_STRUCTURAL_ARCHIVE=PERSISTED'
              exit 0
            fi
            sleep "$attempt"
          done
          echo 'ROWAN_BBC1_STRUCTURAL_ARCHIVE=PUSH_FAILED'
          exit 1
