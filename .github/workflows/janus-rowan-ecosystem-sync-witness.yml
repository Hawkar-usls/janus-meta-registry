name: JANUS Rowan Ecosystem Independent Sync Witness
on:
  schedule:
    - cron: '23 */4 * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - 'modules/rowan_observer/ecosystem_sync_witness.py'
      - 'modules/rowan_observer/test_ecosystem_sync_witness.py'
      - '.github/workflows/janus-rowan-ecosystem-sync-witness.yml'
  push:
    branches: [main]
    paths:
      - 'modules/rowan_observer/ecosystem_sync_witness.py'
      - 'modules/rowan_observer/test_ecosystem_sync_witness.py'
      - '.github/workflows/janus-rowan-ecosystem-sync-witness.yml'
      # Independent attestation immediately after the verified reconciler
      # pushes its exact source-bound coordination pointer; never on every
      # routine canonical archive write, which would be too early.
      - 'data/rowan/coordination/LATEST_COORDINATION_STATE.json'
permissions:
  contents: read
concurrency:
  group: rowan-readonly-ecosystem-witness-${{ github.ref }}
  cancel-in-progress: false
jobs:
  independent-readonly:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Audit pure function contract and failure adversaries
        run: python -m unittest discover -v -s modules/rowan_observer -p test_ecosystem_sync_witness.py
      - name: Independently attest live 8/8 across canonical, brain, witness, AURA, TOPA and scout sources
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python modules/rowan_observer/ecosystem_sync_witness.py > rowan-ecosystem-sync-witness.json
      - name: Retain public metadata witness (no private graph, provider keys, billing)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: janus-rowan-ecosystem-source-binding
          path: rowan-ecosystem-sync-witness.json
          if-no-files-found: error
          retention-days: 7
