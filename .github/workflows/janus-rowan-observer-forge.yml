name: JANUS Rowan Durable Observer

on:
  workflow_dispatch:
  schedule:
    - cron: '31 */6 * * *'

permissions:
  contents: write

concurrency:
  group: janus-rowan-durable-observer
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate evidence gate
        run: python -m unittest discover -s modules/rowan_observer -p 'test_*.py'
      - name: Import published science receipts from completed JANUS runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: python modules/rowan_observer/ingest.py --root . --limit 12
      - name: Commit immutable evidence like Fresco Forge
        run: |
          git config user.name 'JANUS Rowan Observatory'
          git config user.email 'actions@users.noreply.github.com'
          git add data/rowan/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Rowan Observer: append verified provider receipt'
          git pull --rebase origin main
          git push origin HEAD:main
