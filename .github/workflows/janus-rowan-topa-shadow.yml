name: JANUS TOPA Independent Shadow Learning
on:
  workflow_dispatch:
  schedule:
    - cron: '53 3 * * *'
  push:
    branches: [ main ]
    paths:
      - 'modules/rowan_observer/shadow_train.py'
      - 'modules/rowan_observer/topa_replay.py'
      - 'modules/rowan_observer/SHADOW_LEARNING_PROTOCOL.md'
      - 'data/rowan/CANONICAL_STATE.json'
  pull_request:
    paths:
      - 'modules/rowan_observer/**'
      - '.github/workflows/janus-rowan-topa-shadow.yml'

permissions:
  contents: write

concurrency:
  group: janus-rowan-topa-shadow-learning
  cancel-in-progress: false

jobs:
  train-and-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install numeric CPU dependency (no GPU, no Rowan)
        run: python -m pip install --disable-pip-version-check --quiet numpy==2.1.3
      - name: Local synthetic controls, no provider network
        run: python -m unittest discover -s modules/rowan_observer -p 'test_*.py'
      - name: Fit real sequence-shadow regression weights to pinned public BBC1 corpus
        if: github.event_name != 'pull_request'
        run: python modules/rowan_observer/shadow_train.py
      - name: Independently download source and replay TOPA holdout evaluation
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          models=(data/rowan/learned/SHADOW-BBC1-*.json)
          if [ "${#models[@]}" -ne 1 ]; then
            echo "TOPA_MODEL_COUNT_HOLD"
            exit 2
          fi
          python modules/rowan_observer/topa_replay.py --model "${models[0]}"
      - name: Learn only from 3+ source-attested completed Rowan cases
        if: github.event_name != 'pull_request'
        run: python modules/rowan_observer/feedback_train.py
      - name: TOPA independently reconstructs all provider-feedback ridge coefficients
        if: github.event_name != 'pull_request'
        run: python modules/rowan_observer/topa_feedback_replay.py
      - name: Archive shadow weights and independent TOPA evidence
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'JANUS TOPA Evidence Trainer'
          git config user.email 'actions@users.noreply.github.com'
          git add data/rowan/learned/ data/rowan/topa/
          if [ -d data/rowan/feedback ]; then git add data/rowan/feedback/; fi
          if git diff --cached --quiet; then
            echo "JANUS_SHADOW=UNCHANGED_REPLAY_VERIFIED"
            exit 0
          fi
          git commit -m '[topa] Archive frozen public BBC1 model weights and independent replay'
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              exit 1
            fi
            if git push origin HEAD:main; then
              echo "JANUS_TOPA_ARCHIVE=SUCCESS"
              exit 0
            fi
            sleep "$attempt"
          done
          exit 1
