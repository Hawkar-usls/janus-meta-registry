name: JANUS Self-Writer First Real Model-Authored Repair Trial

on:
  pull_request:
    paths:
      - 'modules/autonomy_coder/real_bug_repair_author.py'
      - 'modules/autonomy_coder/real_bug_repair_oracle.py'
      - 'tests/test_real_bug_repair_model_trial.py'
      - '.github/workflows/janus-self-writer-real-bug-repair-trial.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: janus-real-model-repair-${{ github.ref }}
  cancel-in-progress: false

jobs:
  frozen-real-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reproduce original future-subsecond bug and enforce narrow AST
        run: |
          set -euo pipefail
          python -m unittest discover -v -s tests -p test_real_bug_repair_model_trial.py
          python - <<'PY'
          from datetime import datetime, timedelta, timezone
          x=datetime(2026,10,31,12,tzinfo=timezone.utc)
          bad=int((x-(x+timedelta(microseconds=500000))).total_seconds())
          assert bad==0
          print('JANUS_REAL_BUG_REPRODUCED=FUTURE_500MS_REPORTS_FRESH')
          PY

  pinned-model-author:
    needs: frozen-real-regression
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore PINNED Qwen coder weight cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/janus-open-coder
          key: janus-open-coder-ea3f2471cf1b1f0db85067f1ef93848e38e88c25
      - name: Install bounded CPU-only code author runtime
        run: |
          set -euo pipefail
          python -m pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install transformers==4.57.1 huggingface-hub==0.36.0 safetensors==0.6.2
      - name: Generate two actual repair variants from pinned external Qwen model
        env:
          HF_HUB_DISABLE_TELEMETRY: '1'
          HF_HUB_DISABLE_XET: '1'
          TOKENIZERS_PARALLELISM: 'false'
        run: |
          set -euo pipefail
          python modules/autonomy_coder/real_bug_repair_author.py \
            --root . \
            --cache "$HOME/.cache/janus-open-coder" \
            --out trial-author/BUNDLE.json
          python - <<'PY'
          import json
          b=json.load(open('trial-author/BUNDLE.json'))
          assert b['schema']=='janus.self_writer.real_bug_repair_candidates.v1'
          assert b['authority_delta']==0 and b['publish_to_main'] is False
          assert len(b['candidates'])==2
          print('JANUS_ACTUAL_MODEL_REPAIR_GENERATED=2_VARIANTS')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: janus-real-bug-model-authored-raw-variants
          path: trial-author/BUNDLE.json
          retention-days: 30
          if-no-files-found: error

  independent-networkless-review:
    needs: pinned-model-author
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: janus-real-bug-model-authored-raw-variants
          path: trial-author
      - name: Pull exact tested networkless Python container
        run: docker pull python@sha256:1148dbb014615300fa7e713b2f94f550c0d1c69780c0805f84f093ceee34dd0b
      - name: Independently inspect AST and replay signed-microsecond edge cases
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p trial-review
          timeout 120 docker run --rm --network none --read-only \
            --user 65534:65534 --cap-drop ALL \
            --security-opt no-new-privileges --memory 256m \
            --cpus 1 --pids-limit 32 --ulimit cpu=10:10 \
            --mount "type=bind,src=$PWD/modules/autonomy_coder,dst=/suite,readonly" \
            --mount "type=bind,src=$PWD/trial-author,dst=/input,readonly" \
            python@sha256:1148dbb014615300fa7e713b2f94f550c0d1c69780c0805f84f093ceee34dd0b \
            python -I -B /suite/real_bug_repair_oracle.py --bundle /input/BUNDLE.json \
            > trial-review/EVALUATION.json
          python - <<'PY'
          import json
          e=json.load(open('trial-review/EVALUATION.json'))
          assert e['schema']=='janus.self_writer.real_bug_repair_evaluation.v1'
          assert e['auto_merge'] is False and e['installed_into_production'] is False
          assert e['authority_delta']==0 and e['main_code_mutations']==0
          print('JANUS_REAL_MODEL_REPAIR_REVIEW='+e['status'])
          print('selected_variant='+str(e['selected_index']))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: janus-real-bug-independent-repair-verdict
          path: trial-review/EVALUATION.json
          retention-days: 30
          if-no-files-found: error
