name: JANUS Singularity GPT R2 Spacetime Geometry
on:
  push:
    branches: [janus-singularity-gpt-r2]
    paths:
      - 'registry/physics/singularity_gpt/r2/**'
      - '.github/workflows/janus-singularity-gpt-r2.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: CPU dependencies
        run: |
          python -m pip install numpy==2.2.6
          python -m pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Verify source blobs and train geometric transformers
        run: python registry/physics/singularity_gpt/r2/train.py
      - name: Archive receipts and checkpoints
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: singularity-gpt-r2
          path: singularity-r2-output/
          if-no-files-found: warn
          retention-days: 30
