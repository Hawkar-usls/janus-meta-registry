name: JANUS Singularity GPT R3A Dynamic Collapse
on:
  push:
    branches: [janus-singularity-gpt-r3]
    paths:
      - 'registry/physics/singularity_gpt/r3/**'
      - '.github/workflows/janus-singularity-gpt-r3.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  evolution:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: CPU solver dependencies
        run: python -m pip install numpy==2.2.6 numba==0.61.2
      - name: Dynamic Einstein scalar field evolution
        run: python registry/physics/singularity_gpt/r3/evolve.py
      - name: Archive numerical trajectories and examination
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: singularity-gpt-r3a
          path: singularity-r3-output/
          if-no-files-found: warn
          retention-days: 30
