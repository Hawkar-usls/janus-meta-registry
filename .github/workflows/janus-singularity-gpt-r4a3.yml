name: JANUS R4A3 pre-AMR validation
on:
  push:
    branches: [janus-singularity-gpt-r4a3]
    paths:
      - 'registry/physics/singularity_gpt/r4a3/**'
      - '.github/workflows/janus-singularity-gpt-r4a3.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  examine:
    strategy:
      fail-fast: false
      matrix:
        mode: [fixed, bracket, controls, positive]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            registry/physics/singularity_gpt/r3b
            registry/physics/singularity_gpt/r4a2
            registry/physics/singularity_gpt/r4a3
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy==2.2.6 numba==0.61.2
      - name: Retrieve frozen R4A artifact
        if: matrix.mode == 'fixed'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail --location --retry 3 -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${{ github.repository }}/actions/artifacts/15194010923/zip" -o r4a.zip
      - name: Retrieve frozen R4A2 artifact
        if: matrix.mode == 'fixed' || matrix.mode == 'bracket'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail --location --retry 3 -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${{ github.repository }}/actions/artifacts/15196105655/zip" -o r4a2.zip
      - name: Execute frozen examination
        run: python registry/physics/singularity_gpt/r4a3/examine.py ${{ matrix.mode }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r4a3-${{ matrix.mode }}
          path: r4a3-output/
          if-no-files-found: warn
          retention-days: 30
