name: JANUS R4B0 RETINA NOISE and Richardson
on:
  push:
    branches: [janus-singularity-gpt-r4b-retina-noise]
    paths:
      - 'registry/physics/singularity_gpt/r4b0/**'
      - '.github/workflows/janus-singularity-gpt-r4b0.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exam:
    strategy:
      fail-fast: false
      matrix:
        mode: [echo, fixed, endpoint0, endpoint1]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            registry/physics/singularity_gpt/r3b
            registry/physics/singularity_gpt/r4a2
            registry/physics/singularity_gpt/r4b0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy==2.2.6 numba==0.61.2 scipy==1.15.3
      - name: Echo sensitivity exam
        if: matrix.mode == 'echo'
        run: python registry/physics/singularity_gpt/r4b0/echo.py
      - name: Richardson and bracket endpoint exam
        if: matrix.mode != 'echo'
        run: python registry/physics/singularity_gpt/r4b0/mesh_exam.py ${{ matrix.mode }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r4b0-${{ matrix.mode }}
          path: r4b0-output/
          if-no-files-found: warn
          retention-days: 30
