name: JANUS R4B1 convergence audit
on:
  pull_request:
    types: [opened]
    paths:
      - 'registry/physics/singularity_gpt/r4b1/**'
      - '.github/workflows/janus-singularity-gpt-r4b1.yml'
permissions:
  contents: read
jobs:
  audit:
    if: github.repository == 'Hawkar-usls/janus-meta-registry' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'janus-singularity-gpt-r4b1-convergence' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          sparse-checkout: |
            registry/physics/singularity_gpt/r3b
            registry/physics/singularity_gpt/r4b0
            registry/physics/singularity_gpt/r4b1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy==2.2.6 numba==0.61.2
      - name: Verify frozen source and protocol
        run: |
          test "$(git hash-object registry/physics/singularity_gpt/r3b/solver_lib.py)" = "71ef15312166337a9ee41d71d75a29674d00e5d3"
          test "$(git hash-object registry/physics/singularity_gpt/r4b1/protocol.json)" = "3b0646a74ddde45d70be70ff0d30782c9cc5f88c"
          test "$(git hash-object registry/physics/singularity_gpt/r4b1/audit.py)" = "47a603de61965d24ac65150586daafc354d34d91"
          python -m py_compile registry/physics/singularity_gpt/r4b1/audit.py
      - name: Uniform convergence and independent time-equation residual audit
        run: python registry/physics/singularity_gpt/r4b1/audit.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r4b1-convergence-audit
          path: r4b1-output/
          if-no-files-found: warn
          retention-days: 30
