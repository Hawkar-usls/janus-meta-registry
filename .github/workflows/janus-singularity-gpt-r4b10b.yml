name: JANUS R4B10B conditional path witness
on:
  push:
    branches: [janus-singularity-gpt-r4b10b-path-witness]
    paths:
      - '.github/workflows/janus-singularity-gpt-r4b10b.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
env:
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
jobs:
  witness:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: registry/physics/singularity_gpt
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy==2.2.6 scipy==1.15.3
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 46035084112
          pattern: r4b10-calibration-*
          path: source-artifacts
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 46035084112
          name: r4b10-router
          path: source-artifacts/r4b10-router
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 46035084112
          name: r4b10-thresholds
          path: source-artifacts/r4b10-thresholds
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 46035084112
          name: r4b10-evaluation-iid
          path: source-artifacts/r4b10-evaluation-iid
      - run: python registry/physics/singularity_gpt/r4b10b/audit.py source-artifacts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r4b10b-path-witness
          path: r4b10b-output/
          if-no-files-found: warn
          retention-days: 30
