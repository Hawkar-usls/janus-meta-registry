name: JANUS R4B2 resolved convergence
on:
  pull_request:
    types: [opened]
    paths:
      - 'registry/physics/singularity_gpt/r4b2/**'
      - '.github/workflows/janus-singularity-gpt-r4b2.yml'
permissions:
  contents: read
jobs:
  audit:
    if: github.repository == 'Hawkar-usls/janus-meta-registry' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'janus-singularity-gpt-r4b2-resolved' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          sparse-checkout: |
            registry/physics/singularity_gpt/r3b
            registry/physics/singularity_gpt/r4b2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy==2.2.6 numba==0.61.2
      - name: Verify frozen solver protocol and audit
        run: |
          test "$(git hash-object registry/physics/singularity_gpt/r3b/solver_lib.py)" = "71ef15312166337a9ee41d71d75a29674d00e5d3"
          test "$(git hash-object registry/physics/singularity_gpt/r4b2/protocol.json)" = "d7bf6d1a1091cc4cee7d6562e14a664abc2eef74"
          test "$(git hash-object registry/physics/singularity_gpt/r4b2/audit.py)" = "863bd7568032c26da2cd3e475df601097c113b2e"
          python -m py_compile registry/physics/singularity_gpt/r4b2/audit.py
      - name: Resolved pair and nonzero outgoing boundary flux
        run: python registry/physics/singularity_gpt/r4b2/audit.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r4b2-resolved-convergence
          path: r4b2-output/
          if-no-files-found: warn
          retention-days: 30
