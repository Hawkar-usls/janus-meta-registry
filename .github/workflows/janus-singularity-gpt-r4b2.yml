name: JANUS R4B2 rival models and second Richardson
on:
  push:
    branches: [janus-singularity-gpt-r4b2-rivals]
    paths:
      - 'registry/physics/singularity_gpt/r4b2/**'
      - '.github/workflows/janus-singularity-gpt-r4b2.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exam:
    strategy:
      fail-fast: false
      matrix:
        mode: [rivals, paired_struct, mesh_exam]
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            registry/physics/singularity_gpt/r3b
            registry/physics/singularity_gpt/r4a2
            registry/physics/singularity_gpt/r4b0
            registry/physics/singularity_gpt/r4b2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy==2.2.6 numba==0.61.2 scipy==1.15.3
      - name: Execute frozen examination
        env:
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
        run: python registry/physics/singularity_gpt/r4b2/${{ matrix.mode }}.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r4b2-${{ matrix.mode }}
          path: r4b2-output/
          if-no-files-found: warn
          retention-days: 30
