name: JANUS R4B3 common banks and phase equivalence
on:
  push:
    branches: [janus-singularity-gpt-r4b3-blind]
    paths:
      - 'registry/physics/singularity_gpt/r4b3/**'
      - '.github/workflows/janus-singularity-gpt-r4b3.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exam:
    strategy:
      fail-fast: false
      matrix:
        mode: [r4b0, r4b2, oracle, blind]
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            registry/physics/singularity_gpt/r3b
            registry/physics/singularity_gpt/r4b0
            registry/physics/singularity_gpt/r4b2
            registry/physics/singularity_gpt/r4b3
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy==2.2.6 scipy==1.15.3
      - name: Cross benchmark
        if: matrix.mode == 'r4b0' || matrix.mode == 'r4b2'
        env:
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
        run: python registry/physics/singularity_gpt/r4b3/cross.py ${{ matrix.mode }}
      - name: Phase equivalence
        if: matrix.mode == 'oracle' || matrix.mode == 'blind'
        env:
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
        run: python registry/physics/singularity_gpt/r4b3/phase.py ${{ matrix.mode }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r4b3-${{ matrix.mode }}
          path: r4b3-output/
          if-no-files-found: warn
          retention-days: 30
