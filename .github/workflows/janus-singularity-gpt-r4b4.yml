name: JANUS R4B4 temporal reconstruction
on:
  push:
    branches: [janus-singularity-gpt-r4b4-temporal]
    paths:
      - 'registry/physics/singularity_gpt/r4b4/**'
      - '.github/workflows/janus-singularity-gpt-r4b4.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  clean:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            registry/physics/singularity_gpt/r4b2
            registry/physics/singularity_gpt/r4b3
            registry/physics/singularity_gpt/r4b4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy==2.2.6 scipy==1.15.3
      - name: Clean BLIND positive controls
        env:
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
        run: python registry/physics/singularity_gpt/r4b4/ablate.py clean
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r4b4-clean
          path: r4b4-output/
          if-no-files-found: warn
          retention-days: 30
  ablate:
    needs: clean
    strategy:
      fail-fast: false
      matrix:
        mode: [A, B, C, D]
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            registry/physics/singularity_gpt/r4b2
            registry/physics/singularity_gpt/r4b3
            registry/physics/singularity_gpt/r4b4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy==2.2.6 scipy==1.15.3
      - name: Frozen paired ablation
        env:
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
        run: python registry/physics/singularity_gpt/r4b4/ablate.py ${{ matrix.mode }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r4b4-${{ matrix.mode }}
          path: r4b4-output/
          if-no-files-found: warn
          retention-days: 30
