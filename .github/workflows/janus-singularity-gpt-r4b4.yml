name: JANUS R4B4 asymptotic convergence exam
on:
  pull_request:
    types: [opened]
    paths:
      - 'registry/physics/singularity_gpt/r4b4/**'
      - '.github/workflows/janus-singularity-gpt-r4b4.yml'
permissions:
  contents: read
jobs:
  audit:
    if: github.repository == 'Hawkar-usls/janus-meta-registry' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'janus-singularity-gpt-r4b4-precommit' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          sparse-checkout: |
            registry/physics/singularity_gpt/r3b
            registry/physics/singularity_gpt/r4b3
            registry/physics/singularity_gpt/r4b4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy==2.2.6 numba==0.61.2
      - name: Verify sealed forecast, protocol and solver
        run: |
          test "$(git hash-object registry/physics/singularity_gpt/r3b/solver_lib.py)" = "71ef15312166337a9ee41d71d75a29674d00e5d3"
          test "$(git hash-object registry/physics/singularity_gpt/r4b3/boundary_solver.py)" = "2a3222c222412f327666e10db2219acde71cdeb3"
          test "$(git hash-object registry/physics/singularity_gpt/r4b3/audit.py)" = "81698826a8250d414624bc258c639ff0f97acee0"
          test "$(git hash-object registry/physics/singularity_gpt/r4b3/protocol.json)" = "ec56604db45dd316701615cc5deb93343cb0ca08"
          test "$(git hash-object registry/physics/singularity_gpt/r4b4/forecast_precommit.json)" = "44c9dc760dd3eb44f2c394cf60b108588630ee7a"
          test "$(git hash-object registry/physics/singularity_gpt/r4b4/protocol.json)" = "3cde0ff40ec056e5509e646425bfeeae439d3200"
          test "$(git hash-object registry/physics/singularity_gpt/r4b4/audit.py)" = "5e1ae378d569f52278f3cef9358911fbb772a7d1"
          python -m py_compile registry/physics/singularity_gpt/r4b4/audit.py
      - name: Gated boundary, temporal and three-grid exam
        run: python registry/physics/singularity_gpt/r4b4/audit.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r4b4-asymptotic-convergence
          path: r4b4-output/
          if-no-files-found: warn
          retention-days: 30
