name: JANUS R4B5 critical proxy bracket
on:
  pull_request:
    types: [opened]
    paths:
      - 'registry/physics/singularity_gpt/r4b5-bracket/**'
      - '.github/workflows/janus-singularity-gpt-r4b5-bracket.yml'
permissions:
  contents: read
jobs:
  audit:
    if: github.repository == 'Hawkar-usls/janus-meta-registry' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'janus-singularity-gpt-r4b5-critical-bracket' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          sparse-checkout: |
            registry/physics/singularity_gpt/r3b
            registry/physics/singularity_gpt/r4b3
            registry/physics/singularity_gpt/r4b4
            registry/physics/singularity_gpt/r4b5-bracket
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy==2.2.6 numba==0.61.2
      - name: Verify frozen bracket protocol and unchanged solver
        run: |
          test "$(git hash-object registry/physics/singularity_gpt/r3b/solver_lib.py)" = "71ef15312166337a9ee41d71d75a29674d00e5d3"
          test "$(git hash-object registry/physics/singularity_gpt/r4b3/boundary_solver.py)" = "2a3222c222412f327666e10db2219acde71cdeb3"
          test "$(git hash-object registry/physics/singularity_gpt/r4b4/audit.py)" = "5e1ae378d569f52278f3cef9358911fbb772a7d1"
          test "$(git hash-object registry/physics/singularity_gpt/r4b5-bracket/protocol.json)" = "f8ac12abe00a0695e8a6068bcf161030a10e68bd"
          test "$(git hash-object registry/physics/singularity_gpt/r4b5-bracket/audit.py)" = "7178830daae07f71854f9e81f66fa3366586a6e8"
          python -m py_compile registry/physics/singularity_gpt/r4b5-bracket/audit.py
      - name: Boundary and independent convergence then fixed proxy bracket scan
        run: python registry/physics/singularity_gpt/r4b5-bracket/audit.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r4b5-critical-proxy-bracket
          path: r4b5-bracket-output/
          if-no-files-found: warn
          retention-days: 30
