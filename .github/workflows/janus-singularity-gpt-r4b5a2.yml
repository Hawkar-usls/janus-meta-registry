name: JANUS R4B5A2 curvature resumption
on:
  pull_request:
    types: [opened]
    paths:
      - 'registry/physics/singularity_gpt/r4b5a2/**'
      - '.github/workflows/janus-singularity-gpt-r4b5a2.yml'
permissions:
  contents: read
jobs:
  audit:
    if: github.repository == 'Hawkar-usls/janus-meta-registry' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'janus-singularity-gpt-r4b5a2-curvature-resumption' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          sparse-checkout: |
            registry/physics/singularity_gpt/r3b
            registry/physics/singularity_gpt/r4b3
            registry/physics/singularity_gpt/r4b5a
            registry/physics/singularity_gpt/r4b5a1
            registry/physics/singularity_gpt/r4b5a2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy==2.2.6 numba==0.61.2
      - name: Verify recovered reference archive and unchanged frozen gates
        run: |
          test "$(git hash-object registry/physics/singularity_gpt/r3b/solver_lib.py)" = "71ef15312166337a9ee41d71d75a29674d00e5d3"
          test "$(git hash-object registry/physics/singularity_gpt/r4b3/boundary_solver.py)" = "2a3222c222412f327666e10db2219acde71cdeb3"
          test "$(git hash-object registry/physics/singularity_gpt/r4b5a/audit.py)" = "f84f5a9336794e7d9a19ca301d5da1927f5dac13"
          test "$(git hash-object registry/physics/singularity_gpt/r4b5a1/result_archive.json)" = "f3dc6626c58f198b9fe61a4f209daa4f5e8f7d9d"
          test "$(git hash-object registry/physics/singularity_gpt/r4b5a1/audit.py)" = "5f49a423156fd8e8199d5d63e4de66b31bdada51"
          test "$(git hash-object registry/physics/singularity_gpt/r4b5a2/protocol.json)" = "bb5bcd9a68be9cce73606bdc78ca87a9456fbf73"
          test "$(git hash-object registry/physics/singularity_gpt/r4b5a2/audit.py)" = "7e9eefb914f89fecdef5b48cbad1314ffaff22fa"
          python -m py_compile registry/physics/singularity_gpt/r4b5a2/audit.py
      - name: Reference replay then temporal and native common curvature exam
        run: python registry/physics/singularity_gpt/r4b5a2/audit.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r4b5a2-curvature-resumption
          path: r4b5a2-output/
          if-no-files-found: warn
          retention-days: 30
