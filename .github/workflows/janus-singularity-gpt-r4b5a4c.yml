name: JANUS R4B5A4c thread attribution
on:
  pull_request:
    types: [opened]
    paths:
      - 'registry/physics/singularity_gpt/r4b5a4c/**'
      - '.github/workflows/janus-singularity-gpt-r4b5a4c.yml'
permissions:
  contents: read
  actions: read
jobs:
  audit:
    if: github.repository == 'Hawkar-usls/janus-meta-registry' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'janus-singularity-gpt-r4b5a4c-thread-attribution' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      NUMBA_NUM_THREADS: '1'
      BLIS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          sparse-checkout: |
            registry/physics/singularity_gpt/r3b
            registry/physics/singularity_gpt/r4b3
            registry/physics/singularity_gpt/r4b5a3
            registry/physics/singularity_gpt/r4b5a4
            registry/physics/singularity_gpt/r4b5a4a
            registry/physics/singularity_gpt/r4b5a4b
            registry/physics/singularity_gpt/r4b5a4c
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.18'
      - run: pip install numpy==2.2.6 numba==0.61.2 llvmlite==0.44.0 threadpoolctl==3.6.0
      - name: Verify frozen source and precommit
        run: |
          test "$(git hash-object registry/physics/singularity_gpt/r3b/solver_lib.py)" = "71ef15312166337a9ee41d71d75a29674d00e5d3"
          test "$(git hash-object registry/physics/singularity_gpt/r4b3/boundary_solver.py)" = "2a3222c222412f327666e10db2219acde71cdeb3"
          test "$(git hash-object registry/physics/singularity_gpt/r4b5a3/audit.py)" = "a7a28d2630c128ecbc6beeffe25dc88262833ae6"
          test "$(git hash-object registry/physics/singularity_gpt/r4b5a3/protocol.json)" = "224496bd9513a3b9ecf551499ec27366f972bfaa"
          test "$(git hash-object registry/physics/singularity_gpt/r4b5a4/audit.py)" = "4adee56538805027f6678f6be38afa1874970c2d"
          test "$(git hash-object registry/physics/singularity_gpt/r4b5a4/protocol.json)" = "8be8a0feb7b8a6c649f87d460cade4e6488ab259"
          test "$(git hash-object registry/physics/singularity_gpt/r4b5a4a/audit.py)" = "dd7ec4bcbf69f54da4081cdd803256fc93be49ba"
          test "$(git hash-object registry/physics/singularity_gpt/r4b5a4a/protocol.json)" = "628b26e9cb181f50fbbd63b732ea8910b37cb60e"
          test "$(git hash-object registry/physics/singularity_gpt/r4b5a4a/execution_precommit.json)" = "7b401f1ad057240331a7ef5ebc552d29f6333dc3"
          test "$(git hash-object registry/physics/singularity_gpt/r4b5a4b/result_archive.json)" = "81c757a19b6cf8799dd96fb01568544350ab6208"
          test "$(git hash-object registry/physics/singularity_gpt/r4b5a4c/protocol.json)" = "54f2757e215ae20c0ca9a5a47676aaac46b09c51"
          test "$(git hash-object registry/physics/singularity_gpt/r4b5a4c/audit.py)" = "1911be617c59edb554ff0a652ab4121b02efb5b8"
          python -m py_compile registry/physics/singularity_gpt/r4b5a4c/audit.py
      - name: Retrieve three sealed parent archives
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for id in 15221965959 15223003250 15224798158; do
            curl --fail --silent --show-error --location --header "Authorization: Bearer ${GH_TOKEN}" --header "Accept: application/vnd.github+json" --output "${RUNNER_TEMP}/${id}.zip" "https://api.github.com/repos/Hawkar-usls/janus-meta-registry/actions/artifacts/${id}/zip"
          done
          echo "257e16cdbdde7a847d573b77e4e1d1d594ee2199c600603325bca1cc43151f96  ${RUNNER_TEMP}/15221965959.zip" | sha256sum -c -
          echo "986a3036b75303e125575d20f8fe2152c6527f94e171d21284b4e40912bf9062  ${RUNNER_TEMP}/15223003250.zip" | sha256sum -c -
          echo "cdf700600ad29f88763c42b06d063367ae05fb45423fb262700236f528ed7408  ${RUNNER_TEMP}/15224798158.zip" | sha256sum -c -
      - name: Complete near-zero audit, subcell control and replicated thread factorial
        run: python registry/physics/singularity_gpt/r4b5a4c/audit.py "${RUNNER_TEMP}/15221965959.zip" "${RUNNER_TEMP}/15223003250.zip" "${RUNNER_TEMP}/15224798158.zip"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r4b5a4c-thread-attribution
          path: |
            r4b5a4c-output/
            !r4b5a4c-output/**/*.nbc
            !r4b5a4c-output/**/*.nbi
          if-no-files-found: warn
          retention-days: 30
