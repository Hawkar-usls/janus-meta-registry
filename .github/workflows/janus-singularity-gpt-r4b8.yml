name: JANUS R4B8 adaptive multistart
on:
  push:
    branches: [janus-singularity-gpt-r4b8-adaptive]
    paths:
      - 'registry/physics/singularity_gpt/r4b8/**'
      - '.github/workflows/janus-singularity-gpt-r4b8.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exam:
    strategy:
      fail-fast: false
      matrix:
        mode: [adaptive, forecast, profile]
        kind: [iid, long_memory, narrowband]
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            registry/physics/singularity_gpt/r4b2
            registry/physics/singularity_gpt/r4b3
            registry/physics/singularity_gpt/r4b5
            registry/physics/singularity_gpt/r4b7
            registry/physics/singularity_gpt/r4b8
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy==2.2.6 scipy==1.15.3
      - name: Frozen adaptive comparison
        env:
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
        run: python registry/physics/singularity_gpt/r4b8/examine.py ${{ matrix.mode }} ${{ matrix.kind }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r4b8-${{ matrix.mode }}-${{ matrix.kind }}
          path: r4b8-output/
          if-no-files-found: warn
          retention-days: 30
