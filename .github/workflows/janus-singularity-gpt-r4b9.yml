name: JANUS R4B9 calibrated identifiability
on:
  push:
    branches: [janus-singularity-gpt-r4b9-calibrated]
    paths:
      - 'registry/physics/singularity_gpt/r4b9/**'
      - '.github/workflows/janus-singularity-gpt-r4b9.yml'
  workflow_dispatch:
permissions:
  contents: read
env:
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
jobs:
  tangent-first:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            registry/physics/singularity_gpt/r4b2
            registry/physics/singularity_gpt/r4b3
            registry/physics/singularity_gpt/r4b5
            registry/physics/singularity_gpt/r4b7
            registry/physics/singularity_gpt/r4b8
            registry/physics/singularity_gpt/r4b8a
            registry/physics/singularity_gpt/r4b9
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy==2.2.6 scipy==1.15.3
      - run: python -m compileall -q registry/physics/singularity_gpt/r4b9
      - run: python registry/physics/singularity_gpt/r4b9/stress.py stress
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r4b9-tangent
          path: r4b9-output/
          if-no-files-found: warn
          retention-days: 30
  forecast:
    needs: tangent-first
    strategy:
      fail-fast: false
      matrix:
        kind: [iid, long_memory, narrowband]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            registry/physics/singularity_gpt/r4b2
            registry/physics/singularity_gpt/r4b3
            registry/physics/singularity_gpt/r4b5
            registry/physics/singularity_gpt/r4b7
            registry/physics/singularity_gpt/r4b8
            registry/physics/singularity_gpt/r4b8a
            registry/physics/singularity_gpt/r4b9
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy==2.2.6 scipy==1.15.3
      - run: python -m compileall -q registry/physics/singularity_gpt/r4b9
      - run: python registry/physics/singularity_gpt/r4b9/stress.py forecast ${{ matrix.kind }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r4b9-forecast-${{ matrix.kind }}
          path: r4b9-output/
          if-no-files-found: warn
          retention-days: 30
  calibration:
    needs: tangent-first
    strategy:
      fail-fast: false
      matrix:
        kind: [iid, long_memory, narrowband]
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            registry/physics/singularity_gpt/r4b2
            registry/physics/singularity_gpt/r4b3
            registry/physics/singularity_gpt/r4b5
            registry/physics/singularity_gpt/r4b7
            registry/physics/singularity_gpt/r4b8
            registry/physics/singularity_gpt/r4b8a
            registry/physics/singularity_gpt/r4b9
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy==2.2.6 scipy==1.15.3
      - run: python -m compileall -q registry/physics/singularity_gpt/r4b9
      - run: python registry/physics/singularity_gpt/r4b9/calibrate.py calibrate ${{ matrix.kind }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r4b9-calibration-${{ matrix.kind }}
          path: r4b9-output/
          if-no-files-found: warn
          retention-days: 30
  freeze-threshold:
    needs: calibration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            registry/physics/singularity_gpt/r4b2
            registry/physics/singularity_gpt/r4b3
            registry/physics/singularity_gpt/r4b5
            registry/physics/singularity_gpt/r4b7
            registry/physics/singularity_gpt/r4b8
            registry/physics/singularity_gpt/r4b8a
            registry/physics/singularity_gpt/r4b9
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy==2.2.6 scipy==1.15.3
      - run: python -m compileall -q registry/physics/singularity_gpt/r4b9
      - uses: actions/download-artifact@v4
        with:
          pattern: r4b9-calibration-*
          path: calibration-input
      - run: python registry/physics/singularity_gpt/r4b9/calibrate.py aggregate calibration-input
      - run: cd r4b9-output && sha256sum frozen_threshold.json > frozen_threshold.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: r4b9-frozen-threshold
          path: |
            r4b9-output/frozen_threshold.json
            r4b9-output/frozen_threshold.sha256
          retention-days: 30
  evaluation:
    needs: freeze-threshold
    strategy:
      fail-fast: false
      matrix:
        kind: [iid, long_memory, narrowband]
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            registry/physics/singularity_gpt/r4b2
            registry/physics/singularity_gpt/r4b3
            registry/physics/singularity_gpt/r4b5
            registry/physics/singularity_gpt/r4b7
            registry/physics/singularity_gpt/r4b8
            registry/physics/singularity_gpt/r4b8a
            registry/physics/singularity_gpt/r4b9
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy==2.2.6 scipy==1.15.3
      - run: python -m compileall -q registry/physics/singularity_gpt/r4b9
      - uses: actions/download-artifact@v4
        with:
          name: r4b9-frozen-threshold
          path: frozen
      - run: cd frozen && sha256sum -c frozen_threshold.sha256
      - run: python registry/physics/singularity_gpt/r4b9/calibrate.py evaluate ${{ matrix.kind }} frozen/frozen_threshold.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r4b9-evaluation-${{ matrix.kind }}
          path: r4b9-output/
          if-no-files-found: warn
          retention-days: 30
