name: JANUS autonomous site curator

on:
  push:
    branches: [main]
    paths:
      - '**/*.json'
      - '**/*.md'
      - '**/*.py'
      - 'assets/site-curator.js'
      - 'assets/site-curator.css'
      - '.github/workflows/janus-site-autonomous-curator.yml'
      - '!assets/site-feed.json'
      - '!assets/hrain-registry-index.json'
      - '!guestbook/**'
  pull_request:
    paths:
      - '**/*.json'
      - '**/*.md'
      - '**/*.py'
      - 'assets/site-curator.js'
      - 'assets/site-curator.css'
      - '.github/workflows/janus-site-autonomous-curator.yml'
      - '!assets/site-feed.json'
      - '!assets/hrain-registry-index.json'
      - '!guestbook/**'
  workflow_dispatch:

concurrency:
  group: janus-autonomous-site-curator
  cancel-in-progress: true

permissions:
  contents: write
  pages: write

jobs:
  validate-or-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || 'main' }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate curator, HRaiN export, and append-only interface policy
        run: |
          python -m py_compile research/site/janus_site_curator.py
          python -m py_compile research/site/janus_hrain_registry_export.py
          node --check assets/site-curator.js
          python -m json.tool data/JANUS-SITE-CURATOR-POLICY-v1.2.json >/dev/null
          python -m json.tool data/JANUS-HRAIN-META-REGISTRY-BRIDGE-v1.1.json >/dev/null
          python research/site/janus_site_curator.py --output /tmp/janus-site-feed.json
          python research/site/janus_hrain_registry_export.py --output /tmp/hrain-registry-index.json
          python -m json.tool /tmp/janus-site-feed.json >/dev/null
          python -m json.tool /tmp/hrain-registry-index.json >/dev/null
          python - <<'PY'
          import json
          from pathlib import Path

          feed = json.loads(Path('/tmp/janus-site-feed.json').read_text(encoding='utf-8'))
          hrain = json.loads(Path('/tmp/hrain-registry-index.json').read_text(encoding='utf-8'))
          policy = json.loads(Path('data/JANUS-SITE-CURATOR-POLICY-v1.2.json').read_text(encoding='utf-8'))
          bridge = json.loads(Path('data/JANUS-HRAIN-META-REGISTRY-BRIDGE-v1.1.json').read_text(encoding='utf-8'))

          assert feed['schema'] == 'janus.site.activity_feed.v1_2'
          assert feed['policy'] == 'data/JANUS-SITE-CURATOR-POLICY-v1.2.json'
          assert feed['candidate_count'] > 0
          assert feed['latest_updates']
          assert feed['spotlight']
          assert policy['routing']['full_content_mentions_may_route'] is False
          assert policy['ranking']['full_content_mentions_may_score'] is False
          assert policy['ranking']['status_valence_used'] is False
          assert policy['ranking']['positive_result_bonus'] == 0
          assert policy['ranking']['negative_result_penalty'] == 0
          assert policy['ranking']['null_result_penalty'] == 0
          assert policy['spotlight']['deduplicate_lineages'] is True
          assert policy['autonomy_boundary']['may_rewrite_scientific_source_objects'] is False
          assert policy['autonomy_boundary']['may_raise_claim_ceiling'] is False

          spotlight = feed['spotlight']
          lineages = [x['lineage_key'] for x in spotlight]
          assert len(lineages) == len(set(lineages)), 'duplicate lineage in Spotlight'
          assert all(x['path'] not in {'README.md', 'PROJECT_STATUS.json', 'data/INDEX.md'} for x in spotlight)
          assert 'NEWEST_LINEAGE_REPRESENTATIVE != BEST_SCIENTIFIC_RESULT' in feed['claim_ceiling']

          assert hrain['schema'] == 'janus.hrain.registry_graph_index.v1_0'
          assert hrain['objectCount'] == feed['candidate_count']
          assert hrain['nodes'][0]['id'] == 'registry:janus-meta-registry'
          assert all(node.get('readOnly') is True for node in hrain['nodes'])
          assert all(node.get('deleteAllowed') is False for node in hrain['nodes'])
          mutation = hrain['mutationPolicy']
          assert mutation['interfaceWriteAuthority'] is False
          assert mutation['interfaceDeleteAuthority'] is False
          assert mutation['appendOnlyFromInterface'] is True
          assert mutation['sourceMutationEndpoint'] is None
          assert mutation['wipeSemantics'] == 'LOCAL_VIEW_OR_WORKSPACE_RESET_ONLY'
          assert 'HRAIN_GRAPH != REGISTRY_AUTHORITY' in hrain['claimCeiling']
          assert 'HRAIN_WIPE != REGISTRY_DELETE' in hrain['claimCeiling']
          assert 'INTERFACE_DELETE_AUTHORITY = NONE' in hrain['claimCeiling']

          assert bridge['status'] == 'ACTIVE_PRODUCTION_BRIDGE_WITH_INTERFACE_DELETION_FIREWALL'
          assert bridge['data_contract']['writes_back_to_registry'] is False
          assert bridge['data_contract']['deletes_from_registry'] is False
          assert bridge['data_contract']['source_mutation_endpoint_exposed'] is False
          firewall = bridge['interface_deletion_firewall']
          assert firewall['hrain_write_authority'] is False
          assert firewall['hrain_delete_authority'] is False
          assert firewall['inaihr_write_authority'] is False
          assert firewall['inaihr_delete_authority'] is False
          assert firewall['append_only_from_interface_perspective'] is True
          assert firewall['future_ui_may_promote_wipe_to_registry_delete'] is False
          assert bridge['network']['hrain'] == 'https://hawkar-usls.github.io/Hrain/janus.html'

          js = Path('assets/site-curator.js').read_text(encoding='utf-8')
          css = Path('assets/site-curator.css').read_text(encoding='utf-8')
          assert 'https://hawkar-usls.github.io/Hrain/janus.html' in js
          assert 'https://hawkar-usls.github.io/iNaiHR/' in js
          assert 'janus-network-hrain' in js and 'janus-network-inaihr' in js
          assert 'grid-template-areas' in css and 'janus-network-hrain' in css

          print('JANUS_CURATOR_DRY_RUN=PASS')
          print('JANUS_CURATOR_SOURCE_REWRITE=FORBIDDEN')
          print('JANUS_HRAIN_BRIDGE_INDEX=PASS')
          print('JANUS_HRAIN_INTERFACE_WRITE_AUTHORITY=NONE')
          print('JANUS_HRAIN_INTERFACE_DELETE_AUTHORITY=NONE')
          print('JANUS_HRAIN_WIPE_SEMANTICS=LOCAL_ONLY')
          print('JANUS_NETWORK_NAV=PASS')
          PY

      - name: Refresh generated feeds on main
        if: github.event_name != 'pull_request'
        id: refresh
        run: |
          git fetch origin main
          git reset --hard origin/main
          python research/site/janus_site_curator.py --output assets/site-feed.json
          python research/site/janus_hrain_registry_export.py --output assets/hrain-registry-index.json
          python -m json.tool assets/site-feed.json >/dev/null
          python -m json.tool assets/hrain-registry-index.json >/dev/null

          if [ -z "$(git status --porcelain -- assets/site-feed.json assets/hrain-registry-index.json)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "JANUS_CURATOR_FEED_CHANGE=NONE"
            exit 0
          fi

          git config user.name "JANUS Site Curator"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/site-feed.json assets/hrain-registry-index.json
          git commit -m "chore(site): JANUS curator refresh"
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "JANUS_CURATOR_FEED_CHANGE=COMMITTED"

      - name: Request Pages rebuild for curator commit
        if: github.event_name != 'pull_request' && steps.refresh.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api \
            --method POST \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "repos/${GITHUB_REPOSITORY}/pages/builds" >/tmp/pages-build.json
          cat /tmp/pages-build.json
          echo "JANUS_CURATOR_PAGES_REBUILD=REQUESTED"
