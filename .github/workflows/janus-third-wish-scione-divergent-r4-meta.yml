name: JANUS Third Wish SciOne R4 append-only meta-registration

on:
  pull_request:
    branches:
      - research/third-wish-scione-causal-memory-r3-2026-10-19
    paths:
      - "registry/experimental/JANUS-GENESIS-THIRD-WISH-SCIONE-DIVERGENT-R4-2026-10-19-v1.0.json"
      - "tests/test_third_wish_scione_divergent_r4_meta.py"
      - ".github/workflows/janus-third-wish-scione-divergent-r4-meta.yml"

permissions:
  contents: read

jobs:
  append-only-r4-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate R4 registration and previous Third Wish research
        run: |
          python -m json.tool registry/experimental/JANUS-GENESIS-THIRD-WISH-SCIONE-DIVERGENT-R4-2026-10-19-v1.0.json >/dev/null
          python -m unittest -v \
            tests.test_third_wish_scione_divergent_r4_meta \
            tests.test_third_wish_scione_causal_r3_meta \
            tests.test_third_wish_scione_inverse_r2_meta_extension
      - name: Reject credentials and automatic production triggers
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path('.github/workflows/janus-third-wish-scione-divergent-r4-meta.yml').read_text()
          assert 'contents: read' in text
          assert 'persist-credentials: false' in text
          assert ('${' + '{ secrets.') not in text
          assert ('workflow_' + 'dispatch:') not in text
          assert ('sche' + 'dule:') not in text
          print('R4_META_APPEND_ONLY_NO_WORLD_GRANT=PASS')
          PY
