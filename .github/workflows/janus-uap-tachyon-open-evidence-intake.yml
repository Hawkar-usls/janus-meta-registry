name: JANUS UAP Tachyon open evidence intake
on:
  push:
    branches: [research/uap-tachyon-open-evidence-20261128]
    paths:
      - 'registry/uap/JANUS-UAP-TACHYON-OPEN-EVIDENCE-CATALOG-2026-11-28-v1.0.json'
      - 'research/uap_poss1/janus_uap_tachyon_open_evidence_intake.py'
      - '.github/workflows/janus-uap-tachyon-open-evidence-intake.yml'
permissions:
  contents: read
jobs:
  intake:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Acquire bounded public metadata and controls
        run: |
          set -euo pipefail
          python research/uap_poss1/janus_uap_tachyon_open_evidence_intake.py | tee /tmp/open-evidence-summary.json
      - uses: actions/upload-artifact@v4
        with:
          name: janus-open-evidence-intake
          path: |
            /tmp/open-evidence-summary.json
            registry/uap/JANUS-UAP-TACHYON-OPEN-EVIDENCE-ACQUISITION-2026-11-28-v1.0.json
          if-no-files-found: error
  publish:
    needs: intake
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: janus-open-evidence-intake
          path: /tmp/evidence
      - name: Publish only acquisition receipt
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          f="$(find /tmp/evidence -name 'JANUS-UAP-TACHYON-OPEN-EVIDENCE-ACQUISITION-2026-11-28-v1.0.json' -type f)"
          test -f "$f"
          python -m json.tool "$f" >/dev/null
          cp "$f" 'registry/uap/JANUS-UAP-TACHYON-OPEN-EVIDENCE-ACQUISITION-2026-11-28-v1.0.json'
          git add -- 'registry/uap/JANUS-UAP-TACHYON-OPEN-EVIDENCE-ACQUISITION-2026-11-28-v1.0.json'
          git config user.name "JANUS Open Evidence Intake"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "JANUS: open UAP and timing-control metadata acquisition receipt"
          git push origin HEAD:refs/heads/research/uap-tachyon-open-evidence-20261128
