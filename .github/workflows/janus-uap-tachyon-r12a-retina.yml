name: JANUS UAP Tachyon R1.2A native RETINA
on:
  push:
    branches: [research/uap-tachyon-r12a-retina-native-20261128]
    paths:
      - 'research/uap_poss1/janus_uap_tachyon_r12a_retina.py'
      - '.github/workflows/janus-uap-tachyon-r12a-retina.yml'
permissions:
  contents: read
jobs:
  exam:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==2.2.6 scipy==1.15.3 scikit-learn==1.6.1
      - name: Execute native pinned radio scorer
        run: python research/uap_poss1/janus_uap_tachyon_r12a_retina.py
      - uses: actions/upload-artifact@v4
        with:
          name: janus-r12a-native-retina
          path: registry/uap/JANUS-UAP-TACHYON-R1.2A-RETINA-NATIVE-RESULT-2026-11-28-v1.0.json
          if-no-files-found: error
  publish:
    needs: exam
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: janus-r12a-native-retina
          path: /tmp/r12a
      - run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          f="$(find /tmp/r12a -name 'JANUS-UAP-TACHYON-R1.2A-RETINA-NATIVE-RESULT-2026-11-28-v1.0.json' -type f)"
          test -f "$f"
          python3 -m json.tool "$f" >/dev/null
          cp "$f" 'registry/uap/JANUS-UAP-TACHYON-R1.2A-RETINA-NATIVE-RESULT-2026-11-28-v1.0.json'
          git add -- 'registry/uap/JANUS-UAP-TACHYON-R1.2A-RETINA-NATIVE-RESULT-2026-11-28-v1.0.json'
          git config user.name "JANUS native RETINA R1.2A"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "JANUS R1.2A native RETINA: synthetic transfer receipt"
          git push origin HEAD:refs/heads/research/uap-tachyon-r12a-retina-native-20261128
