name: JANUS UAP Tachyon R1.3 reverse 5D
on:
  push:
    branches: [research/uap-tachyon-r13-reverse-5d-20261128]
    paths:
      - 'research/uap_poss1/janus_uap_tachyon_r13_reverse_5d.py'
      - '.github/workflows/janus-uap-tachyon-r13-reverse-5d.yml'
permissions:
  contents: read
jobs:
  exam:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 3
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install fixed wheels
        run: |
          python -m pip install --only-binary=:all: numpy==2.2.6 scipy==1.15.3 scikit-learn==1.6.1 h5py==3.13.0
      - name: Run frozen reverse and spiral
        run: |
          set -euo pipefail
          python research/uap_poss1/janus_uap_tachyon_r13_reverse_5d.py | tee /tmp/r13-summary.json
      - uses: actions/upload-artifact@v4
        with:
          name: janus-r13-reverse-5d
          path: |
            /tmp/r13-summary.json
            registry/uap/JANUS-UAP-TACHYON-R1.3-REVERSE-5D-RESULT-2026-11-28-v1.0.json
          if-no-files-found: error
  publish:
    needs: exam
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: janus-r13-reverse-5d
          path: /tmp/r13
      - run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          f="$(find /tmp/r13 -name 'JANUS-UAP-TACHYON-R1.3-REVERSE-5D-RESULT-2026-11-28-v1.0.json' -type f)"
          test -f "$f"
          python -m json.tool "$f" >/dev/null
          cp "$f" 'registry/uap/JANUS-UAP-TACHYON-R1.3-REVERSE-5D-RESULT-2026-11-28-v1.0.json'
          git add -- 'registry/uap/JANUS-UAP-TACHYON-R1.3-REVERSE-5D-RESULT-2026-11-28-v1.0.json'
          git config user.name "JANUS Reverse 5D"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "JANUS R1.3 reverse 5D: source bound audit"
          git push origin HEAD:refs/heads/research/uap-tachyon-r13-reverse-5d-20261128
