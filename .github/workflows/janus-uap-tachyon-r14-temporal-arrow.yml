name: JANUS UAP Tachyon R1.4 temporal arrow RETINA
on:
  push:
    branches: [research/uap-tachyon-r14-temporal-arrow-20261128]
    paths:
      - 'research/uap_poss1/janus_uap_tachyon_r14_temporal_arrow.py'
      - '.github/workflows/janus-uap-tachyon-r14-temporal-arrow.yml'
permissions:
  contents: read
jobs:
  exam:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned wheels
        run: |
          python -m pip install --only-binary=:all: numpy==2.2.6 scipy==1.15.3 scikit-learn==1.6.1 h5py==3.13.0
      - name: Execute frozen directional shape and reconstruction audit
        run: |
          set -euo pipefail
          python research/uap_poss1/janus_uap_tachyon_r14_temporal_arrow.py | tee /tmp/r14-summary.json
      - uses: actions/upload-artifact@v4
        with:
          name: janus-r14-temporal-arrow
          path: |
            /tmp/r14-summary.json
            registry/uap/JANUS-UAP-TACHYON-R1.4-TEMPORAL-ARROW-RESULT-2026-11-28-v1.0.json
          if-no-files-found: error
  publish:
    needs: exam
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: janus-r14-temporal-arrow
          path: /tmp/r14
      - name: Publish only receipt to research branch
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          f="$(find /tmp/r14 -name 'JANUS-UAP-TACHYON-R1.4-TEMPORAL-ARROW-RESULT-2026-11-28-v1.0.json' -type f)"
          test -f "$f"
          python -m json.tool "$f" >/dev/null
          cp "$f" 'registry/uap/JANUS-UAP-TACHYON-R1.4-TEMPORAL-ARROW-RESULT-2026-11-28-v1.0.json'
          git add -- 'registry/uap/JANUS-UAP-TACHYON-R1.4-TEMPORAL-ARROW-RESULT-2026-11-28-v1.0.json'
          git config user.name "JANUS Temporal Arrow RETINA"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "JANUS R1.4: temporal arrow shadow audit receipt"
          git push origin HEAD:refs/heads/research/uap-tachyon-r14-temporal-arrow-20261128
