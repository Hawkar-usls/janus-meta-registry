name: JANUS UAP Tachyon R1.8D object identity recovery
on:
  push:
    branches: [research/uap-tachyon-r18d-object-identity-20261128]
    paths:
      - 'research/uap_poss1/janus_uap_tachyon_r18d_object_identity.py'
      - '.github/workflows/janus-uap-tachyon-r18d-object-identity.yml'
permissions:
  contents: read
jobs:
  exam:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install fixed dependencies
        run: |
          python -m pip install --only-binary=:all: numpy==2.2.6 pypdf==5.4.0 cryptography==45.0.7 opencv-python-headless==4.12.0.88
          command -v ffmpeg || { sudo apt-get update && sudo apt-get install -y ffmpeg; }
      - name: Execute fixed identity diagnostics
        run: |
          set -euo pipefail
          python research/uap_poss1/janus_uap_tachyon_r18d_object_identity.py | tee /tmp/r18d-summary.json
      - uses: actions/upload-artifact@v4
        with:
          name: r18d-identity
          path: |
            /tmp/r18d-summary.json
            registry/uap/JANUS-UAP-TACHYON-R1.8D-OBJECT-IDENTITY-RECOVERY-RESULT-2026-11-28-v1.0.json
          if-no-files-found: error
  publish:
    needs: exam
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: r18d-identity
          path: /tmp/r18d
      - name: Publish only receipt
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          f="$(find /tmp/r18d -name 'JANUS-UAP-TACHYON-R1.8D-OBJECT-IDENTITY-RECOVERY-RESULT-2026-11-28-v1.0.json' -type f)"
          test -f "$f"
          python -m json.tool "$f" >/dev/null
          cp "$f" 'registry/uap/JANUS-UAP-TACHYON-R1.8D-OBJECT-IDENTITY-RECOVERY-RESULT-2026-11-28-v1.0.json'
          git add -- 'registry/uap/JANUS-UAP-TACHYON-R1.8D-OBJECT-IDENTITY-RECOVERY-RESULT-2026-11-28-v1.0.json'
          git config user.name "JANUS Object Identity"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "JANUS R1.8D: object identity and low-texture diagnostics receipt"
          git push origin HEAD:refs/heads/research/uap-tachyon-r18d-object-identity-20261128
