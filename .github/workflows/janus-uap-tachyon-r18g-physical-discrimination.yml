name: JANUS UAP Tachyon R1.8G physical discrimination
on:
  push:
    branches: [research/uap-tachyon-r18g-physical-discrimination-20261128]
    paths:
      - 'research/uap_poss1/janus_uap_tachyon_r18g_physical_discrimination.py'
      - '.github/workflows/janus-uap-tachyon-r18g-physical-discrimination.yml'
permissions:
  contents: read
jobs:
  exam:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned dependencies
        run: |
          python -m pip install --only-binary=:all: numpy==2.2.6 opencv-python-headless==4.12.0.88 sympy==1.13.3
          command -v ffmpeg || { sudo apt-get update && sudo apt-get install -y ffmpeg; }
      - name: Execute physical discrimination
        run: |
          set -euo pipefail
          python research/uap_poss1/janus_uap_tachyon_r18g_physical_discrimination.py | tee /tmp/r18g-summary.json
      - uses: actions/upload-artifact@v4
        with:
          name: r18g-physical-discrimination
          path: |
            /tmp/r18g-summary.json
            registry/uap/JANUS-UAP-TACHYON-R1.8G-PHYSICAL-DISCRIMINATION-RESULT-2026-11-28-v1.0.json
          if-no-files-found: error
  publish:
    needs: exam
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: r18g-physical-discrimination
          path: /tmp/r18g
      - name: Publish receipt only
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          f="$(find /tmp/r18g -name 'JANUS-UAP-TACHYON-R1.8G-PHYSICAL-DISCRIMINATION-RESULT-2026-11-28-v1.0.json' -type f)"
          test -f "$f"
          python -m json.tool "$f" >/dev/null
          cp "$f" 'registry/uap/JANUS-UAP-TACHYON-R1.8G-PHYSICAL-DISCRIMINATION-RESULT-2026-11-28-v1.0.json'
          git add -- 'registry/uap/JANUS-UAP-TACHYON-R1.8G-PHYSICAL-DISCRIMINATION-RESULT-2026-11-28-v1.0.json'
          git config user.name "JANUS Physical Discrimination"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "JANUS R1.8G: physical discrimination receipt"
          git push origin HEAD:refs/heads/research/uap-tachyon-r18g-physical-discrimination-20261128
