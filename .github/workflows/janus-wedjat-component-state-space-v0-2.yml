name: JANUS Wedjat component state-space v0.2

on:
  pull_request:
    paths:
      - 'research/wedjat/wedjat_component_state_space_probe_v0_2.py'
      - 'research/wedjat/test_wedjat_component_state_space_probe_v0_2.py'
      - 'data/JANUS-WEDJAT-COMPONENT-STATE-SPACE-RESULT-2026-08-15-v0.2.json'
      - '.github/workflows/janus-wedjat-component-state-space-v0-2.yml'
  push:
    branches:
      - main
    paths:
      - 'research/wedjat/wedjat_component_state_space_probe_v0_2.py'
      - 'research/wedjat/test_wedjat_component_state_space_probe_v0_2.py'
      - 'data/JANUS-WEDJAT-COMPONENT-STATE-SPACE-RESULT-2026-08-15-v0.2.json'
      - '.github/workflows/janus-wedjat-component-state-space-v0-2.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-state-space-canaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Compile probe and tests
        run: |
          python -m py_compile \
            research/wedjat/wedjat_component_state_space_probe_v0_2.py \
            research/wedjat/test_wedjat_component_state_space_probe_v0_2.py
      - name: Run exact mathematical and Python canaries
        run: python research/wedjat/test_wedjat_component_state_space_probe_v0_2.py -v
      - name: Re-run non-image exact state-space probe
        run: |
          python research/wedjat/wedjat_component_state_space_probe_v0_2.py \
            --compact --out /tmp/wedjat-v0-2-no-image.json
      - name: Verify tracked result provenance and claim firewall
        run: |
          python - <<'PY'
          import hashlib, json
          code_path='research/wedjat/wedjat_component_state_space_probe_v0_2.py'
          result_path='data/JANUS-WEDJAT-COMPONENT-STATE-SPACE-RESULT-2026-08-15-v0.2.json'
          r=json.load(open(result_path,encoding='utf-8'))
          actual=hashlib.sha256(open(code_path,'rb').read()).hexdigest()
          assert r['code']['sha256']==actual
          assert r['status']=='SIX_BIT_STATE_SPACE_EXACT_IMAGE_HALVING_NOT_SUPPORTED'
          s=r['exact_state_space_result']
          assert s['state_count']==64
          assert s['unique_fraction_sums']==64
          assert s['exact_grid_complete_boolean'] is True
          assert s['bijection_verified_for_all_64_states'] is True
          assert s['all_constructed_python_binary_literals_execute_exactly'] is True
          c=r['controls']
          assert c['label_permutation_control']['permutations_checked']==720
          assert c['label_permutation_control']['all_numeric_state_spaces_equal_baseline'] is True
          assert c['leave_one_part_out_control']['unique_subset_sums_after_any_single_removal']==32
          assert c['duplicate_weight_control']['all_cases_have_subset_sum_collisions'] is True
          assert c['raw_ASCII_to_Python_control']['direct_raw_ASCII_decodes_to_general_Python'] is False
          e=r['epistemic_gate']
          for k in (
              'ancient_binary_encoding_established',
              'ancient_ASCII_encoding_established',
              'ancient_Python_or_programming_language_established',
              'historical_sensory_mapping_established_by_this_probe',
              'Linear_A_evidentiary_transfer',
          ):
              assert e[k] is False
          print('WEDJAT_V0_2_TRACKED_RESULT_FIREWALL_PASS')
          PY
