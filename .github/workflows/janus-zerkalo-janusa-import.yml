name: JANUS — Зеркало Януса, архив координат в Meta Registry
on:
  push:
    branches: [main]
    paths:
      - tools/janus_zerkalo_janusa_import.py
      - .github/workflows/janus-zerkalo-janusa-import.yml
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: janus-zerkalo-janusa-meta-atlas-import
  cancel-in-progress: false
jobs:
  import-atlas:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Prepare GitHub archive client
        run: |
          python -m py_compile tools/janus_zerkalo_janusa_import.py
          python -m pip install requests==2.32.3
      - name: Copy and SHA-verify 3,772 ICRS directions and 320 separate nonphysical projections
        run: python tools/janus_zerkalo_janusa_import.py
