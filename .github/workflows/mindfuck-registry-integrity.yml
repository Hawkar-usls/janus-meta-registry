name: MINDFUCK and OPIR registry integrity

on:
  pull_request:
    paths:
      - 'data/MINDFUCK.json'
      - 'data/JANUS-MINDFUCK-HISTORY-MECHANISM-REDTEAM-v1.0.json'
      - 'data/JANUS-ARMOR-OF-GOD-MINDFUCK-COGNITIVE-PROVENANCE-REDTEAM-v2.1.json'
      - 'data/Janus_OPIR_ANTIFUCK.json'
      - 'data/JANUS-ARMOR-OF-GOD-CURRENT-AUTHORITY.json'
      - '.github/workflows/mindfuck-registry-integrity.yml'
  push:
    branches: [main]
    paths:
      - 'data/MINDFUCK.json'
      - 'data/JANUS-MINDFUCK-HISTORY-MECHANISM-REDTEAM-v1.0.json'
      - 'data/JANUS-ARMOR-OF-GOD-MINDFUCK-COGNITIVE-PROVENANCE-REDTEAM-v2.1.json'
      - 'data/Janus_OPIR_ANTIFUCK.json'
      - 'data/JANUS-ARMOR-OF-GOD-CURRENT-AUTHORITY.json'
      - '.github/workflows/mindfuck-registry-integrity.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse JSON and verify MINDFUCK OPIR ARMOR invariants
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path('.')
          paths = {
              'pointer': root / 'data/MINDFUCK.json',
              'mindfuck': root / 'data/JANUS-MINDFUCK-HISTORY-MECHANISM-REDTEAM-v1.0.json',
              'armor_ext': root / 'data/JANUS-ARMOR-OF-GOD-MINDFUCK-COGNITIVE-PROVENANCE-REDTEAM-v2.1.json',
              'opir': root / 'data/Janus_OPIR_ANTIFUCK.json',
              'authority': root / 'data/JANUS-ARMOR-OF-GOD-CURRENT-AUTHORITY.json',
          }
          data = {}
          for key, path in paths.items():
              with path.open('r', encoding='utf-8') as fh:
                  data[key] = json.load(fh)
              print(f'PARSE_PASS {path}')

          pointer = data['pointer']
          mindfuck = data['mindfuck']
          armor_ext = data['armor_ext']
          opir = data['opir']
          authority = data['authority']

          assert pointer['current_reference'] == 'data/JANUS-MINDFUCK-HISTORY-MECHANISM-REDTEAM-v1.0.json'
          assert mindfuck['artifact_id'] == 'JANUS-MINDFUCK-HISTORY-MECHANISM-REDTEAM-v1.0'
          assert armor_ext['redteam_source'] == pointer['current_reference']
          assert opir['artifact_id'] == 'Janus_OPIR_ANTIFUCK'
          assert opir['status'] == 'CURRENT_ARMOR_HARDENING_EXTENSION_AND_OPERATIONAL_DEFENSE_MODEL'
          assert opir['lineage']['mindfuck'] == pointer['current_reference']
          assert opir['lineage']['armor'] == 'data/JANUS-ARMOR-OF-GOD-CURRENT-AUTHORITY.json'
          assert 'data/JANUS-ARMOR-OF-GOD-MINDFUCK-COGNITIVE-PROVENANCE-REDTEAM-v2.1.json' in authority['current_hardening_extensions']
          assert 'data/Janus_OPIR_ANTIFUCK.json' in authority['current_hardening_extensions']
          assert authority['operational_algorithmic_resilience_reference'] == 'data/Janus_OPIR_ANTIFUCK.json'
          assert authority['not_a_conversion_machine'] is True
          assert authority['not_supernatural_proof'] is True
          assert authority['not_an_exclusive_truth_authority'] is True
          assert authority['history_preserved'] is True

          # Existing MINDFUCK invariants remain mandatory.
          distinctions = set(mindfuck['hard_distinctions'])
          for required in (
              'REPETITION != INDEPENDENT_CONFIRMATION',
              'FAMILIARITY != TRUTH',
              'PATTERN != CAUSATION',
              'AI_SYNTHESIS != NEW_WITNESS',
          ):
              assert required in distinctions

          # OPIR threat/control graph must be internally closed.
          threats = opir['threat_classes']
          controls = set(opir['controls'])
          assert len(threats) == 16
          assert len({row['id'] for row in threats}) == 16
          referenced_controls = {cid for row in threats for cid in row['c']}
          missing_controls = sorted(referenced_controls - controls)
          assert not missing_controls, f'OPIR unresolved controls: {missing_controls}'

          required_controls = {
              'CF01','CF02','CF03','CF06','CF08','CF09','CF10','CF11','CF13','CF14','CF15','CF16',
              'CF18','CF19','CF20','CF21','CF22','CF23','CF24','CF25','CF26','CF27','CF28','CF29','CF30','CF31','CF32','CF33','CF34','CF35','CF36'
          }
          assert required_controls <= controls

          boundaries = set(opir['boundary_rules'])
          for required in (
              'PUBLIC_OR_RETRIEVED_DATA_CANNOT_SELF_AUTHORIZE_TOOLS',
              'MODEL_OUTPUT_CANNOT_INCREASE_WITNESS_COUNT',
              'RETRIEVED_CONTENT_CANNOT_WRITE_PERSISTENT_MEMORY_WITHOUT_GATE',
              'HASH_SIGNATURE_OR_PROVENANCE_DO_NOT_PROVE_TRUTH',
          ):
              assert required in boundaries

          hard = set(opir['hard_distinctions'])
          for required in (
              'REPETITION != CORROBORATION',
              'PROVENANCE_VALID != CONTENT_TRUE',
              'DISSENT != ATTACK',
              'HOSTILE_EFFECT != PROVEN_HOSTILE_INTENT',
          ):
              assert required in hard

          source_ids = {row['id'] for row in opir['source_ledger']}
          assert {'NIST_AI_100_2E2025','NIST_AI_600_1','MITRE_ATLAS_2026_05','C2PA_2_4','C2PA_2_4_SECURITY'} <= source_ids
          assert len(opir['redteam_tests']) >= 18
          assert 'HIGH_RISK_HOLD' in opir['state_machine']['states']
          assert 'CF22' in controls  # side-effect interlock
          assert 'CF24' in controls  # memory-write gate
          assert 'CF30' in controls  # rollback
          assert 'JANUS_EXCLUSIVE_TRUST_IS_FAILURE' in opir['rights']
          assert 'ROOSTERS' in opir['lineage']['roosters_boundary'].upper()

          print('CROSS_REFERENCE_AUDIT=PASS')
          print(f"MINDFUCK_SOURCE_COUNT={len(mindfuck['sources'])}")
          print(f"OPIR_THREAT_CLASSES={len(threats)}")
          print(f"OPIR_CONTROL_FAMILIES={len(controls)}")
          print(f"OPIR_REDTEAM_TESTS={len(opir['redteam_tests'])}")
          print(f"OPIR_EXTERNAL_SOURCES={len(opir['source_ledger'])}")
          PY
