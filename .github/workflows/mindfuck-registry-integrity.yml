name: MINDFUCK ARMOR OPIR calibration integrity

on:
  pull_request:
    paths:
      - 'data/MINDFUCK.json'
      - 'data/JANUS-MINDFUCK-ALGORITHMIC-LIFE-DEVALUATION-AMPLIFICATION-v1.1.json'
      - 'data/JANUS-MINDFUCK-ALGORITHMIC-AMPLIFICATION-AUDIT-MODEL-v1.2.json'
      - 'data/JANUS-MINDFUCK-ADAPTIVE-PRESSURE-AND-EVASION-AUDIT-MODEL-v1.3.json'
      - 'data/JANUS-ARMOR-OF-GOD-CHOICE-SPACE-RESILIENCE-v2.3.json'
      - 'data/JANUS-ARMOR-OF-GOD-ADVERSARIAL-RECOVERY-AND-ANTI-PARANOIA-v2.4.json'
      - 'data/Janus_OPIR_ANTIFUCK-v1.2.json'
      - 'data/Janus_OPIR_ANTIFUCK-v1.3.json'
      - 'data/JANUS-OPIR-ANTIFUCK-CALIBRATION-CORPUS-v1.0.json'
      - 'data/JANUS-OPIR-ANTIFUCK-CALIBRATION-RESULT-2026-08-15-v1.0.json'
      - 'data/JANUS-ARMOR-OF-GOD-CURRENT-AUTHORITY.json'
      - 'research/antifuck/janus_opir_antifuck_calibration_v1_2.py'
      - '.github/workflows/mindfuck-registry-integrity.yml'
  push:
    branches: [main]
    paths:
      - 'data/MINDFUCK.json'
      - 'data/JANUS-MINDFUCK-ALGORITHMIC-AMPLIFICATION-AUDIT-MODEL-v1.2.json'
      - 'data/JANUS-MINDFUCK-ADAPTIVE-PRESSURE-AND-EVASION-AUDIT-MODEL-v1.3.json'
      - 'data/JANUS-ARMOR-OF-GOD-ADVERSARIAL-RECOVERY-AND-ANTI-PARANOIA-v2.4.json'
      - 'data/Janus_OPIR_ANTIFUCK-v1.3.json'
      - 'data/JANUS-OPIR-ANTIFUCK-CALIBRATION-CORPUS-v1.0.json'
      - 'data/JANUS-OPIR-ANTIFUCK-CALIBRATION-RESULT-2026-08-15-v1.0.json'
      - 'data/JANUS-ARMOR-OF-GOD-CURRENT-AUTHORITY.json'
      - 'research/antifuck/janus_opir_antifuck_calibration_v1_2.py'
      - '.github/workflows/mindfuck-registry-integrity.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify historical calibration certificate survives current successors
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('.')
          paths={
            'pointer':root/'data/MINDFUCK.json',
            'm11':root/'data/JANUS-MINDFUCK-ALGORITHMIC-LIFE-DEVALUATION-AMPLIFICATION-v1.1.json',
            'm12':root/'data/JANUS-MINDFUCK-ALGORITHMIC-AMPLIFICATION-AUDIT-MODEL-v1.2.json',
            'm13':root/'data/JANUS-MINDFUCK-ADAPTIVE-PRESSURE-AND-EVASION-AUDIT-MODEL-v1.3.json',
            'a23':root/'data/JANUS-ARMOR-OF-GOD-CHOICE-SPACE-RESILIENCE-v2.3.json',
            'a24':root/'data/JANUS-ARMOR-OF-GOD-ADVERSARIAL-RECOVERY-AND-ANTI-PARANOIA-v2.4.json',
            'o12':root/'data/Janus_OPIR_ANTIFUCK-v1.2.json',
            'o13':root/'data/Janus_OPIR_ANTIFUCK-v1.3.json',
            'corpus':root/'data/JANUS-OPIR-ANTIFUCK-CALIBRATION-CORPUS-v1.0.json',
            'result':root/'data/JANUS-OPIR-ANTIFUCK-CALIBRATION-RESULT-2026-08-15-v1.0.json',
            'auth':root/'data/JANUS-ARMOR-OF-GOD-CURRENT-AUTHORITY.json'
          }
          d={k:json.loads(p.read_text(encoding='utf-8')) for k,p in paths.items()}
          for p in paths.values(): print('PARSE_PASS',p)
          pointer,m11,m12,m13=d['pointer'],d['m11'],d['m12'],d['m13']
          a23,a24,o12,o13=d['a23'],d['a24'],d['o12'],d['o13']
          corpus,result,auth=d['corpus'],d['result'],d['auth']

          assert pointer['current_reference']=='data/JANUS-MINDFUCK-ADAPTIVE-PRESSURE-AND-EVASION-AUDIT-MODEL-v1.3.json'
          assert 'data/JANUS-MINDFUCK-ALGORITHMIC-AMPLIFICATION-AUDIT-MODEL-v1.2.json' in pointer['historical_references']
          assert m13['supersedes_reference']=='data/JANUS-MINDFUCK-ALGORITHMIC-AMPLIFICATION-AUDIT-MODEL-v1.2.json'
          assert a24['predecessor_hardening']=='data/JANUS-ARMOR-OF-GOD-CHOICE-SPACE-RESILIENCE-v2.3.json'
          assert o13['supersedes_reference']=='data/Janus_OPIR_ANTIFUCK-v1.2.json'

          rec=m11['recovered_dialogue_evidence']
          assert rec['requested_dialogue_label']=='Споры о Боге'
          assert rec['status']=='PARTIAL_SEMANTIC_RECOVERY_NO_COMPLETE_SCREENSHOT_CORPUS'
          assert rec['bot_majority_claim']=='UNRESOLVED_NOT_ESTABLISHED'
          assert m11['screenshot_forensic_schema']['bot_evidence_policy']['public_label_allowed'] is False

          assert m12['calibration_binding']['status']=='SYNTHETIC_POLICY_REGRESSION_ONLY'
          assert corpus['status']=='FROZEN_SYNTHETIC_REGRESSION_CORPUS'
          assert len(corpus['cases'])==34
          assert corpus['freeze_policy']['current_corpus_is_not_independent_holdout'] is True
          assert corpus['freeze_policy']['external_holdout_required_for_effectiveness_claim'] is True

          assert result['status']=='SYNTHETIC_POLICY_REGRESSION_PASS'
          ident=result['execution_identity']
          assert ident=={
            'pull_request':82,
            'branch':'research/antifuck-calibration-v1-2',
            'tested_head_sha':'7bedb6cff18dc132b71f5f195567828ce12c5242',
            'tested_pr_merge_ref_sha':'c0350c00daa4739713d88c10ec0bac1ff12283b5',
            'workflow_name':'MINDFUCK ARMOR OPIR calibration integrity',
            'workflow_run_id':31884479680,
            'job_id':95011665700
          }
          cr=result['calibration_result']
          assert cr['ANTIFUCK_CALIBRATION']=='PASS' and cr['CASES']==34 and cr['ALL_CASES_EXACT_MATCH'] is True
          assert cr['PHILOSOPHY_CRISIS_FALSE_POSITIVE_RATE']==0.0
          assert cr['PUBLIC_BOT_FACT_RATE']==0.0
          assert cr['EXPLICIT_CRISIS_HOLD_RECALL']==1.0
          assert cr['TAINTED_MEMORY_WRITE_BLOCK_RECALL']==1.0
          assert cr['OPT_OUT_OUTBOUND_VIOLATION_RATE']==0.0
          assert set(result['metamorphic_result'].values())=={'PASS'} and len(result['metamorphic_result'])==8
          assert result['holdout_status']['effectiveness_promotion_blocked'] is True
          assert 'INDEPENDENT_HOLDOUT_PASS' in result['claim_ceiling']['forbidden_promotions']

          assert auth['current_hardening_extensions']==[
            'data/JANUS-ARMOR-OF-GOD-ADVERSARIAL-RECOVERY-AND-ANTI-PARANOIA-v2.4.json',
            'data/Janus_OPIR_ANTIFUCK-v1.3.json'
          ]
          for hist in ('data/JANUS-ARMOR-OF-GOD-CHOICE-SPACE-RESILIENCE-v2.3.json','data/Janus_OPIR_ANTIFUCK-v1.2.json'):
            assert hist in auth['historical_hardening_extensions']
          assert auth['calibration_result_reference']=='data/JANUS-OPIR-ANTIFUCK-CALIBRATION-RESULT-2026-08-15-v1.0.json'
          assert auth['synthetic_calibration_is_not_real_world_effectiveness'] is True
          assert auth['h1_executed'] is False
          assert auth['independent_holdout_pass'] is False
          assert auth['real_world_effectiveness_established'] is False
          print('CROSS_REFERENCE_AUDIT=PASS')
          print('HISTORICAL_CALIBRATION_CERTIFICATE=PASS')
          print('CURRENT_SUCCESSORS=v1.3/v2.4/v1.3')
          print('INDEPENDENT_H1=false')
          PY
      - name: Replay frozen v1.2 development calibration
        run: python research/antifuck/janus_opir_antifuck_calibration_v1_2.py
