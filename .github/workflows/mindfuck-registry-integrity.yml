name: MINDFUCK ARMOR OPIR life-safety integrity

on:
  pull_request:
    paths:
      - 'data/MINDFUCK.json'
      - 'data/JANUS-MINDFUCK-HISTORY-MECHANISM-REDTEAM-v1.0.json'
      - 'data/JANUS-MINDFUCK-ALGORITHMIC-LIFE-DEVALUATION-AMPLIFICATION-v1.1.json'
      - 'data/JANUS-ARMOR-OF-GOD-MINDFUCK-COGNITIVE-PROVENANCE-REDTEAM-v2.1.json'
      - 'data/JANUS-ARMOR-OF-GOD-LIFE-DEVALUATION-CRISIS-ALGORITHM-SHIELD-v2.2.json'
      - 'data/Janus_OPIR_ANTIFUCK.json'
      - 'data/Janus_OPIR_ANTIFUCK-v1.1.json'
      - 'data/JANUS-ARMOR-OF-GOD-CURRENT-AUTHORITY.json'
      - '.github/workflows/mindfuck-registry-integrity.yml'
  push:
    branches: [main]
    paths:
      - 'data/MINDFUCK.json'
      - 'data/JANUS-MINDFUCK-HISTORY-MECHANISM-REDTEAM-v1.0.json'
      - 'data/JANUS-MINDFUCK-ALGORITHMIC-LIFE-DEVALUATION-AMPLIFICATION-v1.1.json'
      - 'data/JANUS-ARMOR-OF-GOD-MINDFUCK-COGNITIVE-PROVENANCE-REDTEAM-v2.1.json'
      - 'data/JANUS-ARMOR-OF-GOD-LIFE-DEVALUATION-CRISIS-ALGORITHM-SHIELD-v2.2.json'
      - 'data/Janus_OPIR_ANTIFUCK.json'
      - 'data/Janus_OPIR_ANTIFUCK-v1.1.json'
      - 'data/JANUS-ARMOR-OF-GOD-CURRENT-AUTHORITY.json'
      - '.github/workflows/mindfuck-registry-integrity.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse JSON and verify impact counteraction technical invariants
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path('.')
          paths = {
              'pointer': root / 'data/MINDFUCK.json',
              'mind_old': root / 'data/JANUS-MINDFUCK-HISTORY-MECHANISM-REDTEAM-v1.0.json',
              'mind': root / 'data/JANUS-MINDFUCK-ALGORITHMIC-LIFE-DEVALUATION-AMPLIFICATION-v1.1.json',
              'armor_old': root / 'data/JANUS-ARMOR-OF-GOD-MINDFUCK-COGNITIVE-PROVENANCE-REDTEAM-v2.1.json',
              'armor': root / 'data/JANUS-ARMOR-OF-GOD-LIFE-DEVALUATION-CRISIS-ALGORITHM-SHIELD-v2.2.json',
              'opir_old': root / 'data/Janus_OPIR_ANTIFUCK.json',
              'opir': root / 'data/Janus_OPIR_ANTIFUCK-v1.1.json',
              'authority': root / 'data/JANUS-ARMOR-OF-GOD-CURRENT-AUTHORITY.json',
          }
          data = {}
          for key, path in paths.items():
              with path.open('r', encoding='utf-8') as fh:
                  data[key] = json.load(fh)
              print(f'PARSE_PASS {path}')

          pointer = data['pointer']
          mind = data['mind']
          armor = data['armor']
          opir = data['opir']
          authority = data['authority']

          # Preservation + successor authority.
          assert pointer['current_reference'] == 'data/JANUS-MINDFUCK-ALGORITHMIC-LIFE-DEVALUATION-AMPLIFICATION-v1.1.json'
          assert 'data/JANUS-MINDFUCK-HISTORY-MECHANISM-REDTEAM-v1.0.json' in pointer['historical_references']
          assert mind['supersedes_reference'] == 'data/JANUS-MINDFUCK-HISTORY-MECHANISM-REDTEAM-v1.0.json'
          assert armor['predecessor_hardening'] == 'data/JANUS-ARMOR-OF-GOD-MINDFUCK-COGNITIVE-PROVENANCE-REDTEAM-v2.1.json'
          assert opir['supersedes_reference'] == 'data/Janus_OPIR_ANTIFUCK.json'
          assert authority['history_preserved'] is True

          # Three-line model is explicit and cross-bound.
          triad = mind['three_line_model']
          assert {'impact','counteraction','technical'} <= set(triad)
          assert armor['redteam_source'] == pointer['current_reference']
          assert armor['technical_counterpart'] == 'data/Janus_OPIR_ANTIFUCK-v1.1.json'
          assert opir['lineage']['mindfuck'] == pointer['current_reference']
          assert opir['lineage']['armor_life_shield'] == 'data/JANUS-ARMOR-OF-GOD-LIFE-DEVALUATION-CRISIS-ALGORITHM-SHIELD-v2.2.json'

          # Old-dialogue recovery ceiling must remain explicit.
          recovery = mind['recovered_dialogue_evidence']
          assert recovery['requested_dialogue_label'] == 'Споры о Боге'
          assert recovery['status'] == 'PARTIAL_SEMANTIC_RECOVERY_NO_COMPLETE_SCREENSHOT_CORPUS'
          assert recovery['bot_majority_claim'] == 'UNRESOLVED_NOT_ESTABLISHED'
          assert mind['screenshot_forensic_schema']['bot_evidence_policy']['public_label_allowed'] is False

          # Core epistemic boundaries.
          hard = set(mind['hard_distinctions'])
          for required in (
              'NIHILISM != SUICIDALITY',
              'ALGORITHMIC_EXPOSURE != PROVEN_CAUSATION',
              'HOSTILE_EFFECT != PROVEN_HOSTILE_INTENT',
              'BOT_LIKELIHOOD != BOT_FACT',
              'PROTECTIVE_CONTENT != GUARANTEED_PREVENTION',
          ):
              assert required in hard

          # Scientific/public-health source ledger resolves every source_id used by new atoms.
          source_ids = {row['source_id'] for row in mind['source_ledger']}
          required_sources = {
              'NATURE_MH_BEAR_2026','ARENDT_SCHERR_ROMER_2019','JAMA_ADDICTIVE_SOCIAL_MEDIA_TRAJECTORIES',
              'TWITTER_PREVENTION_7M','WHO_MEDIA_2023','WHO_MHGAP_MEDIA'
          }
          assert required_sources <= source_ids
          referenced = {sid for atom in mind['mechanism_atoms'] for sid in atom.get('source_ids', [])}
          assert referenced <= source_ids
          assert len(mind['mechanism_atoms']) >= 8

          # ARMOR must separate philosophy from crisis and reject coercive optimism/bot accusation.
          armor_rules = set(armor['hard_rules'])
          for required in (
              'NIHILISM != SUICIDALITY.',
              'CRISIS != DEBATE_OPPORTUNITY.',
              'PROTECTING_LIFE != FORCED_OPTIMISM.',
              'BOT_SUSPICION != PUBLIC_ACCUSATION.',
              'THEOLOGY != MEDICAL_TREATMENT.',
          ):
              assert required in armor_rules
          assert set(armor['response_classes']) == {
              'L0_PHILOSOPHICAL_NIHILISM','L1_DISTRESS_WITHOUT_SELF_HARM_INTENT',
              'L2_SELF_HARM_CONTENT_OR_AMBIGUOUS_RISK','L3_EXPLICIT_SELF_HARM_INTENT_OR_TIMEFRAME'
          }
          assert len(armor['redteam_tests']) >= 12

          # OPIR v1.1 must inherit exact base counts and close every new threat/control edge.
          base = opir['base_inheritance']
          assert base['threat_classes'] == 16
          assert base['control_families'] == 34
          assert len(base['base_control_ids']) == 34
          threats = opir['new_threat_classes']
          new_controls = set(opir['new_controls'])
          all_controls = set(base['base_control_ids']) | new_controls
          assert len(threats) == 8
          assert len({row['id'] for row in threats}) == 8
          assert len(new_controls) == 18
          refs = {cid for row in threats for cid in row['c']}
          missing = sorted(refs - all_controls)
          assert not missing, f'Unresolved OPIR controls: {missing}'
          for required in ('CF40','CF41','CF44','CF48','CF49','CF50','CF51','CF52','CF53','CF54'):
              assert required in new_controls
          assert opir['screenshot_case_schema']['public_accusation_permitted'] is False
          assert 'CRISIS_SAFE_HOLD' in opir['state_machine']['states']
          assert 'COORDINATION_UNRESOLVED' in opir['state_machine']['states']
          assert len(opir['redteam_tests']) >= 12

          # Current ARMOR authority must point only to successors, with predecessors preserved as history.
          assert authority['current_hardening_extensions'] == [
              'data/JANUS-ARMOR-OF-GOD-LIFE-DEVALUATION-CRISIS-ALGORITHM-SHIELD-v2.2.json',
              'data/Janus_OPIR_ANTIFUCK-v1.1.json'
          ]
          assert 'data/JANUS-ARMOR-OF-GOD-MINDFUCK-COGNITIVE-PROVENANCE-REDTEAM-v2.1.json' in authority['historical_hardening_extensions']
          assert 'data/Janus_OPIR_ANTIFUCK.json' in authority['historical_hardening_extensions']
          assert authority['life_devaluation_crisis_reference'] == 'data/JANUS-ARMOR-OF-GOD-LIFE-DEVALUATION-CRISIS-ALGORITHM-SHIELD-v2.2.json'
          assert authority['operational_algorithmic_resilience_reference'] == 'data/Janus_OPIR_ANTIFUCK-v1.1.json'
          assert authority['not_a_conversion_machine'] is True
          assert authority['not_an_exclusive_truth_authority'] is True
          assert authority['not_a_diagnostic_system'] is True
          assert authority['not_a_bot_accusation_engine'] is True

          print('CROSS_REFERENCE_AUDIT=PASS')
          print(f"MINDFUCK_NEW_MECHANISMS={len(mind['mechanism_atoms'])}")
          print(f"MINDFUCK_SOURCES={len(mind['source_ledger'])}")
          print(f"ARMOR_RESPONSE_CLASSES={len(armor['response_classes'])}")
          print(f"ARMOR_REDTEAM_TESTS={len(armor['redteam_tests'])}")
          print(f"OPIR_INHERITED_THREATS={base['threat_classes']}")
          print(f"OPIR_NEW_THREATS={len(threats)}")
          print(f"OPIR_INHERITED_CONTROLS={base['control_families']}")
          print(f"OPIR_NEW_CONTROLS={len(new_controls)}")
          print(f"OPIR_NEW_REDTEAM_TESTS={len(opir['redteam_tests'])}")
          PY
