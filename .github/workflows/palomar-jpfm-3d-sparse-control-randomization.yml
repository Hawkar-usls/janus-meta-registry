name: Palomar JPFM-3D sparse-control randomization
on:
  workflow_dispatch:
  push:
    paths:
      - 'data/JANUS-PALOMAR-JPFM-3D-SPARSE-CONTROL-RANDOMIZATION-ADMISSION-v1.0.json'
      - 'tools/palomar/jpfm_3d_sparse_control_randomization.py'
      - '.github/workflows/palomar-jpfm-3d-sparse-control-randomization.yml'
permissions:
  contents: write
jobs:
  jpfm-3d:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install frozen environment
        run: python -m pip install numpy==2.2.6 pandas==2.3.1 scipy==1.16.1 statsmodels==0.14.5 requests==2.32.4
      - name: Syntax gate
        run: |
          python -m py_compile tools/palomar/jpfm_open_reconstruction_temporal.py
          python -m py_compile tools/palomar/jpfm_schedule_confound_decomposition.py
          python -m py_compile tools/palomar/jpfm_3d_sparse_control_randomization.py
      - name: Verify 3D admission
        run: |
          python - <<'PY'
          import json,pathlib
          d=json.loads(pathlib.Path('data/JANUS-PALOMAR-JPFM-3D-SPARSE-CONTROL-RANDOMIZATION-ADMISSION-v1.0.json').read_text())
          assert d['status']=='PREREGISTERED_POST_3C_IDENTIFIABILITY_REPAIR_BEFORE_3D_OUTCOME'
          assert d['frozen_cohort']['solar_patrol_minimum_minutes']==720
          assert d['primary_null']['method']=='exact year-stratified label permutation'
          assert d['sensitivity']['solar_patrol_minimum_minutes']==360
          print('PASS_3D_ADMISSION_GATE')
          PY
      - name: Execute exact finite-sample repair
        run: |
          mkdir -p out
          python tools/palomar/jpfm_3d_sparse_control_randomization.py --out out/JANUS-PALOMAR-JPFM-3D-SPARSE-CONTROL-RANDOMIZATION-RUN-001.json
      - name: Validate result
        run: |
          python - <<'PY'
          import json,pathlib
          d=json.loads(pathlib.Path('out/JANUS-PALOMAR-JPFM-3D-SPARSE-CONTROL-RANDOMIZATION-RUN-001.json').read_text())
          assert d['status']=='EXECUTED'
          assert d['primary_720']['coverage_minutes']==720
          assert d['sensitivity_360']['coverage_minutes']==360
          assert d['aggregate_verdict']['code'] in {'NEGATIVE_HALPHA_POSS_PATTERN_RETAINED_AFTER_SPARSE_CONTROL_REPAIR','NEGATIVE_HALPHA_POSS_PATTERN_NOT_RETAINED_AFTER_SPARSE_CONTROL_REPAIR'}
          assert d['current_authority_changed'] is False
          print('PASS_3D_RESULT_GATE')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: jpfm-3d-sparse-control-randomization-run-001
          path: out/JANUS-PALOMAR-JPFM-3D-SPARSE-CONTROL-RANDOMIZATION-RUN-001.json
          retention-days: 30
          if-no-files-found: error
      - name: Commit validated result
        run: |
          cp out/JANUS-PALOMAR-JPFM-3D-SPARSE-CONTROL-RANDOMIZATION-RUN-001.json data/JANUS-PALOMAR-JPFM-3D-SPARSE-CONTROL-RANDOMIZATION-RUN-001.json
          git config user.name 'janus-jpfm-ci'
          git config user.email 'actions@users.noreply.github.com'
          git add data/JANUS-PALOMAR-JPFM-3D-SPARSE-CONTROL-RANDOMIZATION-RUN-001.json
          git diff --cached --quiet && exit 0
          git commit -m 'Add JPFM-3D sparse-control randomization result [skip ci]'
          git pull --rebase origin main
          git push
