name: Palomar JPFM-4A GCAT source schema probe
on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/palomar/jpfm_4a_gcat_source_schema_probe.py'
      - '.github/workflows/palomar-jpfm-4a-gcat-source-schema-probe.yml'
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install requests==2.32.4
      - run: python -m py_compile tools/palomar/jpfm_4a_gcat_source_schema_probe.py
      - name: Freeze GCAT row-oriented sources
        run: |
          mkdir -p out
          python tools/palomar/jpfm_4a_gcat_source_schema_probe.py \
            --out out/JANUS-PALOMAR-JPFM-4A-GCAT-ROW-SOURCE-SCHEMA-PROBE-v1.0.json
      - name: Validate source-only GCAT receipt
        run: |
          python - <<'PY'
          import json,pathlib
          d=json.loads(pathlib.Path('out/JANUS-PALOMAR-JPFM-4A-GCAT-ROW-SOURCE-SCHEMA-PROBE-v1.0.json').read_text())
          assert d['status']=='INDEPENDENT_CURATED_GCAT_ROW_SOURCES_FROZEN__SCHEMA_PROBED__NO_OUTCOME_JOIN'
          assert d['files']['launch_tsv']['parsed_row_count']>0
          assert d['files']['rcat_tsv']['parsed_row_count']>0
          assert len(d['files']['launch_tsv']['header'])>=3
          assert len(d['files']['rcat_tsv']['header'])>=3
          assert d['outcome_blindness']['bluebook_access'] is False
          assert d['outcome_blindness']['poss1_access'] is False
          assert d['outcome_blindness']['association_computed'] is False
          assert d['current_authority_changed'] is False
          print('PASS_GCAT_SOURCE_SCHEMA_GATE')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: jpfm-4a-gcat-row-source-schema-probe-v1
          path: out/JANUS-PALOMAR-JPFM-4A-GCAT-ROW-SOURCE-SCHEMA-PROBE-v1.0.json
          retention-days: 30
          if-no-files-found: error
      - name: Commit source-only GCAT receipt
        run: |
          cp out/JANUS-PALOMAR-JPFM-4A-GCAT-ROW-SOURCE-SCHEMA-PROBE-v1.0.json data/JANUS-PALOMAR-JPFM-4A-GCAT-ROW-SOURCE-SCHEMA-PROBE-v1.0.json
          git config user.name 'janus-jpfm-ci'
          git config user.email 'actions@users.noreply.github.com'
          git add data/JANUS-PALOMAR-JPFM-4A-GCAT-ROW-SOURCE-SCHEMA-PROBE-v1.0.json
          git diff --cached --quiet && exit 0
          git commit -m 'Add JPFM-4A GCAT source schema receipt [skip ci]'
          git pull --rebase origin main
          git push
