name: Palomar JPFM-4A NSSDC rocket descendant compact audit
on:
  workflow_dispatch:
  push:
    paths:
      - 'data/JANUS-PALOMAR-JPFM-4A-NSSDC-DATA-LISTING-ROCKET-LINEAGE-PROBE-v1.0.json'
      - 'tools/palomar/jpfm_4a_nssdc_data_listing_compact_audit.py'
      - '.github/workflows/palomar-jpfm-4a-nssdc-data-listing-compact-audit.yml'
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m py_compile tools/palomar/jpfm_4a_nssdc_data_listing_compact_audit.py
      - name: Summarize frozen source probe
        run: |
          mkdir -p out
          python tools/palomar/jpfm_4a_nssdc_data_listing_compact_audit.py \
            --out out/JANUS-PALOMAR-JPFM-4A-NSSDC-ROCKET-PUBLIC-DESCENDANT-COMPACT-AUDIT-v1.0.json
      - name: Validate compact audit
        run: |
          python - <<'PY'
          import json,pathlib
          d=json.loads(pathlib.Path('out/JANUS-PALOMAR-JPFM-4A-NSSDC-ROCKET-PUBLIC-DESCENDANT-COMPACT-AUDIT-v1.0.json').read_text())
          assert d['status']=='COMPACT_REVIEW_OF_FROZEN_NSSDC_DATA_LISTING_PROBE__NO_OUTCOME_JOIN'
          assert len(d['documents'])==3
          assert d['outcome_blindness']['bluebook_access'] is False
          assert d['outcome_blindness']['poss1_access'] is False
          assert d['current_authority_changed'] is False
          print('PASS_NSSDC_COMPACT_DESCENDANT_AUDIT')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: jpfm-4a-nssdc-rocket-public-descendant-compact-audit-v1
          path: out/JANUS-PALOMAR-JPFM-4A-NSSDC-ROCKET-PUBLIC-DESCENDANT-COMPACT-AUDIT-v1.0.json
          retention-days: 30
          if-no-files-found: error
      - name: Commit compact audit
        run: |
          cp out/JANUS-PALOMAR-JPFM-4A-NSSDC-ROCKET-PUBLIC-DESCENDANT-COMPACT-AUDIT-v1.0.json data/JANUS-PALOMAR-JPFM-4A-NSSDC-ROCKET-PUBLIC-DESCENDANT-COMPACT-AUDIT-v1.0.json
          git config user.name 'janus-jpfm-ci'
          git config user.email 'actions@users.noreply.github.com'
          git add data/JANUS-PALOMAR-JPFM-4A-NSSDC-ROCKET-PUBLIC-DESCENDANT-COMPACT-AUDIT-v1.0.json
          git diff --cached --quiet && exit 0
          git commit -m 'Add JPFM-4A NSSDC rocket descendant compact audit [skip ci]'
          git pull --rebase origin main
          git push
