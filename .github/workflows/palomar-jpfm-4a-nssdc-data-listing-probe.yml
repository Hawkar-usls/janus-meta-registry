name: Palomar JPFM-4A NSSDC data-listing lineage probe
on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/palomar/jpfm_4a_nssdc_data_listing_probe.py'
      - '.github/workflows/palomar-jpfm-4a-nssdc-data-listing-probe.yml'
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install requests==2.32.4
      - run: python -m py_compile tools/palomar/jpfm_4a_nssdc_data_listing_probe.py
      - name: Probe official NSSDC data listings
        run: |
          mkdir -p out
          python tools/palomar/jpfm_4a_nssdc_data_listing_probe.py \
            --out out/JANUS-PALOMAR-JPFM-4A-NSSDC-DATA-LISTING-ROCKET-LINEAGE-PROBE-v1.0.json
      - name: Validate source-only lineage receipt
        run: |
          python - <<'PY'
          import json,pathlib
          d=json.loads(pathlib.Path('out/JANUS-PALOMAR-JPFM-4A-NSSDC-DATA-LISTING-ROCKET-LINEAGE-PROBE-v1.0.json').read_text())
          assert d['status']=='OFFICIAL_NSSDC_DATA_LISTINGS_PROBED_FOR_ROCKET_PRODUCT_LINEAGE__NO_OUTCOME_JOIN'
          assert len(d['documents'])==3
          assert d['outcome_blindness']['bluebook_access'] is False
          assert d['outcome_blindness']['poss1_access'] is False
          assert d['outcome_blindness']['association_computed'] is False
          assert d['current_authority_changed'] is False
          print('PASS_NSSDC_DATA_LISTING_LINEAGE_GATE')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: jpfm-4a-nssdc-data-listing-rocket-lineage-probe-v1
          path: out/JANUS-PALOMAR-JPFM-4A-NSSDC-DATA-LISTING-ROCKET-LINEAGE-PROBE-v1.0.json
          retention-days: 30
          if-no-files-found: error
      - name: Commit source-only lineage receipt
        run: |
          cp out/JANUS-PALOMAR-JPFM-4A-NSSDC-DATA-LISTING-ROCKET-LINEAGE-PROBE-v1.0.json data/JANUS-PALOMAR-JPFM-4A-NSSDC-DATA-LISTING-ROCKET-LINEAGE-PROBE-v1.0.json
          git config user.name 'janus-jpfm-ci'
          git config user.email 'actions@users.noreply.github.com'
          git add data/JANUS-PALOMAR-JPFM-4A-NSSDC-DATA-LISTING-ROCKET-LINEAGE-PROBE-v1.0.json
          git diff --cached --quiet && exit 0
          git commit -m 'Add JPFM-4A NSSDC data-listing lineage receipt [skip ci]'
          git pull --rebase origin main
          git push
