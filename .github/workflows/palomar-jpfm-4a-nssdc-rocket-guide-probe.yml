# Registered-workflow trigger only; no source or scientific semantics changed.
name: Palomar JPFM-4A NSSDC rocket guide probe
on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/palomar/jpfm_4a_ntrs_rocket_guide_probe.py'
      - '.github/workflows/palomar-jpfm-4a-nssdc-rocket-guide-probe.yml'
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install requests==2.32.4
      - run: python -m py_compile tools/palomar/jpfm_4a_ntrs_rocket_guide_probe.py
      - name: Freeze official NSSDC guide metadata/fulltext
        run: |
          mkdir -p out
          python tools/palomar/jpfm_4a_ntrs_rocket_guide_probe.py \
            --out out/JANUS-PALOMAR-JPFM-4A-NSSDC-INTERNATIONAL-ROCKET-DATA-GUIDE-PROBE-v1.0.json
      - name: Validate source-only guide receipt
        run: |
          python - <<'PY'
          import json,pathlib
          d=json.loads(pathlib.Path('out/JANUS-PALOMAR-JPFM-4A-NSSDC-INTERNATIONAL-ROCKET-DATA-GUIDE-PROBE-v1.0.json').read_text())
          assert d['status'] in {
            'OFFICIAL_NSSDC_ROCKET_GUIDE_FULLTEXT_FROZEN__FORMAT_CONTEXTS_PROBED__NO_OUTCOME_JOIN',
            'OFFICIAL_NSSDC_ROCKET_GUIDE_API_FROZEN__FULLTEXT_LINK_NOT_EXPOSED_FAIL_CLOSED'
          }
          assert d['outcome_blindness']['bluebook_access'] is False
          assert d['outcome_blindness']['poss1_access'] is False
          assert d['outcome_blindness']['association_computed'] is False
          assert d['current_authority_changed'] is False
          if d['fulltext_freeze'] is not None:
              assert d['fulltext_freeze']['http_status']==200
              assert d['fulltext_freeze']['bytes']>0 and d['fulltext_freeze']['sha256']
          print('PASS_NSSDC_ROCKET_GUIDE_SOURCE_GATE')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: jpfm-4a-nssdc-international-rocket-data-guide-probe-v1
          path: out/JANUS-PALOMAR-JPFM-4A-NSSDC-INTERNATIONAL-ROCKET-DATA-GUIDE-PROBE-v1.0.json
          retention-days: 30
          if-no-files-found: error
      - name: Commit source-only guide receipt
        run: |
          cp out/JANUS-PALOMAR-JPFM-4A-NSSDC-INTERNATIONAL-ROCKET-DATA-GUIDE-PROBE-v1.0.json data/JANUS-PALOMAR-JPFM-4A-NSSDC-INTERNATIONAL-ROCKET-DATA-GUIDE-PROBE-v1.0.json
          git config user.name 'janus-jpfm-ci'
          git config user.email 'actions@users.noreply.github.com'
          git add data/JANUS-PALOMAR-JPFM-4A-NSSDC-INTERNATIONAL-ROCKET-DATA-GUIDE-PROBE-v1.0.json
          git diff --cached --quiet && exit 0
          git commit -m 'Add JPFM-4A NSSDC rocket guide probe receipt [skip ci]'
          git pull --rebase origin main
          git push
