name: Palomar JPFM-4A NTRS attachment probe
on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/palomar/jpfm_4a_ntrs_attachment_probe.py'
      - '.github/workflows/palomar-jpfm-4a-ntrs-attachment-probe.yml'
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install requests==2.32.4
      - name: Source-only syntax gate
        run: |
          python -m py_compile tools/palomar/jpfm_4a_ntrs_attachment_probe.py
      - name: Probe official NTRS attachment transport
        run: |
          mkdir -p out
          python tools/palomar/jpfm_4a_ntrs_attachment_probe.py \
            --out out/JANUS-PALOMAR-JPFM-4A-NTRS-19720015241-ATTACHMENT-PROBE-v1.0.json
      - name: Validate fail-closed source-only receipt
        run: |
          python - <<'PY'
          import json,pathlib
          d=json.loads(pathlib.Path('out/JANUS-PALOMAR-JPFM-4A-NTRS-19720015241-ATTACHMENT-PROBE-v1.0.json').read_text())
          assert d['status'] in {
            'NTRS_PUBLIC_PDF_BYTES_FROZEN__CONTENT_NOT_ANALYZED',
            'NTRS_PUBLIC_PDF_ATTACHMENT_TRANSPORT_BLOCKED_FAIL_CLOSED'
          }
          assert d['pdf_analysis']['performed'] is False
          assert d['outcome_blindness']['bluebook_access'] is False
          assert d['outcome_blindness']['poss1_access'] is False
          assert d['outcome_blindness']['association_computed'] is False
          assert d['current_authority_changed'] is False
          if d['status']=='NTRS_PUBLIC_PDF_BYTES_FROZEN__CONTENT_NOT_ANALYZED':
              assert d['byte_freeze']['pdf_magic'] is True
              assert d['byte_freeze']['sha256']
              assert d['byte_freeze']['bytes']>0
          print('PASS_NTRS_ATTACHMENT_PROBE_GATE')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: jpfm-4a-ntrs-19720015241-attachment-probe-v1
          path: out/JANUS-PALOMAR-JPFM-4A-NTRS-19720015241-ATTACHMENT-PROBE-v1.0.json
          retention-days: 30
          if-no-files-found: error
      - name: Commit source-only probe receipt
        run: |
          cp out/JANUS-PALOMAR-JPFM-4A-NTRS-19720015241-ATTACHMENT-PROBE-v1.0.json data/JANUS-PALOMAR-JPFM-4A-NTRS-19720015241-ATTACHMENT-PROBE-v1.0.json
          git config user.name 'janus-jpfm-ci'
          git config user.email 'actions@users.noreply.github.com'
          git add data/JANUS-PALOMAR-JPFM-4A-NTRS-19720015241-ATTACHMENT-PROBE-v1.0.json
          git diff --cached --quiet && exit 0
          git commit -m 'Add JPFM-4A NTRS attachment probe receipt [skip ci]'
          git pull --rebase origin main
          git push
