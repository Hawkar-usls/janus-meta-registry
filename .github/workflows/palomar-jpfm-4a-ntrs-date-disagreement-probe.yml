# Registered-workflow trigger only; no source or scientific semantics changed.
name: Palomar JPFM-4A NTRS disputed launch-date probe
on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/palomar/jpfm_4a_ntrs_date_disagreement_probe.py'
      - '.github/workflows/palomar-jpfm-4a-ntrs-date-disagreement-probe.yml'
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install requests==2.32.4
      - run: python -m py_compile tools/palomar/jpfm_4a_ntrs_date_disagreement_probe.py
      - name: Probe frozen official NTRS date tokens
        run: |
          mkdir -p out
          python tools/palomar/jpfm_4a_ntrs_date_disagreement_probe.py \
            --out out/JANUS-PALOMAR-JPFM-4A-NTRS-DISPUTED-LAUNCH-DATE-PROBE-v1.0.json
      - name: Validate source-only receipt
        run: |
          python - <<'PY'
          import json,pathlib
          d=json.loads(pathlib.Path('out/JANUS-PALOMAR-JPFM-4A-NTRS-DISPUTED-LAUNCH-DATE-PROBE-v1.0.json').read_text())
          assert d['status']=='FROZEN_NTRS_FULLTEXT_TARGETED_DATE_DISAGREEMENT_PROBE__NO_OUTCOME_JOIN'
          assert d['interpretation_boundary']['crossvalidation_gate_changed'] is False
          assert d['outcome_blindness']['bluebook_access'] is False
          assert d['outcome_blindness']['poss1_access'] is False
          assert d['current_authority_changed'] is False
          print('PASS_NTRS_DATE_DISAGREEMENT_PROBE')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: jpfm-4a-ntrs-disputed-launch-date-probe-v1
          path: out/JANUS-PALOMAR-JPFM-4A-NTRS-DISPUTED-LAUNCH-DATE-PROBE-v1.0.json
          retention-days: 30
          if-no-files-found: error
      - name: Commit date-disagreement receipt
        run: |
          cp out/JANUS-PALOMAR-JPFM-4A-NTRS-DISPUTED-LAUNCH-DATE-PROBE-v1.0.json data/JANUS-PALOMAR-JPFM-4A-NTRS-DISPUTED-LAUNCH-DATE-PROBE-v1.0.json
          git config user.name 'janus-jpfm-ci'
          git config user.email 'actions@users.noreply.github.com'
          git add data/JANUS-PALOMAR-JPFM-4A-NTRS-DISPUTED-LAUNCH-DATE-PROBE-v1.0.json
          git diff --cached --quiet && exit 0
          git commit -m 'Add JPFM-4A NTRS disputed launch-date receipt [skip ci]'
          git pull --rebase origin main
          git push
