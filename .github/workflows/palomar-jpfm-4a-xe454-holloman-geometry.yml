name: Palomar JPFM-4A XE454 Holloman geometry
on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/palomar/jpfm_4a_xe454_holloman_geometry.py'
      - '.github/workflows/palomar-jpfm-4a-xe454-holloman-geometry.yml'
permissions:
  contents: write
jobs:
  geometry:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m py_compile tools/palomar/jpfm_4a_xe454_holloman_geometry.py
      - name: Execute deterministic geometry
        run: |
          mkdir -p out
          python tools/palomar/jpfm_4a_xe454_holloman_geometry.py --out out/JANUS-PALOMAR-JPFM-4A-XE454-HOLLOMAN-GEOMETRY-CERTIFICATE-v1.0.json
      - name: Validate rejection margin
        run: |
          python - <<'PY'
          import json,pathlib
          d=json.loads(pathlib.Path('out/JANUS-PALOMAR-JPFM-4A-XE454-HOLLOMAN-GEOMETRY-CERTIFICATE-v1.0.json').read_text())
          assert d['status']=='DETERMINISTIC_GEOMETRY_EXECUTED'
          assert d['interpretation']['direct_launch_site_high_altitude_column_inside_xe454_field'] is False
          assert d['interpretation']['margin_vs_plate_half_diagonal_deg'] > 50
          assert d['current_authority_changed'] is False
          print('PASS_XE454_HOLLOMAN_GEOMETRY')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: jpfm-4a-xe454-holloman-geometry-v1
          path: out/JANUS-PALOMAR-JPFM-4A-XE454-HOLLOMAN-GEOMETRY-CERTIFICATE-v1.0.json
          retention-days: 30
          if-no-files-found: error
      - name: Commit validated certificate
        run: |
          cp out/JANUS-PALOMAR-JPFM-4A-XE454-HOLLOMAN-GEOMETRY-CERTIFICATE-v1.0.json data/JANUS-PALOMAR-JPFM-4A-XE454-HOLLOMAN-GEOMETRY-CERTIFICATE-v1.0.json
          git config user.name 'janus-jpfm-ci'
          git config user.email 'actions@users.noreply.github.com'
          git add data/JANUS-PALOMAR-JPFM-4A-XE454-HOLLOMAN-GEOMETRY-CERTIFICATE-v1.0.json
          git diff --cached --quiet && exit 0
          git commit -m 'Add XE454 Holloman geometry certificate [skip ci]'
          git pull --rebase origin main
          git push
