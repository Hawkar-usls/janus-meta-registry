name: Palomar JPFM-5B weather-adjusted POSS
on:
  workflow_dispatch:
  push:
    paths:
      - 'data/JANUS-PALOMAR-JPFM-5B-WEATHER-ADJUSTED-POSS-ADMISSION-v1.0.json'
      - 'tools/palomar/jpfm_5b_weather_adjusted_poss.py'
      - '.github/workflows/palomar-jpfm-5b-weather-adjusted-poss.yml'
permissions:
  contents: write
jobs:
  jpfm-5b:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install frozen environment
        run: python -m pip install numpy==2.2.6 pandas==2.3.1 scipy==1.16.1 statsmodels==0.14.5 requests==2.32.4
      - name: Syntax gate
        run: |
          python -m py_compile tools/palomar/jpfm_open_reconstruction_temporal.py
          python -m py_compile tools/palomar/jpfm_schedule_confound_decomposition.py
          python -m py_compile tools/palomar/jpfm_5b_weather_adjusted_poss.py
      - name: Verify admission before outcome
        run: |
          python - <<'PY'
          import json,pathlib
          d=json.loads(pathlib.Path('data/JANUS-PALOMAR-JPFM-5B-WEATHER-ADJUSTED-POSS-ADMISSION-v1.0.json').read_text())
          assert d['status']=='PREREGISTERED_BEFORE_WEATHER_TO_POSS_OUTCOME_JOIN'
          assert d['weather_source']['primary_element']=='PRCP'
          assert d['date_alignment']['primary'].startswith('weather_date = Palomar UTC observation/calendar date minus 1')
          assert d['current_authority_changed'] is False
          print('PASS_5B_ADMISSION_GATE')
          PY
      - name: Execute weather schedule and rate test
        run: |
          mkdir -p out
          python tools/palomar/jpfm_5b_weather_adjusted_poss.py --out out/JANUS-PALOMAR-JPFM-5B-WEATHER-ADJUSTED-POSS-RUN-001.json
      - name: Validate result ceiling
        run: |
          python - <<'PY'
          import json,pathlib,math
          d=json.loads(pathlib.Path('out/JANUS-PALOMAR-JPFM-5B-WEATHER-ADJUSTED-POSS-RUN-001.json').read_text())
          assert d['status']=='EXECUTED'
          assert d['primary_alignment']['weather_lag_days_relative_to_poss_utc_date']==-1
          assert d['same_date_sensitivity']['weather_lag_days_relative_to_poss_utc_date']==0
          assert d['primary_alignment']['rate']['n'] <= 312
          assert d['current_authority_changed'] is False
          assert 'PRCP_IS_NOT_CLOUD_COVER' in d['claim_ceiling']
          def walk(x):
              if isinstance(x,dict):
                  for v in x.values():yield from walk(v)
              elif isinstance(x,list):
                  for v in x:yield from walk(v)
              elif isinstance(x,float):yield x
          assert all(math.isfinite(v) for v in walk(d))
          print('PASS_5B_RESULT_GATE')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: jpfm-5b-weather-adjusted-poss-run-001
          path: out/JANUS-PALOMAR-JPFM-5B-WEATHER-ADJUSTED-POSS-RUN-001.json
          retention-days: 30
          if-no-files-found: error
      - name: Commit validated result
        run: |
          cp out/JANUS-PALOMAR-JPFM-5B-WEATHER-ADJUSTED-POSS-RUN-001.json data/JANUS-PALOMAR-JPFM-5B-WEATHER-ADJUSTED-POSS-RUN-001.json
          git config user.name 'janus-jpfm-ci'
          git config user.email 'actions@users.noreply.github.com'
          git add data/JANUS-PALOMAR-JPFM-5B-WEATHER-ADJUSTED-POSS-RUN-001.json
          git diff --cached --quiet && exit 0
          git commit -m 'Add JPFM-5B weather-adjusted POSS result [skip ci]'
          git pull --rebase origin main
          git push
