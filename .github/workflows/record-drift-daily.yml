name: JANUS Record Drift Daily

on:
  workflow_dispatch:
  schedule:
    - cron: '17 5 * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/record-drift-daily.yml'
      - 'tools/record_drift/t1_runner.py'
      - 'tools/record_drift/full_surface_runner.py'
      - 'tools/record_drift/full_surface_runner_v0_2_1.py'
      - 'tools/record_drift/full_surface_runner_v0_2_2.py'
      - 'data/JANUS-RECORD-DRIFT-OBSERVATORY-v0.1.json'
      - 'data/JANUS-RECORD-DRIFT-OBSERVATORY-v0.2.json'
      - 'data/JANUS-RECORD-DRIFT-BASELINE-T0-v0.1.json'

permissions:
  contents: write

concurrency:
  group: janus-record-drift-daily
  cancel-in-progress: false

jobs:
  observe:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Record Drift v0.2.2 full-surface observer
        env:
          GITHUB_TOKEN: ${{ github.token }}
          JANUS_CRON_UTC: '17 5 * * *'
        run: python tools/record_drift/full_surface_runner_v0_2_2.py

      - name: Commit append-only journal entry
        run: |
          git config user.name "janus-record-drift-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add registry/record_drift/JANUS-RECORD-DRIFT-JOURNAL-*.json
          if git diff --cached --quiet; then
            echo "No journal change to commit"
            exit 0
          fi
          git commit -m "record-drift: daily v0.2.2 full-surface journal $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push
