name: Repair Quarantined JSON

on:
  push:
    paths:
      - '.github/workflows/repair-quarantined-json.yml'
      - 'tools/repair_quarantined_json_v2.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: janus-meta-registry-quarantine-repair
  cancel-in-progress: false

jobs:
  repair:
    if: github.actor == 'Hawkar-usls' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Second-pass forensic repair of remaining four files
        run: |
          python tools/repair_quarantined_json_v2.py --root . --report data/JANUS-QUARANTINE-REPAIR-2026-08-25-v2.json

      - name: Independently validate all 14 formerly quarantined targets
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from tools.repair_quarantined_json import TARGETS
          bad=[]
          for rel in TARGETS:
              try:
                  json.loads(Path(rel).read_text(encoding='utf-8-sig'))
              except Exception as exc:
                  bad.append({'path':rel,'error':str(exc)})
          print(json.dumps({'targets':len(TARGETS),'valid':len(TARGETS)-len(bad),'invalid':bad},ensure_ascii=False,indent=2))
          if bad:
              raise SystemExit(2)
          PY

      - name: Persist second-pass repairs and receipt
        run: |
          git config user.name 'janus-registry-repair-bot'
          git config user.email 'janus-registry-repair-bot@users.noreply.github.com'
          git add \
            data/JANUS-ARCHITECTURAL-INFLUENCE-REGISTRY-V18.json \
            data/JANUS-DOGMA-DIVINE-KEVIN-SMITH-CROSS-REFERENCES-v1.2.json \
            data/janus-ai-integration-v5.9.json \
            data/janus-registry-v5.2.json \
            data/JANUS-QUARANTINE-REPAIR-2026-08-25-v2.json
          if git diff --cached --quiet; then
            echo 'No second-pass changes to commit.'
            exit 0
          fi
          git commit -m 'Complete repair of four remaining quarantined JSON artifacts'
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Enforce all-14 repair receipt
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('data/JANUS-QUARANTINE-REPAIR-2026-08-25-v2.json').read_text(encoding='utf-8'))
          if r.get('repair_run_status') != 'PASS_ALL_14_VALID_JSON':
              raise SystemExit('QUARANTINE_REPAIR_INCOMPLETE: '+json.dumps(r.get('all_14_validation'),ensure_ascii=False))
          print('PASS_ALL_14_VALID_JSON')
          PY
