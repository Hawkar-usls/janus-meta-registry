name: JANUS Rowan AURA Demiurge autonomous council reconciliation
on:
  workflow_run:
    # Event-based wake even when the Rowan archive was committed with
    # GITHUB_TOKEN (such commits do not trigger downstream push workflows).
    workflows: ["JANUS Rowan Durable Observer"]
    types: [completed]
    branches: [main]
  schedule:
    - cron: '53 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      # Source-triggered best effort wake when GitHub emits this push event;
      # GITHUB_TOKEN-suppressed pushes still use the hourly schedule.
      # Coordination-only writes are deliberately excluded (no self-loop).
      - 'data/rowan/CANONICAL_STATE.json'
      - '.github/workflows/rowan-coordination-autonomous-reconcile.yml'
      - 'modules/rowan_observer/coordination_ingest.py'
      - 'modules/rowan_observer/test_coordination.py'
  pull_request:
    paths:
      - '.github/workflows/rowan-coordination-autonomous-reconcile.yml'
      - 'modules/rowan_observer/coordination_ingest.py'
      - 'modules/rowan_observer/test_coordination.py'

permissions:
  contents: write

concurrency:
  group: janus-rowan-durable-observer
  cancel-in-progress: false

jobs:
  council-reconcile:
    # Never give untrusted/PR-originated upstream events a write-capable job.
    if: >-
      ${{ github.event_name != 'workflow_run' ||
          (github.event.workflow_run.conclusion == 'success' &&
           github.event.workflow_run.head_branch == 'main' &&
           github.event.workflow_run.head_repository.full_name == github.repository &&
           github.event.workflow_run.event != 'pull_request') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          # A rerun of an old scheduled job must read CURRENT main, not the
          # event's historical github.sha. PRs still test only their own SHA.
          ref: ${{ github.event_name == 'pull_request' && github.sha || 'main' }}
          fetch-depth: 0
          persist-credentials: true
      - name: Refuse an obsolete local canonical snapshot
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          python - <<'PY'
          import json, subprocess
          from pathlib import Path
          path='data/rowan/CANONICAL_STATE.json'
          local=json.loads(Path(path).read_text())
          published=json.loads(subprocess.check_output(
              ['git','show','origin/main:'+path],text=True))
          assert local == published, 'ROWAN_CANONICAL_STALE_WORKTREE_HOLD'
          print('ROWAN_COORDINATION_CURRENT_MAIN_CANONICAL='+str(
              local['latest_durable_external_run']))
          PY
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify no-network council source-bound adversarial tests
        run: |
          python -m unittest discover -v -s modules/rowan_observer -p 'test_coordination.py'
          python -m py_compile modules/rowan_observer/coordination_ingest.py
          test -z "${ROWAN_API_KEY:-}"
      - name: Attest exact matched AURA/Demiurge sources and prepare metadata
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          python modules/rowan_observer/coordination_ingest.py
          python - <<'PY'
          import json
          from pathlib import Path
          base=Path("data/rowan")
          meta=json.loads((base/"CANONICAL_STATE.json").read_text())
          pointer=json.loads((base/"coordination/LATEST_COORDINATION_STATE.json").read_text())
          canonical=meta["latest_durable_external_run"]
          matched=pointer["meta_canonical_run"]
          assert type(canonical) is int and type(matched) is int
          assert matched<=canonical,("COUNCIL_CANNOT_OUTRUN_CANONICAL",matched,canonical)
          assert pointer["scientific_status"]=="HYPOTHESES_ONLY_NOT_BIOLOGICAL_DISCOVERY"
          receipt=Path(pointer["receipt_path"])
          assert receipt.is_file()
          r=json.loads(receipt.read_text())
          assert r["source_binding_sha256"]==pointer["source_binding_sha256"]
          assert r["sources"]["meta_canonical_run"]==matched
          assert r["authority"]["new_rowan_jobs"] is False
          assert r["authority"]["new_credit_spend"] is False
          assert r["authority"]["hypotheses_are_empirical_proof"] is False
          print("ROWAN_COORDINATION_VERIFIED_POINTER="+str(matched))
          print("ROWAN_COORDINATION_NEW_CANONICAL="+str(canonical))
          print("ROWAN_COORDINATION_SOURCES_MATCHED="+str(matched==canonical).upper())
          PY
      - name: Commit only validated Rowan coordination receipts
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          # Revalidate immediately before any write. An upstream Rowan
          # generation can advance while AURA/Council were being read.
          git fetch origin main
          python - <<'PY'
          import json, subprocess
          from pathlib import Path
          base=Path('data/rowan')
          pointer=json.loads((base/'coordination/LATEST_COORDINATION_STATE.json').read_text())
          local=json.loads((base/'CANONICAL_STATE.json').read_text())
          published=json.loads(subprocess.check_output(
              ['git','show','origin/main:data/rowan/CANONICAL_STATE.json'],
              text=True))
          assert local == published, 'ROWAN_CANONICAL_ADVANCED_DURING_RECONCILE_HOLD'
          assert pointer['meta_canonical_run'] == published['latest_durable_external_run'], (
              'ROWAN_COORDINATION_STALE_POINTER_HOLD',
              pointer['meta_canonical_run'], published['latest_durable_external_run'])
          print('ROWAN_COORDINATION_PREPUSH_COHORT_MATCH=PASS')
          PY
          git add data/rowan/coordination/
          if git diff --cached --quiet; then
            echo 'ROWAN_COORDINATION=NO_NEW_SOURCE_MATCH'
            exit 0
          fi
          git config user.name 'JANUS Rowan Council Reconciler'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m '[rowan] Source-bound AURA/Demiurge council reconciliation'
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            # No rebase may transplant an old coordination pointer onto a
            # newer canonical. Re-read remote state on EVERY retry.
            python - <<'PY'
          import json, subprocess
          from pathlib import Path
          pointer=json.loads(Path('data/rowan/coordination/LATEST_COORDINATION_STATE.json').read_text())
          remote=json.loads(subprocess.check_output(
              ['git','show','origin/main:data/rowan/CANONICAL_STATE.json'],
              text=True))
          assert pointer['meta_canonical_run'] == remote['latest_durable_external_run'], (
              'ROWAN_COORDINATION_RETRY_SOURCE_CHANGED_HOLD')
          print('ROWAN_COORDINATION_RETRY_SOURCE_STILL_CURRENT=PASS')
          PY
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo 'ROWAN_COORDINATION=REBASE_CONFLICT_HOLD'
              exit 1
            fi
            if git push origin HEAD:main; then
              echo 'ROWAN_COORDINATION=SOURCE_BOUND_COMMIT_SUCCESS'
              exit 0
            fi
            sleep "$attempt"
          done
          echo 'ROWAN_COORDINATION=PUSH_FAILED_HOLD'
          exit 1
