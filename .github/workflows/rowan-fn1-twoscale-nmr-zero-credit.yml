name: JANUS FN1 two-timescale NMR physical forward adequacy
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "modules/rowan_observer/fn1_nmr_twoscale_forward_gate.py"
      - "modules/rowan_observer/test_fn1_nmr_twoscale_forward_gate.py"
      - "data/rowan/protocols/ROWAN-FN1-NMR-T1-T2-NOE-TWOSCALE-FORWARD-EXPLORATORY-2026-10-26-v1.json"
      - "data/rowan/provenance/ROWAN-FN1-SMITH2000-SI-10-ROW-T1-T2-DELTA-TRANSCRIPTION-2026-10-26-v1.json"
      - ".github/workflows/rowan-fn1-twoscale-nmr-zero-credit.yml"

permissions:
  contents: read

jobs:
  source-locked-nmr-physical-forward-model:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Nine physics, source and epistemic tests without provider secrets
        run: python -m unittest discover -v -s modules/rowan_observer -p 'test_fn1_nmr_twoscale_forward_gate.py'
      - name: Compute actual T1/T2 acceptance and held-out NOE adequacy
        run: python modules/rowan_observer/fn1_nmr_twoscale_forward_gate.py > fn1-real-15n-forward-model-adequacy.json
      - name: Validate original real subset, report gates and never infer one FNII angle
        run: |
          python - <<'PY'
          import json
          d=json.load(open("fn1-real-15n-forward-model-adequacy.json", encoding="utf8"))
          for k, v in d["models"].items():
              print(f"JANUS_FN1_PHYSICAL_MODEL={k} T1_T2_COMPATIBLE={v['rows_with_T1T2_grid_point']}/10 T1T2_PLUS_INDEPENDENT_NOE={v['rows_with_T1T2_AND_heldout_NOE_grid_point']}/10")
          assert d["comparative_scope"]["new_rowan_credits"] == 0
          assert d["comparative_scope"]["new_rowan_jobs"] == 0
          assert d["comparative_scope"]["domain_rotation_angles_not_identifiable"] is True
          print("JANUS_FN1_FORWARD=EXPLORATORY_COMPLETED_0_ROWAN_CREDITS")
          PY
      - name: Archive immutable sanitized numerics only
        uses: actions/upload-artifact@v4
        with:
          name: janus-fn1-15n-forward-two-timescale-${{ github.run_id }}
          path: fn1-real-15n-forward-model-adequacy.json
          retention-days: 14
          if-no-files-found: error
