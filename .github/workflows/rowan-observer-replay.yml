name: JANUS Rowan Observer Replay

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'modules/rowan_observer/**'
      - '.github/workflows/rowan-observer-replay.yml'
      - '.github/workflows/janus-rowan-observer-forge.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned CPU-only numerical verifier dependency
        run: python -m pip install --disable-pip-version-check --quiet numpy==2.1.3
      - name: Verify immutable evidence logic
        run: python -m unittest discover -s modules/rowan_observer -p 'test_*.py' -v
