name: JANUS TOPA R1D independent zero-credit numerical replay
on:
  pull_request:
    paths:
      - 'data/rowan/provenance/ROWAN-R1D-LOCAL-CLOUD-SEED-PANEL-2026-11-19-v1.json'
      - 'modules/rowan_observer/topa_r1d_seed_panel.py'
      - '.github/workflows/rowan-topa-r1d-seed-panel.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Replay frozen raw confidence metrics and negative controls
        run: python modules/rowan_observer/topa_r1d_seed_panel.py --out "${RUNNER_TEMP}/topa-r1d.json"
      - uses: actions/upload-artifact@v4
        with:
          name: topa-r1d-${{ github.run_id }}
          path: ${{ runner.temp }}/topa-r1d.json
          retention-days: 14
