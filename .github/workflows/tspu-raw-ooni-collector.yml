name: TSPU raw OONI collector

on:
  push:
    branches:
      - research/tspu-external-us-impact
    paths:
      - .github/workflows/tspu-raw-ooni-collector.yml

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Collect public OONI raw measurements
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out/raw out/index
          cat > /tmp/collect.py <<'PY'
          import json, os, time, urllib.parse, urllib.request

          API = 'https://api.ooni.io/api/v1'
          UA = 'janus-meta-registry-public-research-collector/1.0'
          OUT = 'out'

          def get_json(url, retries=4):
              last = None
              for n in range(retries):
                  try:
                      req = urllib.request.Request(url, headers={'User-Agent': UA, 'Accept':'application/json'})
                      with urllib.request.urlopen(req, timeout=45) as r:
                          return json.loads(r.read().decode('utf-8'))
                  except Exception as e:
                      last = e
                      time.sleep(2*(n+1))
              raise last

          def safe_name(s):
              return ''.join(c if c.isalnum() or c in '._-' else '_' for c in s)[:180]

          def list_measurements(label, params, max_pages=5):
              params = dict(params)
              params.setdefault('limit', 100)
              url = API + '/measurements?' + urllib.parse.urlencode(params)
              all_rows = []
              for page in range(max_pages):
                  data = get_json(url)
                  rows = data.get('results', [])
                  all_rows.extend(rows)
                  nxt = (data.get('metadata') or {}).get('next_url')
                  if not nxt or not rows:
                      break
                  url = nxt
              with open(f'{OUT}/index/{label}.json','w',encoding='utf-8') as f:
                  json.dump({'query':params,'count':len(all_rows),'results':all_rows},f,ensure_ascii=False,indent=2)
              return all_rows

          def fetch_rows(label, rows, cap=250):
              os.makedirs(f'{OUT}/raw/{label}', exist_ok=True)
              ok=0; fail=0
              seen=set()
              manifest=[]
              for row in rows[:cap]:
                  u=row.get('measurement_url')
                  rid=row.get('report_id','unknown')
                  inp=row.get('input') or ''
                  key=(rid,inp)
                  if not u or key in seen: continue
                  seen.add(key)
                  try:
                      m=get_json(u)
                      fn=safe_name(rid + ('__'+inp if inp else '')) + '.json'
                      with open(f'{OUT}/raw/{label}/{fn}','w',encoding='utf-8') as f:
                          json.dump(m,f,ensure_ascii=False,indent=2)
                      ok+=1
                      manifest.append({'report_id':rid,'input':inp,'file':fn,'probe_asn':row.get('probe_asn'),'measurement_start_time':row.get('measurement_start_time'),'anomaly':row.get('anomaly'),'confirmed':row.get('confirmed')})
                  except Exception as e:
                      fail+=1
                      manifest.append({'report_id':rid,'input':inp,'error':repr(e)})
              with open(f'{OUT}/index/{label}-raw-manifest.json','w',encoding='utf-8') as f:
                  json.dump({'ok':ok,'failed':fail,'items':manifest},f,ensure_ascii=False,indent=2)
              print(label, 'rows=',len(rows),'raw_ok=',ok,'raw_fail=',fail)

          # Known Cuba Signal measurement cited by OONI's 2021 analysis.
          known_id='20210714T194436Z_signal_CU_27725_n1_QtpCKjV8IpvR0po4'
          try:
              m=get_json(API + '/measurement/' + known_id)
              with open(f'{OUT}/raw/CUBA_SIGNAL_KNOWN_{known_id}.json','w',encoding='utf-8') as f:
                  json.dump(m,f,ensure_ascii=False,indent=2)
              print('known Cuba measurement: PASS')
          except Exception as e:
              with open(f'{OUT}/index/CUBA_SIGNAL_KNOWN_ERROR.json','w') as f: json.dump({'id':known_id,'error':repr(e)},f,indent=2)
              print('known Cuba measurement: FAIL',repr(e))

          datasets = {
            'CU_signal_20210711_20': dict(probe_cc='CU',probe_asn='AS27725',test_name='signal',since='2021-07-11',until='2021-07-20',order='asc'),
            'CU_web_signal_20210711_20': dict(probe_cc='CU',probe_asn='AS27725',test_name='web_connectivity',domain='signal.org',since='2021-07-11',until='2021-07-20',order='asc'),
            'KG_AS50223_tiktok_www_20240418_0501': dict(probe_cc='KG',probe_asn='AS50223',test_name='web_connectivity',domain='www.tiktok.com',since='2024-04-18',until='2024-05-01',order='asc'),
            'KG_AS50223_tiktok_root_20240418_0501': dict(probe_cc='KG',probe_asn='AS50223',test_name='web_connectivity',domain='tiktok.com',since='2024-04-18',until='2024-05-01',order='asc'),
            'KG_ALL_tiktok_www_20240418_0501': dict(probe_cc='KG',test_name='web_connectivity',domain='www.tiktok.com',since='2024-04-18',until='2024-05-01',order='asc'),
            'KG_ALL_tiktok_root_20240418_0501': dict(probe_cc='KG',test_name='web_connectivity',domain='tiktok.com',since='2024-04-18',until='2024-05-01',order='asc')
          }
          summary={}
          for label, params in datasets.items():
              try:
                  rows=list_measurements(label,params)
                  fetch_rows(label,rows)
                  summary[label]={'rows':len(rows),'asns':sorted(set(r.get('probe_asn') for r in rows if r.get('probe_asn')))}
              except Exception as e:
                  summary[label]={'error':repr(e)}
                  print(label,'FAILED',repr(e))

          # TSPU canonical paper as a frozen reference, plus metadata URL.
          refs={
            'tspu_paper':'https://censoredplanet.org/assets/tspu-imc22.pdf',
            'ooni_cuba_signal_analysis':'https://ooni.org/post/2021-how-signal-private-messenger-blocked-around-the-world/',
            'ooni_data_api':'https://api.ooni.io/api/v1/measurements'
          }
          with open(f'{OUT}/index/SOURCE-REFS.json','w') as f: json.dump(refs,f,indent=2)
          with open(f'{OUT}/index/COLLECTION-SUMMARY.json','w') as f: json.dump(summary,f,indent=2)
          PY
          python /tmp/collect.py
          find out -type f -maxdepth 4 -print | sort

      - name: Upload raw measurement bundle
        uses: actions/upload-artifact@v4
        with:
          name: tspu-raw-ooni-bundle
          path: out/
          if-no-files-found: error
          retention-days: 30
