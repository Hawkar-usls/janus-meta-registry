name: TSPU raw OONI collector

on:
  push:
    branches:
      - research/tspu-external-us-impact
    paths:
      - .github/workflows/tspu-raw-ooni-collector.yml

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Collect stratified public OONI raw measurements
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out/raw out/index
          cat > /tmp/collect.py <<'PY'
          import concurrent.futures as cf
          import json, os, time, urllib.parse, urllib.request
          from collections import defaultdict

          API='https://api.ooni.io/api/v1'
          UA='janus-meta-registry-dpi-dna-collector/2.0'
          OUT='out'

          def get_json(url, retries=3):
              err=None
              for i in range(retries):
                  try:
                      req=urllib.request.Request(url,headers={'User-Agent':UA,'Accept':'application/json'})
                      with urllib.request.urlopen(req,timeout=20) as r:
                          return json.loads(r.read().decode('utf-8'))
                  except Exception as e:
                      err=e; time.sleep(i+1)
              raise err

          def safe(s):
              return ''.join(c if c.isalnum() or c in '._-' else '_' for c in str(s))[:170]

          def list_rows(params, pages=2):
              p=dict(params); p.setdefault('limit',100)
              url=API+'/measurements?'+urllib.parse.urlencode(p)
              rows=[]
              for _ in range(pages):
                  d=get_json(url); batch=d.get('results',[]); rows += batch
                  nxt=(d.get('metadata') or {}).get('next_url')
                  if not nxt or not batch: break
                  url=nxt
              return rows

          def fetch_one(label,row):
              url=row.get('measurement_url')
              if not url: return {'ok':False,'error':'no_measurement_url','row':row}
              try:
                  m=get_json(url)
                  rid=row.get('report_id') or m.get('report_id') or 'unknown'
                  inp=row.get('input') or m.get('input') or ''
                  fn=safe(rid+'__'+inp)+'.json'
                  os.makedirs(f'{OUT}/raw/{label}',exist_ok=True)
                  with open(f'{OUT}/raw/{label}/{fn}','w',encoding='utf-8') as f:
                      json.dump(m,f,ensure_ascii=False,indent=2)
                  return {'ok':True,'file':fn,'report_id':rid,'input':inp,'probe_asn':row.get('probe_asn'),'time':row.get('measurement_start_time'),'anomaly':row.get('anomaly'),'confirmed':row.get('confirmed')}
              except Exception as e:
                  return {'ok':False,'error':repr(e),'report_id':row.get('report_id'),'input':row.get('input'),'probe_asn':row.get('probe_asn')}

          def stratify(rows, per_asn=18):
              groups=defaultdict(list)
              for r in rows:
                  groups[r.get('probe_asn') or 'UNKNOWN'].append(r)
              out=[]
              for asn, rs in sorted(groups.items()):
                  anomalies=[r for r in rs if r.get('anomaly') or r.get('confirmed')]
                  normals=[r for r in rs if not (r.get('anomaly') or r.get('confirmed'))]
                  sel=anomalies[:max(1,per_asn*2//3)] + normals[:max(1,per_asn//3)]
                  if len(sel)<per_asn:
                      used={id(x) for x in sel}
                      sel += [r for r in rs if id(r) not in used][:per_asn-len(sel)]
                  out += sel[:per_asn]
              return out

          # Exact Cuba raw measurement cited by OONI.
          known='20210714T194436Z_signal_CU_27725_n1_QtpCKjV8IpvR0po4'
          try:
              m=get_json(API+'/measurement/'+known)
              with open(f'{OUT}/raw/CUBA_KNOWN_{known}.json','w',encoding='utf-8') as f: json.dump(m,f,ensure_ascii=False,indent=2)
              known_status={'ok':True,'id':known}
          except Exception as e:
              known_status={'ok':False,'id':known,'error':repr(e)}

          queries={
            'CU_SIGNAL_AS27725': dict(probe_cc='CU',probe_asn='AS27725',test_name='signal',since='2021-07-11',until='2021-07-20',order='asc'),
            'KG_TIKTOK_WWW': dict(probe_cc='KG',test_name='web_connectivity',domain='www.tiktok.com',since='2024-04-18',until='2024-05-01',order='asc'),
            'KG_TIKTOK_ROOT': dict(probe_cc='KG',test_name='web_connectivity',domain='tiktok.com',since='2024-04-18',until='2024-05-01',order='asc')
          }
          summary={'known_cuba':known_status,'queries':{}}
          tasks=[]
          for label,p in queries.items():
              try:
                  rows=list_rows(p,pages=2)
                  chosen=stratify(rows,per_asn=18) if label.startswith('KG_') else rows[:30]
                  with open(f'{OUT}/index/{label}-LIST.json','w',encoding='utf-8') as f:
                      json.dump({'query':p,'total_rows':len(rows),'selected':chosen},f,ensure_ascii=False,indent=2)
                  summary['queries'][label]={'total_rows':len(rows),'selected':len(chosen),'asns':sorted(set(r.get('probe_asn') for r in rows if r.get('probe_asn')))}
                  tasks += [(label,r) for r in chosen]
              except Exception as e:
                  summary['queries'][label]={'error':repr(e)}

          results=defaultdict(list)
          with cf.ThreadPoolExecutor(max_workers=12) as ex:
              futs=[ex.submit(fetch_one,label,row) for label,row in tasks]
              for (label,_), fut in zip(tasks,futs):
                  results[label].append(fut.result())

          for label,rs in results.items():
              with open(f'{OUT}/index/{label}-RAW-MANIFEST.json','w',encoding='utf-8') as f: json.dump(rs,f,ensure_ascii=False,indent=2)
              summary['queries'].setdefault(label,{})['raw_ok']=sum(1 for x in rs if x.get('ok'))
              summary['queries'][label]['raw_failed']=sum(1 for x in rs if not x.get('ok'))

          with open(f'{OUT}/index/COLLECTION-SUMMARY.json','w',encoding='utf-8') as f: json.dump(summary,f,ensure_ascii=False,indent=2)
          with open(f'{OUT}/index/SOURCE-REFS.json','w',encoding='utf-8') as f:
              json.dump({'ooni_api':API,'cuba_known_id':known,'tspu_reference':'https://censoredplanet.org/tspu'},f,indent=2)
          print(json.dumps(summary,indent=2))
          PY
          python /tmp/collect.py
          find out -type f -maxdepth 4 -print | sort

      - name: Upload raw measurement bundle
        uses: actions/upload-artifact@v4
        with:
          name: tspu-raw-ooni-bundle-v2
          path: out/
          if-no-files-found: error
          retention-days: 30
