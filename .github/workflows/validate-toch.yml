name: Validate TOCH Registry

on:
  push:
    branches:
      - research/toch-predecessors-2026-08-27
    paths:
      - 'registry/p_vs_np/TOCH/**'
      - '.github/workflows/validate-toch.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Parse all TOCH JSON
        run: |
          python - <<'PY'
          import json, pathlib
          root = pathlib.Path('registry/p_vs_np/TOCH')
          files = sorted(root.glob('*.json'))
          assert files, 'NO_TOCH_JSON'
          for p in files:
              obj = json.loads(p.read_text(encoding='utf-8'))
              assert obj.get('P_VS_NP') == 'OPEN', (p, obj.get('P_VS_NP'))
              print('PASS', p)
          PY
      - name: No theorem promotion
        run: |
          ! grep -R '"P_VS_NP"[[:space:]]*:[[:space:]]*"CLOSED"' registry/p_vs_np/TOCH
