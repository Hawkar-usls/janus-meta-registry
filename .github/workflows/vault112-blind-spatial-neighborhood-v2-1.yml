name: Vault112 Blind Spatial Neighborhood v2.1

on:
  pull_request:
    branches: [main]
    paths:
      - "tools/fo3edit_vault112_blind_spatial_neighborhood_export_v2_1.pas"
      - "tools/verify_vault112_blind_spatial_neighborhood_v2_1.py"
      - "tests/test_vault112_blind_spatial_neighborhood_v2_1.py"
      - "registry/myth_busted/FALLOUT-3-VAULT112A-BLIND-SPATIAL-NEIGHBORHOOD-REFERENCE-GRAPH-GATE-v2.3.json"
      - "registry/myth_busted/FALLOUT-3-VAULT112A-BLIND-SPATIAL-NEIGHBORHOOD-CI-REQUEST-v2.1.json"
      - ".github/workflows/vault112-blind-spatial-neighborhood-v2-1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Assert exact head
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          ACTUAL_HEAD="$(git rev-parse HEAD)"
          echo "EXPECTED_HEAD=$EXPECTED_HEAD"
          echo "ACTUAL_HEAD=$ACTUAL_HEAD"
          test "$ACTUAL_HEAD" = "$EXPECTED_HEAD"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Compile Python and validate JSON
        run: |
          python -m py_compile tools/verify_vault112_blind_spatial_neighborhood_v2_1.py tests/test_vault112_blind_spatial_neighborhood_v2_1.py
          python -m json.tool registry/myth_busted/FALLOUT-3-VAULT112A-BLIND-SPATIAL-NEIGHBORHOOD-REFERENCE-GRAPH-GATE-v2.3.json >/dev/null
          python -m json.tool registry/myth_busted/FALLOUT-3-VAULT112A-BLIND-SPATIAL-NEIGHBORHOOD-CI-REQUEST-v2.1.json >/dev/null

      - name: Static xEdit exhaustive-export invariants
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path('tools/fo3edit_vault112_blind_spatial_neighborhood_export_v2_1.pas').read_text(encoding='utf-8')
          required = [
              "LoadedOfficial.Count <> 6",
              "UnexpectedPlugins.Count > 0",
              "CompareText(CanonicalCellEditorID(win), 'Vault112a')",
              "Signature(win) = 'REFR'",
              "ExportAllRef(win)",
              "BaseRecord(rec)",
              "GetPosition(rec)",
              "XESP - Enable Parent",
              "XOWN - Owner",
              "SCRI - Script",
              "MODL - Model Filename",
              "JANUS-Vault112a-All-Refs-v2.1.tsv",
          ]
          missing = [x for x in required if x not in text]
          assert not missing, missing
          forbidden = ["HardwareKind(", "if kind = 'OTHER' then exit"]
          present = [x for x in forbidden if x in text]
          assert not present, present
          print(f'VAULT112_BLIND_EXPORT_STATIC_INVARIANTS={len(required)+len(forbidden)}/{len(required)+len(forbidden)} PASS')
          PY

      - name: Run exactly twelve blind-neighborhood tests
        run: |
          set -o pipefail
          python -m unittest tests.test_vault112_blind_spatial_neighborhood_v2_1 -v 2>&1 | tee /tmp/vault112-blind-tests.log
          grep -F "Ran 12 tests" /tmp/vault112-blind-tests.log
          grep -Fx "OK" /tmp/vault112-blind-tests.log

      - name: Verify claim ceilings
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d = json.loads(Path('registry/myth_busted/FALLOUT-3-VAULT112A-BLIND-SPATIAL-NEIGHBORHOOD-REFERENCE-GRAPH-GATE-v2.3.json').read_text(encoding='utf-8'))
          rules = set(d['hard_rules'])
          required = {
              'NAME_BASED_HARDWARE_FILTER != EXHAUSTIVE_REFERENCE_GRAPH',
              'ALL_REFR_EXPORT != FUNCTIONAL_SHARD',
              'REPEATED_BASE != FUNCTIONAL_WIRING',
              'PROXIMITY != STATE_OWNERSHIP',
              'SPATIAL_PATTERN != MEMORY_PERSISTENCE',
              'REAL_ESM_RESULT_REQUIRED_BEFORE_PERSISTED_JAMES_PROMOTION',
          }
          assert required <= rules
          assert d['current_matrix']['V2_0_NAME_FILTER_BLIND_SPOT'] == 'CONFIRMED'
          assert d['current_matrix']['JAMES_SPECIFIC_PERSISTED_MEMORY_STATE'] == 'NOT_ESTABLISHED'
          assert d['current_matrix']['PERSISTED_JAMES_STATE_CANDIDATE'] == 'NOT_YET_ADMITTED'
          print('VAULT112_BLIND_CLAIM_CEILING=PASS')
          PY
